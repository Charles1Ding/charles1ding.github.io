    <script>
        // --- 核心物理常量 ---
        const CANVAS_WIDTH = 650;
        const CANVAS_HEIGHT = 450;
        const CELL_X = 120;
        const CELL_Y = 100;
        const CELL_W = 480;
        const CELL_H = 300;

        const MELTING_POINT_PURE = 2050;
        const MELTING_POINT_CRYOLITE = 950;
        
        const VISCOSITY_BASE = 0.92; 
        const RADIUS_AL = 12;
        const RADIUS_O = 16;
        const RADIUS_ATOM = 13;
        const RADIUS_CRYOLITE = 11;

        const ANODE_COUNT = 4;
        const BASE_ANODE_W = 60;
        const BASE_ANODE_H = 80;
        const ANODE_SPACING = (CELL_W - 120) / (ANODE_COUNT - 1);

        // --- 系统状态 ---
        const state = {
            stage: 'solid',
            isPowerOn: false,
            temp: 25,
            hasCryolite: false,
            aluminumYield: 0,
            isTapping: false,
            reactionSpeed: 30, // 初始调低反应速度，让氧气产生更慢
            anodeHealth: 100,
            particles: [],
            bubbles: [],
            electronEffects: []
        };

        const canvas = document.getElementById('electrolysisCanvas');
        const ctx = canvas.getContext('2d');

        function initParticles(append = false) {
            const newParticles = [];
            const rows = 5;
            const cols = 12;
            const spacingX = 38;
            const spacingY = 32;
            const startX = CELL_X + 25;
            const startY = 220; 

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const isAl = (i + j) % 5 < 2;
                    newParticles.push({
                        x: startX + j * spacingX,
                        y: startY + i * spacingY,
                        originX: startX + j * spacingX,
                        originY: startY + i * spacingY,
                        type: isAl ? 'Al3+' : 'O2-',
                        vx: 0, vy: 0,
                        state: 'ion',
                        id: Math.random()
                    });
                }
            }
            if (append) state.particles.push(...newParticles.slice(0, 10));
            else state.particles = newParticles;
        }

        function addCryoliteParticles() {
            const startX = CELL_X + 40;
            const startY = 135; 
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 10; j++) {
                    state.particles.push({
                        x: startX + j * 42,
                        y: startY + i * 35,
                        originX: startX + j * 42,
                        originY: startY + i * 35,
                        type: 'Cryolite',
                        vx: 0, vy: 0,
                        state: 'ion',
                        id: Math.random()
                    });
                }
            }
        }

        function update() {
            const currentMeltingPoint = state.hasCryolite ? MELTING_POINT_CRYOLITE : MELTING_POINT_PURE;
            state.stage = state.temp >= currentMeltingPoint ? (state.isPowerOn ? 'electrolysis' : 'molten') : 'solid';

            const speedFactor = state.reactionSpeed / 50;
            const thermalAgitation = (state.temp / 2500) * 1.5; 

            state.particles.forEach((p, i) => {
                const r = p.type === 'Cryolite' ? RADIUS_CRYOLITE : (p.state === 'atom' ? RADIUS_ATOM : (p.type === 'Al3+' ? RADIUS_AL : RADIUS_O));

                if (state.stage === 'solid') {
                    const vibeScale = (state.temp / currentMeltingPoint) * 5; 
                    p.x = p.originX + Math.sin(Date.now() / 40 + p.id * 10) * vibeScale;
                    p.y = p.originY + Math.cos(Date.now() / 40 + p.id * 10) * vibeScale;
                    p.vx = 0; p.vy = 0;
                } else {
                    p.vy += 0.08; 
                    const visFactor = state.temp > 1500 ? 0.96 : 0.92;
                    p.vx *= visFactor;
                    p.vy *= visFactor;

                    p.vx += (Math.random() - 0.5) * thermalAgitation;
                    p.vy += (Math.random() - 0.5) * thermalAgitation;

                    if (state.stage === 'electrolysis' && p.type !== 'Cryolite') {
                        if (p.type === 'Al3+') {
                            const electroForce = 0.15 * speedFactor;
                            p.vy += electroForce; 
                        } else if (p.type === 'O2-') {
                            // --- 强化 Anode 吸引逻辑 ---
                            // 所有的氧离子一旦通电，立即表现出极其强烈的向阳极趋势
                            const strongElectroForce = 0.6 * speedFactor; // 大幅增加引力
                            
                            let closestAnodeX = CELL_X + CELL_W / 2;
                            let minXDist = Infinity;
                            for(let k=0; k < ANODE_COUNT; k++) {
                                const ax = CELL_X + 60 + k * ANODE_SPACING + BASE_ANODE_W/2;
                                const d = Math.abs(p.x - ax);
                                if (d < minXDist) { minXDist = d; closestAnodeX = ax; }
                            }
                            
                            p.vy -= strongElectroForce; // 强力向上
                            p.vx += (closestAnodeX - p.x) * 0.15 * speedFactor; // 强力水平靠拢
                        }
                    }

                    if (state.isTapping && p.state === 'atom') {
                        p.vx += (CELL_X - p.x) * 0.2;
                        p.vy += (CELL_Y + CELL_H - 35 - p.y) * 0.2;
                    }

                    p.x += p.vx;
                    p.y += p.vy;

                    // 碰撞逻辑
                    for (let j = i + 1; j < state.particles.length; j++) {
                        const p2 = state.particles[j];
                        const r2 = p2.type === 'Cryolite' ? RADIUS_CRYOLITE : (p2.state === 'atom' ? RADIUS_ATOM : (p2.type === 'Al3+' ? RADIUS_AL : RADIUS_O));
                        const dx = p2.x - p.x;
                        const dy = p2.y - p.y;
                        const minDist = r + r2;
                        const distSq = dx * dx + dy * dy;

                        if (distSq < minDist * minDist) {
                            const dist = Math.sqrt(distSq) || 1;
                            const overlap = (minDist - dist) * 0.5;
                            const nx = dx / dist;
                            const ny = dy / dist;
                            p.x -= nx * overlap; p.y -= ny * overlap;
                            p2.x += nx * overlap; p2.y += ny * overlap;
                            const damping = 0.3 + thermalAgitation * 0.1;
                            p.vx -= nx * damping; p.vy -= ny * damping;
                            p2.vx += nx * damping; p2.vy += ny * damping;
                        }
                    }

                    if (p.x < CELL_X + r + 5) { p.vx *= -0.5; p.x = CELL_X + r + 5; }
                    if (p.x > CELL_X + CELL_W - r - 5) { p.vx *= -0.5; p.x = CELL_X + CELL_W - r - 5; }
                    if (p.y > CELL_Y + CELL_H - r - 20) { p.vy *= -0.3; p.y = CELL_Y + CELL_H - r - 20; }
                    if (p.y < CELL_Y + r + 15) { p.vy *= -0.2; p.y = CELL_Y + r + 15; }
                }
            });

            // 过滤排出系统或发生反应的微粒
            state.particles = state.particles.filter(p => {
                if (state.isTapping && p.state === 'atom' && p.x < CELL_X + 15) return false;
                
                if (state.stage === 'electrolysis' && p.state === 'ion' && state.anodeHealth > 5 && p.type !== 'Cryolite') {
                    // --- 慢速反应逻辑 ---
                    const cathProb = 0.15 * speedFactor; // 阴极反应维持正常速度
                    const anodeProb = 0.02 * speedFactor; // 显著调低阳极反应概率，使其“变慢”

                    if (p.type === 'Al3+' && p.y > CELL_Y + CELL_H - 65) {
                        if (Math.random() < cathProb) {
                            state.aluminumYield = Math.min(100, state.aluminumYield + 1.5);
                            for(let i=0; i<3; i++) state.electronEffects.push({startX: p.x, startY: CELL_Y + CELL_H, endX: p.x, endY: p.y, progress: 0});
                            p.state = 'atom';
                        }
                    }
                    if (p.type === 'O2-' && p.y < CELL_Y + 75) {
                        const inAnodeRange = Array.from({length: ANODE_COUNT}).some((_, k) => {
                            const ax = CELL_X + 60 + k * ANODE_SPACING;
                            return p.x > ax - 5 && p.x < ax + BASE_ANODE_W + 5;
                        });
                        // 即使被强力吸引到了阳极，失去电子的速度也非常缓慢
                        if (inAnodeRange && Math.random() < anodeProb) {
                            state.anodeHealth = Math.max(0, state.anodeHealth - 2.5);
                            for(let i=0; i<2; i++) state.electronEffects.push({startX: p.x, startY: p.y, endX: p.x, endY: CELL_Y + 20, progress: 0});
                            if (Math.random() > 0.3) state.bubbles.push({ x: p.x, y: p.y, r: 4, opacity: 1 });
                            return false; 
                        }
                    }
                }
                return true;
            });

            state.electronEffects = state.electronEffects.map(e => ({ ...e, progress: e.progress + 0.15 })).filter(e => e.progress < 1);
            state.bubbles = state.bubbles.map(b => ({ ...b, y: b.y - 1.2, r: b.r + 0.15, opacity: b.opacity - 0.01 })).filter(b => b.opacity > 0);
            if (state.isTapping && state.aluminumYield > 0) state.aluminumYield = Math.max(0, state.aluminumYield - 0.5);
        }

        function renderLoop() {
            update();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const heatAlpha = Math.max(0, (state.temp - 500) / 4000);
            ctx.fillStyle = `rgba(255, 69, 0, ${heatAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(0, CELL_Y + CELL_H - 10, CELL_X - 40, 40);
            if (state.isTapping && state.aluminumYield > 0) {
                const tapY = CELL_Y + CELL_H - 35;
                ctx.beginPath(); ctx.moveTo(CELL_X, tapY);
                ctx.bezierCurveTo(CELL_X - 40, tapY, CELL_X - 70, tapY + 20, CELL_X - 70, CANVAS_HEIGHT);
                ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.stroke();
                ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 6; ctx.setLineDash([15, 8]); ctx.lineDashOffset = Date.now() / 15; ctx.stroke();
            }

            if (state.stage !== 'solid') {
                ctx.fillStyle = '#fff7ed'; ctx.globalAlpha = 0.5;
                ctx.fillRect(CELL_X + 5, CELL_Y + 45, CELL_W - 10, CELL_H - 65);
                ctx.globalAlpha = 1.0;
            }
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 12; ctx.lineJoin = 'round';
            ctx.strokeRect(CELL_X, CELL_Y, CELL_W, CELL_H);

            for(let k=0; k < ANODE_COUNT; k++) {
                const ax = CELL_X + 60 + k * ANODE_SPACING;
                const currentW = BASE_ANODE_W * (0.7 + (state.anodeHealth/100) * 0.3);
                const currentH = BASE_ANODE_H * (state.anodeHealth / 100);
                const drawX = ax + (BASE_ANODE_W - currentW) / 2;
                const grad = ctx.createLinearGradient(drawX, CELL_Y - 50, drawX + currentW, CELL_Y - 50);
                grad.addColorStop(0, '#1e293b'); grad.addColorStop(0.5, '#4b5563'); grad.addColorStop(1, '#0f172a');
                ctx.fillStyle = grad;
                if (state.anodeHealth > 0) ctx.fillRect(drawX, CELL_Y - 50, currentW, currentH);
            }

            ctx.fillStyle = '#1e293b'; ctx.fillRect(CELL_X + 6, CELL_Y + CELL_H - 22, CELL_W - 12, 18);
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText("Cathode (-) Carbon Lining", CELL_X + CELL_W / 2, CELL_Y + CELL_H + 25);
            ctx.fillStyle = '#334155'; ctx.font = 'bold 16px sans-serif';
            ctx.fillText("Anode (+) Graphite", CELL_X + CELL_W / 2, CELL_Y - 80);

            state.particles.forEach(p => {
                const r = p.type === 'Cryolite' ? RADIUS_CRYOLITE : (p.state === 'atom' ? RADIUS_ATOM : (p.type === 'Al3+' ? RADIUS_AL : RADIUS_O));
                ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(p.x - r/3, p.y - r/3, r/10, p.x, p.y, r);
                if (p.type === 'Cryolite') {
                    grad.addColorStop(0, '#ecfdf5'); grad.addColorStop(0.4, '#34d399'); grad.addColorStop(1, '#065f46');
                } else if (p.state === 'atom') {
                    grad.addColorStop(0, '#f8fafc'); grad.addColorStop(0.4, '#cbd5e1'); grad.addColorStop(1, '#475569');
                } else if (p.type === 'Al3+') {
                    grad.addColorStop(0, '#dbeafe'); grad.addColorStop(0.4, '#60a5fa'); grad.addColorStop(1, '#1e40af');
                } else {
                    grad.addColorStop(0, '#fee2e2'); grad.addColorStop(0.4, '#f87171'); grad.addColorStop(1, '#991b1b');
                }
                ctx.fillStyle = grad; ctx.fill();
                ctx.fillStyle = (p.state === 'atom' || p.type === 'Cryolite') ? '#0f172a' : 'white';
                ctx.font = `bold ${r * 0.7}px Arial`; 
                let label = p.state === 'atom' ? 'Al' : (p.type === 'Al3+' ? 'Al³' : (p.type === 'O2-' ? 'O²' : 'Cry'));
                ctx.fillText(label, p.x, p.y + (r*0.3));
            });

            state.electronEffects.forEach(e => {
                const curX = e.startX + (e.endX - e.startX) * e.progress;
                const curY = e.startY + (e.endY - e.startY) * e.progress;
                ctx.beginPath(); ctx.arc(curX, curY, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fbbf24'; ctx.shadowBlur = 12; ctx.shadowColor = '#fbbf24';
                ctx.fill(); ctx.shadowBlur = 0;
            });

            if (state.aluminumYield > 0) {
                const grad = ctx.createLinearGradient(0, CELL_Y + CELL_H - 22 - (state.aluminumYield * 0.6), 0, CELL_Y + CELL_H - 22);
                grad.addColorStop(0, '#f8fafc'); grad.addColorStop(0.5, '#cbd5e1'); grad.addColorStop(1, '#64748b');
                ctx.fillStyle = grad;
                const liquidH = Math.min(state.aluminumYield * 0.6, 95);
                ctx.fillRect(CELL_X + 6, CELL_Y + CELL_H - 22 - liquidH, CELL_W - 12, liquidH);
            }

            state.bubbles.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(224, 242, 254, ${b.opacity})`; ctx.strokeStyle = `rgba(186, 230, 253, ${b.opacity})`;
                ctx.lineWidth = 1; ctx.stroke(); ctx.fill();
                if (b.opacity > 0.5) { ctx.fillStyle = `rgba(71, 85, 105, ${b.opacity})`; ctx.font = `${b.r * 0.6}px sans-serif`; ctx.fillText("CO₂", b.x, b.y + b.r * 0.3); }
            });

            if (state.isPowerOn) {
                ctx.beginPath();
                if (state.stage === 'electrolysis' && state.anodeHealth > 5) {
                    ctx.setLineDash([10, 5]); ctx.lineDashOffset = -Date.now() / 15;
                    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 6;
                } else { ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3; }
                ctx.moveTo(CELL_X + CELL_W, CELL_Y + CELL_H - 12);
                ctx.lineTo(CANVAS_WIDTH - 15, CELL_Y + CELL_H - 12);
                ctx.lineTo(CANVAS_WIDTH - 15, CELL_Y - 30);
                ctx.lineTo(CELL_X + CELL_W - 80, CELL_Y - 30);
                ctx.stroke(); ctx.setLineDash([]);
            }

            const ionsEl = document.getElementById('activeIonsCount');
            if (ionsEl) {
                const count = state.particles.filter(p => p.state === 'ion').length;
                ionsEl.innerText = count;
                ionsEl.className = `font-black ml-2 ${count < 10 ? 'text-red-500 animate-pulse' : 'text-blue-600'}`;
            }
            document.getElementById('yieldValue').innerText = Math.floor(state.aluminumYield) + '%';
            document.getElementById('yieldBar').style.width = state.aluminumYield + '%';
            document.getElementById('criticalAnodeAlert').classList.toggle('hidden', state.anodeHealth >= 20);
            document.getElementById('powerValueDisplay').innerText = (state.stage === 'electrolysis' && state.anodeHealth > 5) ? '420 kA' : '0 A';
            document.getElementById('powerIconBox').className = `p-4 rounded-2xl ${state.isPowerOn && state.stage === 'electrolysis' && state.anodeHealth > 5 ? 'bg-yellow-100 text-yellow-600 animate-pulse' : 'bg-slate-100 text-slate-400'}`;

            requestAnimationFrame(renderLoop);
        }

        document.getElementById('tempSlider').addEventListener('input', (e) => {
            state.temp = parseInt(e.target.value);
            document.getElementById('tempVal').innerText = state.temp + '°C';
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            state.reactionSpeed = parseInt(e.target.value);
        });

        document.getElementById('cryoliteBtn').addEventListener('click', () => {
            state.hasCryolite = true;
            addCryoliteParticles();
            document.getElementById('cryoliteBtn').disabled = true;
            document.getElementById('cryoliteBtn').innerText = '冰晶石已加入并正在溶解 Al₂O₃';
            document.getElementById('cryoliteBtn').className = "w-full py-4 px-4 rounded-2xl font-black bg-emerald-50 text-emerald-600 border border-emerald-200 cursor-default text-xs";
            document.getElementById('meltingPointTag').innerText = '熔点: 950°C';
        });

        document.getElementById('powerBtn').addEventListener('click', () => {
            state.isPowerOn = !state.isPowerOn;
            const btn = document.getElementById('powerBtn');
            if (state.isPowerOn) {
                btn.innerText = '切断直流电源'; btn.classList.replace('bg-yellow-400', 'bg-red-500'); btn.classList.add('text-white');
            } else {
                btn.innerText = '开启直流电解'; btn.classList.replace('bg-red-500', 'bg-yellow-400'); btn.classList.remove('text-white');
            }
        });

        document.getElementById('flushBtn').addEventListener('click', () => {
            if (state.aluminumYield > 0) {
                state.isTapping = !state.isTapping;
                document.getElementById('flushBtn').innerText = state.isTapping ? '停止排铝...' : '一键排空铝液';
                if (state.isTapping) document.getElementById('flushBtn').classList.add('bg-orange-600', 'animate-pulse');
                else document.getElementById('flushBtn').classList.remove('bg-orange-600', 'animate-pulse');
            }
        });

        document.getElementById('replenishBtn').addEventListener('click', () => initParticles(true));
        document.getElementById('replaceAnodeBtn').addEventListener('click', () => state.anodeHealth = 100);
        document.getElementById('resetBtn').addEventListener('click', () => window.location.reload());

        window.onload = () => { initParticles(); renderLoop(); };
    </script>
</body>
</html>

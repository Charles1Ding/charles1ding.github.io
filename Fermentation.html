    <style>
        .beaker-container {
            position: relative;
            width: 380px; 
            height: 520px;
            border: 8px solid #cbd5e1;
            border-top: none;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #fbbf24, #fef3c7);
            transition: height 0.5s ease;
        }
        .bubble {
            position: absolute;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-480px); opacity: 0; }
        }
        .yeast-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #92400e;
            border-radius: 50%;
            opacity: 0.8;
        }
        .beaker-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 15%;
            height: 100%;
            background: rgba(255,255,255,0.15);
            pointer-events: none;
        }
        /* Extreme temperature effects */
        .heat-glow {
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.5) inset;
        }
        .cold-frost {
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.3) inset;

                    <div id="abvStatus" class="mt-2 text-[10px] font-bold text-slate-400 bg-slate-50 px-3 py-1 rounded-full text-center italic">

                        <span id="glcPct" class="text-indigo-600 font-black text-sm">100%</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div id="glcBar" class="bg-indigo-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
                    </div>
                    <div class="mt-4 flex flex-col gap-1 text-slate-400 text-[9px] font-bold uppercase tracking-tight">

                            <div class="w-1.5 h-1.5 bg-slate-400 rounded-full"></div> CO₂ 生成排放中

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const INITIAL_GLUCOSE = 100.0;
        const SOLUTION_VOLUME_ML = 1000; 
        const ETHANOL_DENSITY = 0.789; 

        let state = {
            glucose: INITIAL_GLUCOSE,
            ethanolMass: 0,
            yeast: 0,
            temp: 30,
            isRunning: true,
            yeastDead: false 
        };

        const M_GLC = 180.16;
        const M_ETH = 46.07;

        function calculateRate() {
            if (state.glucose <= 0 || state.yeast <= 0 || state.yeastDead) return 0;
            
            // Death logic: Protein denaturation at high temp
            if (state.temp >= 45) {
                state.yeastDead = true;
                return 0;
            }
            
            let tempFactor = 0;
            if (state.temp < 10) {
                tempFactor = 0.01; // Latent activity at near-freezing
            } else {
                // Bell curve centered at 30C
                tempFactor = Math.max(0, 1 - Math.pow((state.temp - 30) / 15, 2));
                // Base minimal activity between 10C and 45C
                tempFactor = Math.max(tempFactor, 0.05);
            }

            const baseK = 0.035; // Reaction speed constant
            return baseK * state.yeast * tempFactor;
        }

        function update() {
            if (!state.isRunning) return;
            const rate = calculateRate();
            if (rate > 0) {
                const consumed = Math.min(state.glucose, rate / 60); 
                state.glucose -= consumed;
                const mol = consumed / M_GLC;
                state.ethanolMass += mol * 2 * M_ETH;
                
                // Bubbling visual frequency
                if (Math.random() < (rate * 0.2)) {
                    createBubble();
                }
            }
            updateUI(rate);
            requestAnimationFrame(update);
        }

        function updateUI(rate) {
            const ethanolVol = state.ethanolMass / ETHANOL_DENSITY;
            const abv = (ethanolVol / SOLUTION_VOLUME_ML) * 100;
            document.getElementById('abvDisplay').textContent = abv.toFixed(1);
            
            const glcPct = (state.glucose / INITIAL_GLUCOSE) * 100;
            document.getElementById('glcPct').textContent = Math.ceil(glcPct) + '%';
            document.getElementById('glcBar').style.width = glcPct + '%';
            
            const lifeStatus = document.getElementById('yeastLifeStatus');
            const addBtn = document.getElementById('addYeastBtn');
            const warning = document.getElementById('yeastWarning');

            if (state.yeastDead) {
                lifeStatus.textContent = "灭活死亡";
                lifeStatus.className = "font-bold text-red-600";
                addBtn.disabled = true;
                warning.classList.remove('hidden');
            } else if (state.yeast > 0) {
                if (state.temp < 15) {
                    lifeStatus.textContent = "低温休眠";
                    lifeStatus.className = "font-bold text-blue-400";
                } else if (state.temp > 40) {
                    lifeStatus.textContent = "热应激";
                    lifeStatus.className = "font-bold text-orange-500 animate-pulse";
                } else {
                    lifeStatus.textContent = "最佳活性 x" + state.yeast.toFixed(0);
                    lifeStatus.className = "font-bold text-green-600";
                }
            }

            const led = document.getElementById('rateLed');
            const rateDesc = document.getElementById('reactRateDesc');
            if (rate > 0.001) {
                led.className = "w-2 h-2 rounded-full bg-green-500 animate-pulse";
                rateDesc.textContent = rate > 0.6 ? "FAST" : "ACTIVE";
                rateDesc.className = "font-bold text-green-600";
                document.getElementById('abvStatus').textContent = "正在转化酒精...";
                document.getElementById('co2Status').textContent = "状态: 气体生成中";
            } else {
                led.className = "w-2 h-2 rounded-full bg-slate-300";
                rateDesc.textContent = state.glucose <= 0.1 ? "DONE" : "IDLE";
                rateDesc.className = "font-bold text-slate-400 text-right";
                if (state.glucose <= 0.1) {
                    document.getElementById('abvStatus').textContent = "反应已耗尽";
                    document.getElementById('co2Status').textContent = "状态: 已完全发酵";
                }
            }
            
            // Container dynamic effects
            const beaker = document.getElementById('beaker');
            if (state.temp > 55) beaker.className = "beaker-container heat-glow";
            else if (state.temp < 10) beaker.className = "beaker-container cold-frost";
            else beaker.className = "beaker-container";

            document.getElementById('liquidLevel').style.height = (65 + glcPct * 0.2) + '%';
        }

        document.getElementById('tempRange').addEventListener('input', (e) => {
            state.temp = parseFloat(e.target.value);
            document.getElementById('tempVal').textContent = state.temp;
            
            const icon = document.getElementById('tempStatusIcon');
            if (state.temp < 15) icon.textContent = "❄️";
            else if (state.temp > 45) icon.textContent = "🔥";
            else icon.textContent = "🌡️";
        });

        document.getElementById('addYeastBtn').addEventListener('click', () => {
            if (state.yeastDead) return;
            state.yeast += 1.0;
            for(let i=0; i<15; i++) {
                const p = document.createElement('div');
                p.className = 'yeast-particle';
                p.style.left = Math.random() * 90 + 5 + '%';
                p.style.top = (30 + Math.random() * 60) + '%';
                document.getElementById('yeastContainer').appendChild(p);
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            state = { glucose: INITIAL_GLUCOSE, ethanolMass: 0, yeast: 0, temp: 30, isRunning: true, yeastDead: false };
            document.getElementById('yeastContainer').innerHTML = '';
            document.getElementById('bubbleContainer').innerHTML = '';
            document.getElementById('tempRange').value = 30;
            document.getElementById('tempVal').textContent = "30.0";
            document.getElementById('yeastLifeStatus').textContent = "无菌种";
            document.getElementById('abvStatus').textContent = "等待发酵开始";
            document.getElementById('yeastWarning').classList.add('hidden');
            document.getElementById('addYeastBtn').disabled = false;
        });

        function createBubble() {
            const container = document.getElementById('bubbleContainer');
            const b = document.createElement('div');
            const size = Math.random() * 14 + 5;
            b.className = 'bubble';
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.left = Math.random() * 100 + '%';
            b.style.animationDuration = (Math.random() * 2 + 1) + 's';
            container.appendChild(b);
            setTimeout(() => b.remove(), 3000);
        }

        update();
    </script>

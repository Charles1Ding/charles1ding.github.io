<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bond Energy Calculator</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#f1f5f9; color:#0f172a; min-height:100vh; padding:28px 18px;
    font-family:system-ui,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1000px; margin:0 auto; background:#fff; border:1px solid #e2e8f0; border-radius:26px;
    padding:32px 40px 42px; box-shadow:0 25px 50px -12px rgba(15,23,42,.25);}
  @media(max-width:640px){ .wrap{padding:22px 18px 30px;} }
  .hdr{text-align:center; margin-bottom:26px;}
  .hdr h1{margin:0 0 7px; font-size:31px; line-height:1.15; font-weight:900; letter-spacing:-.02em; color:#0f172a;}
  .hdr .sub{margin:0; font-size:16px; font-style:italic; color:#64748b;}
  @media(max-width:640px){ .hdr h1{font-size:24px;} }
  .legend{display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-bottom:24px; font-size:13.5px; font-weight:700; color:#475569;}
  .legend .it{display:inline-flex; align-items:center; gap:8px;}
  .legend .dot{width:15px; height:15px; border-radius:9999px; border:1px solid #334155; display:inline-block;}
  .ctrl{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center;
    background:#eff6ff; border:2px solid #dbeafe; border-radius:18px; padding:18px 22px;
    box-shadow:0 4px 6px -1px rgba(15,23,42,.06); margin-bottom:26px;}
  .slider-wrap{display:inline-flex; align-items:center; gap:10px;}
  .slider-wrap .ctl-label{font-weight:800; color:#1e40af; font-size:14px;}
  .slider-wrap .val{font-size:13px; font-weight:800; color:#1e40af; min-width:40px; text-align:right;}
  input[type=range]{-webkit-appearance:none; appearance:none; height:8px; border-radius:8px; background:#bfdbfe; outline:none; width:150px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; height:22px; width:22px; border-radius:50%; background:#2563eb; border:3px solid #fff; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.3); margin-top:-7px;}
  input[type=range]::-moz-range-thumb{height:22px; width:22px; border:none; border-radius:50%; background:#2563eb; cursor:pointer;}
  button.btn{border:none; border-radius:12px; padding:11px 18px; font-size:13.5px; font-weight:800;
    cursor:pointer; transition:background .18s,color .18s,transform .18s,box-shadow .18s;}
  button.btn:hover{transform:translateY(-1px);}
  button.btn.ghost{background:#fff; color:#1d4ed8; border:1.5px solid #bfdbfe;}
  button.btn.ghost:hover{background:#eff6ff;}
  button.btn.active{background:#1d4ed8; color:#fff; border-color:#1d4ed8; box-shadow:0 10px 20px -10px rgba(29,78,216,.85);}
  .stage{background:#f8fafc; border:1px dashed #cbd5e1; border-radius:18px; padding:10px; margin-bottom:26px;}
  .stage svg{width:100%; height:auto; display:block;}
  .summary{background:#0f172a; color:#e2e8f0; border-radius:18px; padding:22px 26px; font-size:15.5px; line-height:1.65; transition:background .35s;}
  .summary .em{color:#7dd3fc; font-weight:800;}
  .summary .in{color:#fbbf24; font-weight:800;}
  .summary .out{color:#34d399; font-weight:800;}
  .summary.hot{background:#064e3b;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <h1>Bond Energy Calculator</h1>
    <p class="sub">IG CIE 0620 · Chapter 8.3 · ΔH = Σ(bonds broken) − Σ(bonds formed)</p>
  </header>
  <div class="legend" id="legend"></div>
  <div class="ctrl" id="controls"></div>
  <div class="stage">
    <svg id="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" aria-label="bond energy tally">
      <defs>
        <radialGradient id="gAmber" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
          <stop offset="42%" stop-color="#f59e0b" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gEmer" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#10b981" stop-opacity="0.95"/>
          <stop offset="42%" stop-color="#10b981" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <line x1="320" y1="40" x2="320" y2="250" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,8"/>
      <g id="listIn"></g>
      <g id="listOut"></g>
      <g id="pkIn"></g>
      <g id="pkOut"></g>
      <rect x="150" y="286" width="340" height="62" rx="14" fill="#ffffff" fill-opacity="0.6" stroke="#e2e8f0" stroke-width="1"/>
      <rect id="barIn"  x="170" y="302" height="14" rx="7" fill="#f59e0b"/>
      <rect id="barOut" x="170" y="326" height="14" rx="7" fill="#10b981"/>
    </svg>
  </div>
  <div class="summary" id="summary"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function txt(x,y,s,fill,size){ const t=mk('text',{x:x,y:y,'text-anchor':'middle','dominant-baseline':'central',fill:fill,'font-size':size,'font-weight':'bold'}); t.textContent=s; return t; }
const COL={ H:{f:'#f1f5f9',s:'#94a3b8',t:'#475569'}, C:{f:'#cbd5e1',s:'#64748b',t:'#334155'},
  N:{f:'#3b82f6',s:'#1e3a8a',t:'#fff'}, O:{f:'#ef4444',s:'#991b1b',t:'#fff'},
  Cl:{f:'#f87171',s:'#b91c1c',t:'#fff'}, Br:{f:'#b91c1c',s:'#7f1d1d',t:'#fff'} };

const listIn=document.getElementById('listIn'), listOut=document.getElementById('listOut');
const pkIn=document.getElementById('pkIn'), pkOut=document.getElementById('pkOut');
const barIn=document.getElementById('barIn'), barOut=document.getElementById('barOut');
const _legend=document.getElementById('legend'), _controls=document.getElementById('controls'), _summary=document.getElementById('summary');

const RXNS={
  HCl:{ eq:'H₂ + Cl₂  →  2 HCl', broken:[['H-H',1,436],['Cl-Cl',1,243]], formed:[['H-Cl',2,432]] },
  NH3:{ eq:'N₂ + 3 H₂  →  2 NH₃', broken:[['N≡N',1,945],['H-H',3,436]], formed:[['N-H',6,391]] },
  comb:{ eq:'CH₄ + 2 O₂  →  CO₂ + 2 H₂O', broken:[['C-H',4,413],['O=O',2,498]], formed:[['C=O',2,805],['O-H',4,463]] },
  NO:{ eq:'N₂ + O₂  →  2 NO', broken:[['N≡N',1,945],['O=O',1,498]], formed:[['N=O',2,632]] }
};
let key='HCl', challenge=false, hiddenVal=243, t=0;
let b1,b2,b3,b4, chSlider;

function makeMol(cx,cy,name,tint){
  const m=name.match(/^([A-Za-z]+)\s*([=≡-])\s*([A-Za-z]+)$/);
  const a1=m?m[1]:'H', a2=m?m[3]:'H';
  const order=m?(m[2]==='≡'?3:m[2]==='='?2:1):1;
  const r=13, gap=r*2+18, g=mk('g',{});
  for(let k=0;k<order;k++){ const off=(order===1)?0:(k-(order-1)/2)*7;
    g.appendChild(mk('line',{x1:cx-gap,y1:cy+off,x2:cx+gap,y2:cy+off,stroke:tint,'stroke-width':4,'stroke-linecap':'round'})); }
  [ [a1,cx-gap], [a2,cx+gap] ].forEach(p=>{ const c=COL[p[0]];
    const cg=mk('g',{transform:'translate('+p[1]+','+cy+')'});
    cg.appendChild(mk('circle',{r:r,fill:c.f,stroke:c.s,'stroke-width':1.4}));
    cg.appendChild(txt(0,0,p[0],c.t,12));
    g.appendChild(cg); });
  return g;
}
function drawList(entries,x0,x1,yTop,tint,g){
  g.innerHTML='';
  const rowH=(250-yTop)/Math.max(entries.length,1);
  entries.forEach((e,i)=>{
    const y=yTop+rowH*(i+0.5), n=Math.min(e.n,4), molW=Math.min(110,(x1-x0)/n);
    for(let k=0;k<n;k++) g.appendChild(makeMol(x0+molW*(k+0.5), y, e.name, tint));
  });
}

const pkI=[], pkO=[];
for(let i=0;i<8;i++){
  const g1=mk('g',{opacity:0}); g1.appendChild(mk('circle',{r:12,fill:'url(#gAmber)'})); pkIn.appendChild(g1); pkI.push(g1);
  const g2=mk('g',{opacity:0}); g2.appendChild(mk('circle',{r:12,fill:'url(#gEmer)'}));  pkOut.appendChild(g2); pkO.push(g2);
}

function setLegend(){ _legend.innerHTML='';
  [['#f59e0b','bonds broken (energy IN)'],['#10b981','bonds formed (energy OUT)']].forEach(it=>{ const s=document.createElement('span'); s.className='it';
    s.innerHTML='<i class="dot" style="background:'+it[0]+'"></i><span>'+it[1]+'</span>'; _legend.appendChild(s); }); }
function addButton(text,onClick,cls){ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=text; b.addEventListener('click',()=>onClick(b)); _controls.appendChild(b); return b; }
function addToggle(text,onChange,cls){ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=text;
  b.addEventListener('click',()=>{ b.classList.toggle('active'); onChange(b.classList.contains('active')); }); _controls.appendChild(b); return b; }
function addSlider(text,min,max,val,onInput){
  const wrap=document.createElement('div'); wrap.className='slider-wrap';
  const lab=document.createElement('span'); lab.className='ctl-label'; lab.textContent=text;
  const inp=document.createElement('input'); inp.type='range'; inp.min=min; inp.max=max; inp.value=val;
  const v=document.createElement('span'); v.className='val'; v.textContent=val;
  inp.addEventListener('input',e=>{ const x=parseFloat(e.target.value); v.textContent=x; onInput(x); });
  wrap.appendChild(lab); wrap.appendChild(inp); wrap.appendChild(v); _controls.appendChild(wrap);
  return {wrap:wrap,inp:inp,set:vv=>{ inp.value=vv; v.textContent=vv; }};
}

let IN=0, OUT=0, dH=0, target=0;
function update(){
  const rx=RXNS[key];
  const broken=rx.broken.map((b,i)=>({name:b[0],n:b[1],e:(challenge&&i===0)?hiddenVal:b[2]}));
  const formed=rx.formed.map(b=>({name:b[0],n:b[1],e:b[2]}));
  IN=broken.reduce((s,b)=>s+b.n*b.e,0);
  OUT=formed.reduce((s,b)=>s+b.n*b.e,0);
  dH=IN-OUT;
  target=rx.broken.reduce((s,b)=>s+b.n*b[2],0)-rx.formed.reduce((s,b)=>s+b.n*b[2],0);
  const maxV=Math.max(IN,OUT,1);
  barIn.setAttribute('width', Math.max(6,260*(IN/maxV)).toFixed(1));
  barOut.setAttribute('width', Math.max(6,260*(OUT/maxV)).toFixed(1));
  const dHtxt=(dH>0?'+':'')+dH, kind=dH<=0?'exothermic':'endothermic';
  if(challenge){
    const ok=Math.abs(dH-target)<6;
    _summary.innerHTML='<b>'+rx.eq+'</b><br>Target ΔH = '+(target>0?'+':'')+target+' kJ/mol · current ΔH = '+dHtxt+' kJ/mol. '
      + (ok?'✓ <b>Correct — bond energy found.</b>':'Adjust the slider until the calculated ΔH matches the target.');
    _summary.classList.toggle('hot', ok);
  } else {
    _summary.innerHTML='<b>'+rx.eq+'</b><br>Σ <span class="in">IN</span> (bonds broken) = '+IN+' kJ/mol · '
      + 'Σ <span class="out">OUT</span> (bonds formed) = '+OUT+' kJ/mol → <span class="em">ΔH = '+dHtxt+' kJ/mol ('+kind+')</span>.';
    _summary.classList.toggle('hot', dH<=0);
  }
}
function setRxn(k){ if(!RXNS[k]) return; key=k;
  b1.classList.toggle('active',k==='HCl'); b2.classList.toggle('active',k==='NH3');
  b3.classList.toggle('active',k==='comb'); b4.classList.toggle('active',k==='NO');
  hiddenVal=RXNS[k].broken[0][2]; if(challenge) hiddenVal=Math.round(hiddenVal*0.6); chSlider.set(hiddenVal);
  const rx=RXNS[k];
  drawList(rx.broken, 30, 310, 70, '#f59e0b', listIn);
  drawList(rx.formed, 340, 610, 70, '#10b981', listOut);
  update(); }
function setChallenge(on){ challenge=on; chSlider.wrap.style.display = on?'inline-flex':'none'; setRxn(key); }
b1=addButton('H₂+Cl₂→2HCl', ()=>setRxn('HCl'), 'ghost');
b2=addButton('N₂+3H₂→2NH₃', ()=>setRxn('NH3'), 'ghost');
b3=addButton('CH₄+2O₂→...', ()=>setRxn('comb'), 'ghost');
b4=addButton('N₂+O₂→2NO', ()=>setRxn('NO'), 'ghost');
addToggle('Challenge: find a bond E', (on)=>setChallenge(on), 'ghost');
chSlider=addSlider('Hidden bond E (kJ/mol)', 100, 1200, 243, v=>{ hiddenVal=v; update(); });
chSlider.wrap.style.display='none';
setLegend();

function render(){
  pkI.forEach((g,i)=>{ const ph=((t*0.5+i*0.13)%1);
    g.setAttribute('opacity',(1-ph).toFixed(3));
    g.setAttribute('transform','translate('+(170+Math.sin(i*1.8)*110).toFixed(1)+','+(30+(210-30)*ph).toFixed(1)+')'); });
  pkO.forEach((g,i)=>{ const ph=((t*0.5+i*0.13)%1);
    g.setAttribute('opacity',ph.toFixed(3));
    g.setAttribute('transform','translate('+(470+Math.sin(i*1.8+2)*110).toFixed(1)+','+(210+(30-210)*ph).toFixed(1)+')'); });
}
function frame(){ t+=1/60; render(); requestAnimationFrame(frame); }

setRxn('HCl');
requestAnimationFrame(frame);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple Calorimetry: Fuel Comparison</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#f1f5f9; color:#0f172a; min-height:100vh; padding:28px 18px;
    font-family:system-ui,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1000px; margin:0 auto; background:#fff; border:1px solid #e2e8f0; border-radius:26px;
    padding:32px 40px 42px; box-shadow:0 25px 50px -12px rgba(15,23,42,.25);}
  @media(max-width:640px){ .wrap{padding:22px 18px 30px;} }
  .hdr{text-align:center; margin-bottom:26px;}
  .hdr h1{margin:0 0 7px; font-size:31px; line-height:1.15; font-weight:900; letter-spacing:-.02em; color:#0f172a;}
  .hdr .sub{margin:0; font-size:16px; font-style:italic; color:#64748b;}
  @media(max-width:640px){ .hdr h1{font-size:24px;} }
  .legend{display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-bottom:24px; font-size:13.5px; font-weight:700; color:#475569;}
  .legend .it{display:inline-flex; align-items:center; gap:8px;}
  .legend .dot{width:15px; height:15px; border-radius:9999px; border:1px solid #334155; display:inline-block;}
  .ctrl{display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:center;
    background:#eff6ff; border:2px solid #dbeafe; border-radius:18px; padding:18px 22px;
    box-shadow:0 4px 6px -1px rgba(15,23,42,.06); margin-bottom:26px;}
  .slider-wrap{display:inline-flex; align-items:center; gap:10px;}
  .slider-wrap .ctl-label{font-weight:800; color:#1e40af; font-size:13.5px;}
  .slider-wrap .val{font-size:13px; font-weight:800; color:#1e40af; min-width:34px; text-align:right;}
  input[type=range]{-webkit-appearance:none; appearance:none; height:8px; border-radius:8px; background:#bfdbfe; outline:none; width:130px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; height:22px; width:22px; border-radius:50%; background:#2563eb; border:3px solid #fff; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.3); margin-top:-7px;}
  input[type=range]::-moz-range-thumb{height:22px; width:22px; border:none; border-radius:50%; background:#2563eb; cursor:pointer;}
  button.btn{border:none; border-radius:12px; padding:11px 18px; font-size:13.5px; font-weight:800;
    cursor:pointer; transition:background .18s,color .18s,transform .18s,box-shadow .18s;}
  button.btn:hover{transform:translateY(-1px);}
  button.btn.ghost{background:#fff; color:#1d4ed8; border:1.5px solid #bfdbfe;}
  button.btn.ghost:hover{background:#eff6ff;}
  button.btn.active{background:#1d4ed8; color:#fff; border-color:#1d4ed8; box-shadow:0 10px 20px -10px rgba(29,78,216,.85);}
  .stage{background:#f8fafc; border:1px dashed #cbd5e1; border-radius:18px; padding:10px; margin-bottom:26px;}
  .stage svg{width:100%; height:auto; display:block;}
  .summary{background:#0f172a; color:#e2e8f0; border-radius:18px; padding:22px 26px; font-size:15.5px; line-height:1.65; transition:background .35s;}
  .summary .em{color:#7dd3fc; font-weight:800;}
  .summary .emr{color:#fca5a5; font-weight:800;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <h1>Simple Calorimetry: Fuel Comparison</h1>
    <p class="sub">IG CIE 0620 · Chapter 8.3 · q = m c ΔT and fuel energy per gram</p>
  </header>
  <div class="legend" id="legend"></div>
  <div class="ctrl" id="controls"></div>
  <div class="stage">
    <svg id="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" aria-label="calorimetry experiment">
      <defs>
        <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="48%" stop-color="#eef2f7" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="gMerc" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#b91c1c"/>
          <stop offset="100%" stop-color="#ef4444"/>
        </linearGradient>
        <radialGradient id="gBulb" cx="34%" cy="30%" r="78%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.55"/>
        </radialGradient>
      </defs>

      <!-- beaker + water -->
      <rect x="70" y="70" width="150" height="200" rx="14" fill="#cbd5e1" fill-opacity="0.18"/>
      <rect id="water" x="74" y="132" width="142" height="134" rx="8" fill="rgba(20,184,166,0.07)"/>
      <rect id="wtint" x="74" y="132" width="142" height="134" rx="8" fill="#ef4444" fill-opacity="0"/>
      <rect x="70" y="70" width="150" height="200" rx="14" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="88" y="86" width="7" height="150" rx="3.5" fill="#ffffff" fill-opacity="0.45"/>

      <!-- thermometer (realistic glass, in the water) -->
      <g id="thermo">
        <rect x="184" y="58" width="12" height="200" rx="6" fill="url(#gGlass)" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="190" cy="262" r="14" fill="url(#gBulb)" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="190" cy="262" r="10" fill="url(#gMerc)"/>
        <rect id="mercury" x="186.5" y="170" width="7" height="94" rx="3.5" fill="url(#gMerc)"/>
        <rect x="187" y="66" width="3" height="178" rx="1.5" fill="#ffffff" fill-opacity="0.7"/>
        <g stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round">
          <line x1="199" y1="86"  x2="207" y2="86"/>
          <line x1="199" y1="120" x2="207" y2="120"/>
          <line x1="199" y1="154" x2="207" y2="154"/>
          <line x1="199" y1="188" x2="207" y2="188"/>
          <line x1="199" y1="222" x2="207" y2="222"/>
        </g>
      </g>

      <!-- burner + flame -->
      <rect x="122" y="302" width="46" height="22" rx="6" fill="#cbd5e1"/>
      <rect x="140" y="294" width="10" height="10" fill="#94a3b8"/>
      <g id="flame">
        <ellipse cx="145" cy="284" rx="16" ry="22" fill="#f97316" fill-opacity="0.95"/>
        <ellipse cx="145" cy="286" rx="8" ry="13" fill="#facc15"/>
      </g>

      <!-- fuel bars -->
      <line x1="294" y1="290" x2="616" y2="290" stroke="#cbd5e1" stroke-width="2"/>
      <g id="bars"></g>
      <line id="meas" x1="294" y1="200" x2="616" y2="200" stroke="#ef4444" stroke-width="3" stroke-dasharray="7,5"/>
      <circle id="measDot" cx="294" cy="200" r="5" fill="#ef4444"/>
    </svg>
  </div>
  <div class="summary" id="summary"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
const _legend=document.getElementById('legend'), _controls=document.getElementById('controls'), _summary=document.getElementById('summary');
const mercury=document.getElementById('mercury'), wtint=document.getElementById('wtint');
const barsG=document.getElementById('bars'), meas=document.getElementById('meas'), measDot=document.getElementById('measDot');
const flame=document.getElementById('flame');

const FUELS={
  methanol:{ name:'Methanol CH₃OH', dHc:-726, M:32 },
  ethanol:{ name:'Ethanol C₂H₅OH', dHc:-1367, M:46 },
  propanol:{ name:'Propanol C₃H₇OH', dHc:-2021, M:60 },
  octane:{ name:'Octane C₈H₁₈', dHc:-5470, M:114 }
};
let fuel='methanol', mW=200, dT=30, mF=1.0, t=0;
const theoKJg=k=>Math.abs(FUELS[k].dHc)/FUELS[k].M;

const cx0=300, cx1=608, baseY=290, topY=90, maxV=50;
const keys=Object.keys(FUELS), slot=(cx1-cx0)/keys.length;
const barEls={};
keys.forEach((k,i)=>{
  const x=cx0+slot*i+slot*0.22, bw=slot*0.46;
  const r=mk('rect',{x:x,y:baseY,width:bw,height:0,rx:6,fill:'#cbd5e1'});
  barsG.appendChild(r); barEls[k]={el:r,bw:bw,i:i};
});

function addButton(text,onClick,cls){ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=text; b.addEventListener('click',()=>onClick(b)); _controls.appendChild(b); return b; }
function addSlider(text,min,max,val,onInput){
  const wrap=document.createElement('div'); wrap.className='slider-wrap';
  const lab=document.createElement('span'); lab.className='ctl-label'; lab.textContent=text;
  const inp=document.createElement('input'); inp.type='range'; inp.min=min; inp.max=max; inp.value=val;
  const v=document.createElement('span'); v.className='val'; v.textContent=val;
  inp.addEventListener('input',e=>{ const x=parseFloat(e.target.value); v.textContent=x; onInput(x); });
  wrap.appendChild(lab); wrap.appendChild(inp); wrap.appendChild(v); _controls.appendChild(wrap);
  return {wrap:wrap,inp:inp,set:vv=>{ inp.value=vv; }};
}
let f1,f2,f3,f4;
function setFuel(k){ if(!FUELS[k]) return; fuel=k;
  f1.classList.toggle('active',k==='methanol'); f2.classList.toggle('active',k==='ethanol');
  f3.classList.toggle('active',k==='propanol'); f4.classList.toggle('active',k==='octane');
  render(); }
f1=addButton('Methanol', ()=>setFuel('methanol'), 'ghost');
f2=addButton('Ethanol', ()=>setFuel('ethanol'), 'ghost');
f3=addButton('Propanol', ()=>setFuel('propanol'), 'ghost');
f4=addButton('Octane', ()=>setFuel('octane'), 'ghost');
const sW=addSlider('Water mass (g)', 50, 500, 200, v=>{ mW=v; render(); });
const sT=addSlider('Temp rise ΔT (°C)', 1, 80, 30, v=>{ dT=v; render(); });
const sF=addSlider('Fuel burned (g)', 0.1, 5, 1.0, v=>{ mF=v; render(); }); sF.inp.step='0.1';

_legend.innerHTML='';
[['#1d4ed8','theoretical kJ/g'],['#ef4444','your measured kJ/g']].forEach(it=>{ const s=document.createElement('span'); s.className='it';
  s.innerHTML='<i class="dot" style="background:'+it[0]+'"></i><span>'+it[1]+'</span>'; _legend.appendChild(s); });

function render(){
  // water tint warms with ΔT
  const warm=Math.min(1,dT/80);
  wtint.setAttribute('fill-opacity',(0.10+warm*0.16).toFixed(3));
  // thermometer reading
  const lvl=Math.max(0,Math.min(1,(20+dT)/120));
  const y=250-lvl*184;
  mercury.setAttribute('y',y.toFixed(1)); mercury.setAttribute('height',(256-y).toFixed(1));
  // fuel bars
  keys.forEach(k=>{ const v=theoKJg(k), h=(v/maxV)*(baseY-topY), o=barEls[k];
    o.el.setAttribute('height',h.toFixed(1)); o.el.setAttribute('y',(baseY-h).toFixed(1));
    o.el.setAttribute('fill', k===fuel?'#1d4ed8':'#cbd5e1'); });
  // measured line
  const mv=(mW*4.18*dT/1000)/mF, mh=Math.min(baseY-topY,(mv/maxV)*(baseY-topY));
  meas.setAttribute('y1',(baseY-mh).toFixed(1)); meas.setAttribute('y2',(baseY-mh).toFixed(1));
  measDot.setAttribute('cy',(baseY-mh).toFixed(1));
  // numbers -> summary
  const qKJ=(mW*4.18*dT)/1000, theo=theoKJg(fuel);
  _summary.innerHTML='<b>'+FUELS[fuel].name+'</b> · q = m·c·ΔT = '+mW+' g × 4.18 × '+dT+' °C = '+qKJ.toFixed(1)+' kJ → '
    + '<span class="emr">measured '+mv.toFixed(1)+' kJ/g</span> vs theoretical <span class="em">'+theo.toFixed(1)+' kJ/g</span>. '
    + 'The measured value is always lower because heat escapes to the surroundings.';
}
function frame(){ t+=1/60; const f=1+0.06*Math.sin(t*8); flame.setAttribute('transform','translate(145,284) scale(1,'+f.toFixed(3)+') translate(-145,-284)'); requestAnimationFrame(frame); }

setFuel('methanol');
requestAnimationFrame(frame);
</script>
</body>
</html>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const toggleBtn = document.getElementById('toggleBtn');
        const voltageRange = document.getElementById('voltageRange');
        const voltageVal = document.getElementById('voltageVal');

        let width, height;
        let particles = [];
        let bubbles = [];
        let isRunning = true;
        let voltage = 6;

        // Configuration
        const PARTICLE_COUNT = 40;
        const ELECTRODE_GAP = 60; // Margin from edges
        const ELECTRODE_WIDTH = 35;

        class Particle {
            constructor(type) {
                this.type = type; // 'H' or 'OH'
                this.init();
            }

            init() {
                // Initialize in the middle area
                this.x = width * 0.2 + Math.random() * (width * 0.6);
                this.y = 50 + Math.random() * (height - 100);
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = 14;
            }

            update() {
                const force = voltage * 0.015;
                
                // Directional movement based on charge
                if (this.type === 'H') {
                    this.vx += force; // Move towards Cathode (Right -)
                } else {
                    this.vx -= force; // Move towards Anode (Left +)
                }

                // Add some Brownian-like randomness
                this.vx += (Math.random() - 0.5) * 0.1;
                this.vy += (Math.random() - 0.5) * 0.1;

                this.x += this.vx;
                this.y += this.vy;

                // Drag
                this.vx *= 0.96;
                this.vy *= 0.96;

                // Vertical bounds
                if (this.y < 40 || this.y > height - 40) this.vy *= -1;

                // Electrode Reactions
                const anodeBound = ELECTRODE_GAP + ELECTRODE_WIDTH;
                const cathodeBound = width - ELECTRODE_GAP - ELECTRODE_WIDTH;

                // OH- hitting Anode (Left)
                if (this.type === 'OH' && this.x < anodeBound + this.size) {
                    if (Math.random() < 0.1) {
                        spawnBubble(this.x, this.y, 'O2');
                        this.init();
                    } else {
                        this.x = anodeBound + this.size + 1;
                        this.vx *= -0.4;
                    }
                }

                // H+ hitting Cathode (Right)
                if (this.type === 'H' && this.x > cathodeBound - this.size) {
                    if (Math.random() < 0.15) { // Faster H2 production
                        spawnBubble(this.x, this.y, 'H2');
                        this.init();
                    } else {
                        this.x = cathodeBound - this.size - 1;
                        this.vx *= -0.4;
                    }
                }

                // Global safety
                if (this.x < 0 || this.x > width) this.init();
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                // Styling
                ctx.fillStyle = this.type === 'H' ? '#ef4444' : '#3b82f6';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.type === 'H' ? 'rgba(239, 68, 68, 0.5)' : 'rgba(59, 130, 246, 0.5)';
                ctx.fill();

                // Text Label
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'H' ? 'H⁺' : 'OH⁻', this.x, this.y);
                ctx.restore();
            }
        }

        class Bubble {
            constructor(x, y, gas) {
                this.x = x;
                this.y = y;
                this.gas = gas;
                this.r = Math.random() * 3 + 2;
                this.vy = -Math.random() * 2 - 1;
                this.life = 1.0;
            }

            update() {
                this.y += this.vy;
                this.x += Math.sin(this.y * 0.05) * 0.5;
                this.life -= 0.005;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.life})`;
                ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.3})`;
                ctx.fill();
                ctx.stroke();
            }
        }

        function spawnBubble(x, y, gas) {
            bubbles.push(new Bubble(x, y, gas));
        }

        function drawElectrodes() {
            // Anode (+)
            const aGrad = ctx.createLinearGradient(ELECTRODE_GAP, 0, ELECTRODE_GAP + ELECTRODE_WIDTH, 0);
            aGrad.addColorStop(0, '#334155');
            aGrad.addColorStop(1, '#64748b');
            ctx.fillStyle = aGrad;
            ctx.fillRect(ELECTRODE_GAP, 30, ELECTRODE_WIDTH, height - 60);

            // Cathode (-)
            const cGrad = ctx.createLinearGradient(width - ELECTRODE_GAP - ELECTRODE_WIDTH, 0, width - ELECTRODE_GAP, 0);
            cGrad.addColorStop(0, '#64748b');
            cGrad.addColorStop(1, '#334155');
            ctx.fillStyle = cGrad;
            ctx.fillRect(width - ELECTRODE_GAP - ELECTRODE_WIDTH, 30, ELECTRODE_WIDTH, height - 60);
        }

        function resize() {
            const container = canvas.parentElement;
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function init() {
            resize();
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT / 2; i++) {
                particles.push(new Particle('H'));
                particles.push(new Particle('OH'));
            }
        }

        function animate() {
            if (isRunning) {
                ctx.clearRect(0, 0, width, height);
                
                drawElectrodes();

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                bubbles = bubbles.filter(b => b.y > -10 && b.life > 0);
                bubbles.forEach(b => {
                    b.update();
                    b.draw();
                });
            }
            requestAnimationFrame(animate);
        }

        // Control Listeners
        window.addEventListener('resize', init);
        
        toggleBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            toggleBtn.textContent = isRunning ? '暂停模拟' : '恢复模拟';
            toggleBtn.className = isRunning 
                ? "w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition shadow-lg"
                : "w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl transition shadow-lg";
        });

        voltageRange.addEventListener('input', (e) => {
            voltage = parseInt(e.target.value);
            voltageVal.textContent = voltage;
        });

        // Initialize
        init();
        animate();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reaction Profile: Energy vs Progress</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#f1f5f9; color:#0f172a; min-height:100vh; padding:28px 18px;
    font-family:system-ui,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1000px; margin:0 auto; background:#fff; border:1px solid #e2e8f0; border-radius:26px;
    padding:32px 40px 42px; box-shadow:0 25px 50px -12px rgba(15,23,42,.25);}
  @media(max-width:640px){ .wrap{padding:22px 18px 30px;} }
  .hdr{text-align:center; margin-bottom:26px;}
  .hdr h1{margin:0 0 7px; font-size:31px; line-height:1.15; font-weight:900; letter-spacing:-.02em; color:#0f172a;}
  .hdr .sub{margin:0; font-size:16px; font-style:italic; color:#64748b;}
  @media(max-width:640px){ .hdr h1{font-size:24px;} }
  .legend{display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-bottom:24px; font-size:13.5px; font-weight:700; color:#475569;}
  .legend .it{display:inline-flex; align-items:center; gap:8px;}
  .legend .dot{width:15px; height:15px; border-radius:9999px; border:1px solid #334155; display:inline-block;}
  .ctrl{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center;
    background:#eff6ff; border:2px solid #dbeafe; border-radius:18px; padding:18px 22px;
    box-shadow:0 4px 6px -1px rgba(15,23,42,.06); margin-bottom:26px;}
  button.btn{border:none; border-radius:12px; padding:11px 20px; font-size:14px; font-weight:800;
    cursor:pointer; transition:background .18s,color .18s,transform .18s,box-shadow .18s;}
  button.btn:hover{transform:translateY(-1px);}
  button.btn.primary{background:#1d4ed8; color:#fff; box-shadow:0 10px 20px -10px rgba(29,78,216,.85);}
  button.btn.primary:hover{background:#1e40af;}
  button.btn.ghost{background:#fff; color:#1d4ed8; border:1.5px solid #bfdbfe;}
  button.btn.ghost:hover{background:#eff6ff;}
  button.btn.active{background:#1d4ed8; color:#fff; border-color:#1d4ed8; box-shadow:0 10px 20px -10px rgba(29,78,216,.85);}
  .stage{background:#f8fafc; border:1px dashed #cbd5e1; border-radius:18px; padding:10px; margin-bottom:26px;}
  .stage svg{width:100%; height:auto; display:block;}
  .summary{background:#0f172a; color:#e2e8f0; border-radius:18px; padding:22px 26px; font-size:15.5px; line-height:1.65; transition:background .35s;}
  .summary .em{color:#7dd3fc; font-weight:800;}
  .summary.hot{background:#064e3b;}
  .summary.hot .em{color:#a7f3d0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <h1>Reaction Profile: Energy vs Progress</h1>
    <p class="sub">IG CIE 0620 · Chapter 8.2 · Activation energy &amp; ΔH</p>
  </header>
  <div class="legend" id="legend"></div>
  <div class="ctrl" id="controls"></div>
  <div class="stage">
    <svg id="scene" viewBox="0 0 560 340" preserveAspectRatio="xMidYMid meet" aria-label="reaction energy profile">
      <defs>
        <marker id="ahRed" markerWidth="11" markerHeight="11" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#ef4444"/></marker>
        <marker id="ahBlue" markerWidth="11" markerHeight="11" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#3b82f6"/></marker>
        <marker id="ahAmber" markerWidth="11" markerHeight="11" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#f59e0b"/></marker>
      </defs>
      <line x1="70" y1="42" x2="70" y2="290" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="70" y1="290" x2="530" y2="290" stroke="#cbd5e1" stroke-width="2"/>
      <rect id="shelfR" fill="#3b82f6" fill-opacity="0.10"/>
      <rect id="shelfP" fill="#3b82f6" fill-opacity="0.10"/>
      <polyline id="curve" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <line id="eaLine" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#ahAmber)"/>
      <line id="dhLine" stroke="#ef4444" stroke-width="3.5" marker-end="url(#ahRed)"/>
      <g id="trail"></g>
      <circle id="ball" r="11" fill="#f59e0b" stroke="#b45309" stroke-width="1.6"/>
    </svg>
  </div>
  <div class="summary" id="summary"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
const curve=document.getElementById('curve');
const shelfR=document.getElementById('shelfR'), shelfP=document.getElementById('shelfP');
const eaLine=document.getElementById('eaLine'), dhLine=document.getElementById('dhLine');
const ball=document.getElementById('ball');
const trailG=document.getElementById('trail');
const _legend=document.getElementById('legend'), _controls=document.getElementById('controls'), _summary=document.getElementById('summary');

const E_R=45, Ea=70, DH=38, Emax=E_R+Ea+8;
const x0=70, x1=520, yTop=42, yBot=290;
const yOf=E=>yBot-(E/Emax)*(yBot-yTop);
const trail=[];
for(let i=0;i<10;i++){ const c=mk('circle',{r:6,fill:'#f59e0b',opacity:0}); trailG.appendChild(c); trail.push(c); }

let mode='exo', playing=false, p=0;
function profE(f){
  const xp=0.50, E_P=(mode==='exo')?E_R-DH:E_R+DH, E_peak=E_R+Ea;
  if(f<=0.27) return E_R;
  if(f<=xp)   return E_R+(E_peak-E_R)*((f-0.27)/(xp-0.27));
  if(f<=0.83) return E_peak+(E_P-E_peak)*((f-xp)/(0.83-xp));
  return E_P;
}
let exoBtn, endoBtn;
function setLegend(){
  _legend.innerHTML='';
  [['#3b82f6','reactant / product level'],['#f59e0b','activation energy (Ea)'],['#ef4444','ΔH (energy change)']]
  .forEach(it=>{ const s=document.createElement('span'); s.className='it';
    s.innerHTML='<i class="dot" style="background:'+it[0]+'"></i><span>'+it[1]+'</span>'; _legend.appendChild(s); });
}
function setSummary(){
  if(mode==='exo'){
    _summary.innerHTML='<span class="em">Exothermic:</span> products sit LOWER in energy than reactants, so ΔH is negative. The ball climbs the activation-energy hill then rolls down to a lower products shelf.';
    _summary.classList.add('hot');
  } else {
    _summary.innerHTML='<span class="em">Endothermic:</span> products sit HIGHER than reactants, so ΔH is positive. The ball still climbs the Ea hill first — many endothermic reactions need a spark to start.';
    _summary.classList.remove('hot');
  }
}
function setMode(m){
  mode=m; p=0; playing=false;
  exoBtn.classList.toggle('active', m==='exo');
  endoBtn.classList.toggle('active', m==='endo');
  setLegend(); setSummary();
}
function addButton(text,onClick,cls){ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=text; b.addEventListener('click',()=>onClick(b)); _controls.appendChild(b); return b; }
addButton('Play', ()=>{ playing=true; p=0; }, 'primary');
addButton('Reset', ()=>{ playing=false; p=0; }, 'ghost');
exoBtn=addButton('Exothermic', ()=>setMode('exo'), 'ghost');
endoBtn=addButton('Endothermic', ()=>setMode('endo'), 'ghost');

function render(){
  const E_P=(mode==='exo')?E_R-DH:E_R+DH, E_peak=E_R+Ea;
  const yR=yOf(E_R), yP=yOf(E_P), yPk=yOf(E_peak);
  const xPlat=x0+0.27*(x1-x0), xDrop=x0+0.83*(x1-x0);

  shelfR.setAttribute('x',x0); shelfR.setAttribute('y',yR); shelfR.setAttribute('width',xPlat-x0); shelfR.setAttribute('height',yBot-yR);
  shelfP.setAttribute('x',xDrop); shelfP.setAttribute('y',yP); shelfP.setAttribute('width',x1-xDrop); shelfP.setAttribute('height',yBot-yP);
  curve.setAttribute('points',[[x0,yR],[xPlat,yR],[(x0+x1)/2,yPk],[xDrop,yP],[x1,yP]].map(pt=>pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' '));

  const xEa=x0+0.16*(x1-x0);
  eaLine.setAttribute('x1',xEa); eaLine.setAttribute('y1',yR); eaLine.setAttribute('x2',xEa); eaLine.setAttribute('y2',yPk);

  const xDH=x0+0.66*(x1-x0);
  dhLine.setAttribute('x1',xDH); dhLine.setAttribute('y1',yR); dhLine.setAttribute('x2',xDH); dhLine.setAttribute('y2',yP);
  dhLine.setAttribute('stroke', mode==='exo'?'#ef4444':'#3b82f6');
  dhLine.setAttribute('marker-end', mode==='exo'?'url(#ahRed)':'url(#ahBlue)');

  const f=p, bx=x0+f*(x1-x0), by=yOf(profE(f));
  ball.setAttribute('cx',bx.toFixed(1)); ball.setAttribute('cy',by.toFixed(1));
  trail.forEach((c,i)=>{ const ff=Math.max(0,f-(i+1)*0.012);
    c.setAttribute('cx',(x0+ff*(x1-x0)).toFixed(1));
    c.setAttribute('cy',yOf(profE(ff)).toFixed(1));
    c.setAttribute('opacity',(0.14*(1-(i+1)/11)).toFixed(3)); });
}
function frame(){ if(playing){ p=Math.min(1,p+0.005); if(p>=1) playing=false; } render(); requestAnimationFrame(frame); }

setMode('exo');
requestAnimationFrame(frame);
</script>
</body>
</html>

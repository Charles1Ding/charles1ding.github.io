<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微粒动能与吸引力模拟器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        canvas { background: #020617; border-radius: 12px; touch-action: none; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .energy-bar { transition: width 0.3s linear; }
        
        @keyframes pulse-purple {
            0% { filter: drop-shadow(0 0 2px #a855f7); }
            50% { filter: drop-shadow(0 0 10px #d8b4fe); }
            100% { filter: drop-shadow(0 0 2px #a855f7); }
        }
        .phase-changing { animation: pulse-purple 2s infinite; }
    </style>
</head>
<body class="p-2 md:p-6">
    <div class="max-w-[1600px] mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-extrabold text-slate-800">微粒：动能与吸引力的博弈</h1>
            <p class="text-slate-500 text-sm mt-1">探索热能如何改变微粒的运动状态与相互作用</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <div class="lg:col-span-2 space-y-4">
                <div class="glass-card p-4 rounded-2xl shadow-sm border-t-4 border-purple-400">
                    <h3 class="font-bold text-slate-700 mb-3 text-xs flex items-center">
                        <span class="w-1.5 h-1.5 bg-red-500 rounded-full mr-1.5"></span> 数据监控
                    </h3>
                    <div class="space-y-5">
                        <div>
                            <div class="flex justify-between text-[10px] mb-1 text-slate-500">
                                <span>实时温度 (平均动能)</span>
                                <span id="tempVal" class="font-mono font-bold">20 K</span>
                            </div>
                            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                <div id="tempBar" class="bg-red-500 h-full energy-bar" style="width: 5%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-[10px] mb-1 text-slate-500">
                                <span>吸引力强度</span>
                            </div>
                            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                <div id="attrBar" class="bg-blue-500 h-full energy-bar" style="width: 90%"></div>
                            </div>
                            <div id="attrVal" class="text-[10px] mt-1 text-blue-600 font-bold">极强</div>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-4 rounded-2xl shadow-sm border-l-4 border-slate-400">
                    <h3 class="font-bold text-slate-700 mb-2 text-xs">临界点参考值</h3>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center text-[11px]">
                            <span class="text-slate-500">熔点 (Melting)</span>
                            <span class="px-1.5 py-0.5 bg-blue-50 text-blue-700 rounded font-bold">100 K</span>
                        </div>
                        <div class="flex justify-between items-center text-[11px]">
                            <span class="text-slate-500">沸点 (Boiling)</span>
                            <span class="px-1.5 py-0.5 bg-orange-50 text-orange-700 rounded font-bold">250 K</span>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-4 rounded-2xl shadow-sm">
                    <h3 class="font-bold text-slate-700 mb-1 italic text-xs">实验观察</h3>
                    <p class="text-[10px] text-slate-600 leading-relaxed">
                        液体状态：微粒沉在底部，彼此滑动碰撞。<br>
                        相变过程中粒子行为渐进过渡。
                    </p>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-4">
                <div class="relative">
                    <canvas id="particleCanvas" class="w-full h-[400px] shadow-xl"></canvas>
                    
                    <div class="absolute bottom-3 left-3 flex flex-col gap-2">
                        <span id="stateBadge" class="px-2 py-0.5 bg-blue-500 text-white text-[10px] font-bold rounded-full shadow-md w-fit">状态: 固体</span>
                        <div id="processBox" class="px-3 py-1 bg-white/95 text-slate-800 text-[10px] font-bold rounded-lg shadow-lg hidden border border-purple-200 flex items-center">
                            <span class="relative flex h-2 w-2 mr-2">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-purple-600"></span>
                            </span>
                            能量正在改变微粒间距...
                        </div>
                    </div>
                </div>
                
                <div class="flex justify-center gap-4 py-1">
                    <button id="coolBtn" class="group flex flex-col items-center">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                        </div>
                        <span class="text-[10px] mt-1 font-bold text-slate-500">冷却 (冰块)</span>
                    </button>
                    <button id="stopBtn" class="group flex flex-col items-center">
                        <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center group-hover:bg-slate-800 group-hover:text-white transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </div>
                        <span class="text-[10px] mt-1 font-bold text-slate-500">停止</span>
                    </button>
                    <button id="heatBtn" class="group flex flex-col items-center">
                        <div class="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.99 7.99 0 0120 13a7.99 7.99 0 01-2.343 5.657z" /></svg>
                        </div>
                        <span class="text-[10px] mt-1 font-bold text-slate-500">加热 (火焰)</span>
                    </button>
                </div>
            </div>

            <div class="lg:col-span-6">
                <div class="glass-card p-4 rounded-2xl shadow-sm h-full flex flex-col">
                    <h3 class="font-bold text-slate-700 mb-3 italic text-sm text-center">加热曲线 (已标注临界温度)</h3>
                    <div class="flex-grow">
                        <canvas id="chartCanvas" class="w-full h-[450px]"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const chartCanvas = document.getElementById('chartCanvas');
        const cctx = chartCanvas.getContext('2d');

        const PARTICLE_COUNT = 100;
        const PARTICLE_RADIUS = 6;
        const MELTING_POINT = 100;
        const BOILING_POINT = 250;
        const LATENT_ENERGY_CAP = 3500; 
        const POWER_STEP = 0.8;

        let particles = [];
        let temperature = 20; 
        let latentBuffer = 0; 
        let state = 'solid'; 
        let heatMode = 0; 
        let history = [];

        let fireParticles = [];
        let iceParticles = [];

        // ===== 工具函数：潜热进度 (0→1 加热方向, 1→0 冷却方向) =====
        function getProgress() {
            return latentBuffer / LATENT_ENERGY_CAP;
        }

        // ===== 两色线性插值 =====
        function lerpColor(c1, c2, t) {
            return [
                Math.round(c1[0] + (c2[0] - c1[0]) * t),
                Math.round(c1[1] + (c2[1] - c1[1]) * t),
                Math.round(c1[2] + (c2[2] - c1[2]) * t)
            ];
        }

        class Particle {
            constructor(id) {
                this.id = id;
                this._evaporated = false;
                this.reset();
            }

            reset() {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                if (state === 'solid' || state === 'melting') {
                    const cols = 10;
                    const spacing = 22;
                    const totalWidth = (cols - 1) * spacing;
                    const startX = cx - totalWidth / 2;
                    const startY = cy - totalWidth / 2;
                    this.targetX = startX + (this.id % cols) * spacing;
                    this.targetY = startY + Math.floor(this.id / cols) * spacing;
                    this.x = this.targetX;
                    this.y = this.targetY;
                    this.vx = 0;
                    this.vy = 0;
                } else if (state === 'liquid' || state === 'boiling') {
                    const bottomY = canvas.height - 18;
                    const cols = 12;
                    const spacing = PARTICLE_RADIUS * 2 + 2;
                    const startX = 15;
                    const row = Math.floor(this.id / cols);
                    const col = this.id % cols;
                    const x = startX + col * spacing + (row % 2) * (spacing / 2);
                    const y = bottomY - row * spacing * 0.87;
                    this.x = Math.min(canvas.width - 15, Math.max(15, x));
                    this.y = Math.min(bottomY, Math.max(20, y));
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                } else {
                    this.x = cx + (Math.random() - 0.5) * 50;
                    this.y = cy + (Math.random() - 0.5) * 50;
                    this.vx = (Math.random() - 0.5) * 1;
                    this.vy = (Math.random() - 0.5) * 1;
                }
            }

            update() {
                const speed = Math.sqrt(temperature) * 0.16;
                const cx = canvas.width / 2;

                if (state === 'solid') {
                    // ===== 固体：网格晶格振动 =====
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    this.vx += dx * 0.08 + (Math.random() - 0.5) * speed;
                    this.vy += dy * 0.08 + (Math.random() - 0.5) * speed;
                    this.vx *= 0.7;
                    this.vy *= 0.7;
                    this.x += this.vx;
                    this.y += this.vy;
                } else if (state === 'melting') {
                    // ===== 熔化：固→液渐进过渡 =====
                    const p = getProgress(); // 0=固体行为, 1=液体行为
                    
                    // 固体成分：网格回复力递减
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const gridForce = 0.08 * (1 - p);
                    
                    // 液体成分：重力递增 + 液面约束递增
                    const gravity = 0.25 * p;
                    const floorY = canvas.height - 14;
                    const surfaceY = canvas.height * 0.58;
                    
                    this.vx += dx * gridForce + (Math.random() - 0.5) * speed * (1 + p * 0.5);
                    this.vy += dy * gridForce + (Math.random() - 0.5) * speed * (1 + p * 0.5) + gravity;
                    
                    // 阻尼：固体0.7 → 液体0.975
                    this.vx *= 0.7 + p * 0.275;
                    this.vy *= 0.7 + p * 0.275;
                    
                    // 底面约束（随p增强）
                    if (this.y > floorY) {
                        this.y = floorY;
                        this.vy *= (1 - p) * 0.7 - p * 0.25;
                        this.vx *= 1 - p * 0.15;
                    }
                    
                    // 液面约束（随p增强）
                    if (this.y < surfaceY) {
                        this.vy += 0.3 * p;
                    }
                    
                    // 侧面约束过渡
                    if (this.x < 14) { this.x = 14; this.vx *= Math.abs(-0.4 * p); }
                    if (this.x > canvas.width - 14) { this.x = canvas.width - 14; this.vx *= Math.abs(-0.4 * p); }
                    
                    this.x += this.vx;
                    this.y += this.vy;
                } else if (state === 'liquid') {
                    // ===== 液体：沉底 + 滑动碰撞 + 表面蒸发 =====
                    const gravity = 0.25;
                    const floorY = canvas.height - 14;
                    const surfaceY = canvas.height * 0.58;
                    const vaporThreshold = surfaceY - 14; // 超过此线视为蒸发态

                    if (this.y < vaporThreshold) {
                        // --- 蒸发微粒：液面上方缓慢飘荡 ---
                        this._evaporated = true;
                        this.vy += 0.012; // 极轻"重力"
                        this.vx += (Math.random() - 0.5) * speed * 0.6;
                        this.vy += (Math.random() - 0.5) * speed * 0.25;

                        // 冷凝：飘回液面附近时被拉回液体
                        if (this.y > vaporThreshold - 12) {
                            this.vy += 0.6;
                        }

                        // 画布边界
                        if (this.x < 8) { this.x = 8; this.vx *= -0.4; }
                        if (this.x > canvas.width - 8) { this.x = canvas.width - 8; this.vx *= -0.4; }
                        if (this.y < 6) { this.y = 6; this.vy *= -0.3; }

                        this.vx *= 0.985;
                        this.vy *= 0.985;
                        this.x += this.vx;
                        this.y += this.vy;
                    } else {
                        // --- 正常液体行为 ---
                        this._evaporated = false;
                        this.vy += gravity;
                        this.vx += (Math.random() - 0.5) * speed * 0.9;
                        this.vy += (Math.random() - 0.5) * speed * 0.35;

                        // 蒸发：液面附近且向上运动的微粒有机会逃逸
                        const nearSurface = this.y < surfaceY + 18;
                        const evapFactor = Math.max(0, (temperature - MELTING_POINT) / (BOILING_POINT - MELTING_POINT));
                        const evapProb = evapFactor * 0.012;

                        if (nearSurface && this.vy < 0 && Math.random() < evapProb) {
                            this.vy -= speed * 2.0; // 逃逸速度
                            this.y -= 3;            // 抬升以突破表面约束
                        }

                        if (this.y > floorY) {
                            this.y = floorY;
                            this.vy *= -0.25;
                            this.vx *= 0.85;
                        }
                        if (this.y < surfaceY) {
                            this.vy += 0.3;
                        }
                        if (this.x < 14) { this.x = 14; this.vx *= -0.4; }
                        if (this.x > canvas.width - 14) { this.x = canvas.width - 14; this.vx *= -0.4; }

                        this.vx *= 0.975;
                        this.vy *= 0.975;
                        this.x += this.vx;
                        this.y += this.vy;
                    }
                } else if (state === 'boiling') {
                    // ===== 沸腾：液→气渐进过渡 =====
                    const p = getProgress(); // 0=液体行为, 1=气体行为
                    
                    // 液体成分递减
                    const gravity = 0.25 * (1 - p);
                    const floorY = canvas.height - 14;
                    const surfaceY = canvas.height * 0.58;
                    
                    this.vy += gravity;
                    
                    // 随机运动：从液体滑动→气体自由
                    const jitterX = (0.9 + p * 2.1) * speed;
                    const jitterY = (0.35 + p * 1.65) * speed;
                    this.vx += (Math.random() - 0.5) * jitterX;
                    this.vy += (Math.random() - 0.5) * jitterY;
                    
                    // 气泡效应（接近液体时明显，接近气体时消失）
                    if (Math.random() < 0.03 * (1 - p)) {
                        this.vy -= speed * 3.5;
                    }
                    
                    // 约束递减
                    if (this.y > floorY) {
                        this.y = floorY;
                        this.vy *= -0.25 * (1 - p) - 0.9 * p;
                        this.vx *= 1 - p * 0.15;
                    }
                    if (this.y < surfaceY) {
                        this.vy += 0.3 * (1 - p);
                    }
                    
                    // 边界：液体容器 → 全画布
                    const wallBounce = -0.4 * (1 - p) - 0.9 * p;
                    if (this.x < 14) { this.x = 14; this.vx *= wallBounce; }
                    if (this.x > canvas.width - 14) { this.x = canvas.width - 14; this.vx *= wallBounce; }
                    if (p > 0.3) {
                        if (this.y < 10) { this.y = 10; this.vy *= -0.9 * Math.min(1, p * 1.5); }
                    }
                    
                    // 阻尼：液体0.975 → 气体1.0 (气体无额外阻尼)
                    this.vx *= 0.975 + p * 0.025;
                    this.vy *= 0.975 + p * 0.025;
                    
                    this.x += this.vx;
                    this.y += this.vy;
                } else {
                    // ===== 气体：自由运动 =====
                    this.vx += (Math.random() - 0.5) * speed * 0.4;
                    this.vy += (Math.random() - 0.5) * speed * 0.4;
                    if (this.x < 10 || this.x > canvas.width - 10) this.vx *= -0.9;
                    if (this.y < 10 || this.y > canvas.height - 10) this.vy *= -0.9;
                    this.x += this.vx;
                    this.y += this.vy;
                }
            }

            draw() {
                const solidColor  = [96,  165, 250]; // 蓝
                const liquidColor = [74,  222, 128]; // 绿
                const gasColor    = [251, 146, 60];  // 橙

                let color;
                
                if (state === 'solid') {
                    color = solidColor;
                } else if (state === 'melting') {
                    // 熔化：蓝→绿 渐变
                    color = lerpColor(solidColor, liquidColor, getProgress());
                } else if (state === 'liquid') {
                    color = liquidColor;
                } else if (state === 'boiling') {
                    // 沸腾：绿→橙 渐变
                    color = lerpColor(liquidColor, gasColor, getProgress());
                } else {
                    color = gasColor;
                }

                // 相变时的闪烁效果
                if (state === 'melting' || state === 'boiling') {
                    const blink = Math.sin(Date.now() / 300) * 0.3 + 0.7;
                    color = [
                        Math.round(color[0] * blink),
                        Math.round(color[1] * blink),
                        Math.round(color[2] * blink)
                    ];
                }

                ctx.beginPath();
                const radius = (state === 'liquid' && this._evaporated) ? PARTICLE_RADIUS * 0.7 : PARTICLE_RADIUS;
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                
                if (state === 'liquid' && this._evaporated) {
                    // 蒸发微粒：半透明雾状
                    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},0.55)`;
                } else {
                    ctx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
                }
                ctx.fill();

                // 高光（蒸发微粒不加高光，更柔和）
                if (!(state === 'liquid' && this._evaporated)) {
                    ctx.beginPath();
                    ctx.arc(this.x - 1.5, this.y - 2, 2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fill();
                }
            }
        }

        // ===== 粒子间排斥力 =====
        function applyParticleRepulsion() {
            let p = 0;
            if (state === 'liquid' || state === 'boiling') {
                p = 1;
            } else if (state === 'melting') {
                p = getProgress(); // 熔化后期需要排斥
            } else {
                return;
            }
            // 熔化前30%不需要排斥（粒子还分散在网格中）
            if (state === 'melting' && p < 0.3) return;

            const repulsionStrength = 0.35 * p;
            const minDist = PARTICLE_RADIUS * 2.15;

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    // 蒸发微粒不参与液体碰撞
                    if (particles[i]._evaporated || particles[j]._evaporated) continue;
                    const dx = particles[j].x - particles[i].x;
                    const dy = particles[j].y - particles[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < minDist && dist > 0.01) {
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const force = overlap / minDist * repulsionStrength;

                        particles[i].vx -= nx * force;
                        particles[i].vy -= ny * force;
                        particles[j].vx += nx * force;
                        particles[j].vy += ny * force;

                        const relVx = particles[i].vx - particles[j].vx;
                        const relVy = particles[i].vy - particles[j].vy;
                        const relVn = relVx * nx + relVy * ny;

                        if (relVn > 0) {
                            const exchange = 0.4 * p;
                            particles[i].vx -= nx * relVn * exchange;
                            particles[i].vy -= ny * relVn * exchange;
                            particles[j].vx += nx * relVn * exchange;
                            particles[j].vy += ny * relVn * exchange;
                        }
                    }
                }
            }
        }

        // 绘制液面线
        function drawLiquidSurface() {
            let show = false;
            let surfaceY, waveAmp, waveFreq;
            let fillColor, strokeColor;

            if (state === 'liquid') {
                show = true;
                surfaceY = canvas.height * 0.58;
                waveAmp = 1.5;
                waveFreq = 0.015;
                fillColor = 'rgba(74, 222, 128, 0.05)';
                strokeColor = 'rgba(74, 222, 128, 0.4)';
            } else if (state === 'boiling') {
                show = true;
                surfaceY = canvas.height * 0.58;
                waveAmp = 4;
                waveFreq = 0.03;
                fillColor = 'rgba(52, 211, 153, 0.06)';
                strokeColor = 'rgba(52, 211, 153, 0.5)';
            } else if (state === 'melting') {
                const p = getProgress();
                if (p > 0.3) {
                    show = true;
                    surfaceY = canvas.height * 0.58;
                    waveAmp = 1.5 * p;
                    waveFreq = 0.015;
                    fillColor = `rgba(74, 222, 128, ${0.05 * p})`;
                    strokeColor = `rgba(74, 222, 128, ${0.4 * p})`;
                }
            }

            if (!show) return;
            
            const t = Date.now() / 1000;

            // 液面以下半透明区域
            ctx.fillStyle = fillColor;
            ctx.beginPath();
            ctx.moveTo(0, surfaceY);
            for (let x = 0; x <= canvas.width; x += 4) {
                const y = surfaceY + Math.sin(x * waveFreq + t * 1.5) * waveAmp 
                          + Math.sin(x * waveFreq * 2.3 - t * 2) * waveAmp * 0.5;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();

            // 液面线
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += 4) {
                const y = surfaceY + Math.sin(x * waveFreq + t * 1.5) * waveAmp 
                          + Math.sin(x * waveFreq * 2.3 - t * 2) * waveAmp * 0.5;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // 绘制火焰
        function drawFire() {
            if (heatMode <= 0) return;
            if (Math.random() > 0.4) {
                fireParticles.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 180,
                    y: canvas.height - 20,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: -Math.random() * 3 - 2,
                    life: 1.0,
                    size: Math.random() * 12 + 4
                });
            }
            for (let i = fireParticles.length - 1; i >= 0; i--) {
                const p = fireParticles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.025;
                if (p.life <= 0) { fireParticles.splice(i, 1); continue; }
                const g = Math.floor(80 + p.life * 175);
                ctx.fillStyle = `rgba(255, ${g}, 0, ${p.life * 0.6})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 绘制冰块
        function drawIce() {
            if (heatMode >= 0) return;
            const cx = canvas.width / 2;
            const bottom = canvas.height - 10;
            ctx.fillStyle = 'rgba(186, 230, 253, 0.4)';
            ctx.beginPath();
            ctx.roundRect(cx - 110, bottom - 25, 220, 25, 6);
            ctx.fill();
            if (Math.random() > 0.6) {
                iceParticles.push({
                    x: cx + (Math.random() - 0.5) * 200,
                    y: bottom - 25,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: -Math.random() * 1.2 - 0.3,
                    life: 1.0,
                    size: Math.random() * 15 + 8
                });
            }
            for (let i = iceParticles.length - 1; i >= 0; i--) {
                const p = iceParticles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.012;
                if (p.life <= 0) { iceParticles.splice(i, 1); continue; }
                ctx.fillStyle = `rgba(240, 249, 255, ${p.life * 0.35})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            chartCanvas.width = chartCanvas.offsetWidth;
            chartCanvas.height = chartCanvas.offsetHeight;
            if (particles.length === 0) {
                for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle(i));
            } else {
                particles.forEach(p => p.reset());
            }
        }

        function updateLogic() {
            const power = heatMode * POWER_STEP;
            let isOvercomingAttraction = false;

            // ===== 状态转移（不再 reset 粒子） =====
            if (state === 'solid' && temperature >= MELTING_POINT && power > 0) {
                state = 'melting';
            }
            if (state === 'melting') {
                isOvercomingAttraction = true;
                latentBuffer += power * 5;
                if (latentBuffer >= LATENT_ENERGY_CAP) {
                    // 熔化完成：粒子已自然沉到底部，无缝切换到液体
                    state = 'liquid';
                    latentBuffer = 0;
                } else if (latentBuffer < 0) {
                    state = 'solid';
                    latentBuffer = 0;
                }
            }

            if (state === 'liquid' && temperature >= BOILING_POINT && power > 0) {
                state = 'boiling';
            }
            if (state === 'boiling') {
                isOvercomingAttraction = true;
                latentBuffer += power * 5;
                if (latentBuffer >= LATENT_ENERGY_CAP) {
                    // 沸腾完成：粒子已自然扩散，无缝切换到气体
                    state = 'gas';
                    latentBuffer = 0;
                } else if (latentBuffer < 0) {
                    state = 'liquid';
                    latentBuffer = 0;
                }
            }

            // 反向：冷却触发
            if (state === 'liquid' && temperature <= MELTING_POINT && power < 0) {
                state = 'melting';
                latentBuffer = LATENT_ENERGY_CAP; // 从满潜热开始反向走
            }
            if (state === 'gas' && temperature <= BOILING_POINT && power < 0) {
                state = 'boiling';
                latentBuffer = LATENT_ENERGY_CAP;
            }

            if (!isOvercomingAttraction) {
                temperature += power * 0.15;
                if (temperature < 0) temperature = 0;
                document.getElementById('processBox').classList.add('hidden');
                canvas.classList.remove('phase-changing');
            } else {
                document.getElementById('processBox').classList.remove('hidden');
                canvas.classList.add('phase-changing');
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('tempVal').innerText = `${Math.floor(temperature)} K`;
            document.getElementById('tempBar').style.width = `${Math.min(100, temperature / 4)}%`;

            let attrStr = "极强", attrPer = 95;
            if (state === 'liquid') { attrStr = "中等"; attrPer = 55; }
            if (state === 'gas') { attrStr = "极弱"; attrPer = 8; }
            if (state === 'melting') {
                attrStr = "克服引力中...";
                attrPer = 95 - getProgress() * 40;
            }
            if (state === 'boiling') {
                attrStr = "克服引力中...";
                attrPer = 55 - getProgress() * 47;
            }
            document.getElementById('attrVal').innerText = attrStr;
            document.getElementById('attrBar').style.width = `${attrPer}%`;

            const names = { solid: '固体', melting: '熔化/凝固中', liquid: '液体', boiling: '汽化/液化中', gas: '气体' };
            const badge = document.getElementById('stateBadge');
            badge.innerText = `状态: ${names[state]}`;
            badge.className = `px-2 py-0.5 text-white text-[10px] font-bold rounded-full shadow-md transition-all ${
                state.includes('ing') ? 'bg-purple-600 scale-105'
                : state === 'gas' ? 'bg-orange-500'
                : state === 'liquid' ? 'bg-green-500'
                : state === 'boiling' ? 'bg-emerald-500'
                : 'bg-blue-500'
            }`;
        }

        function drawChart() {
            cctx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
            cctx.strokeStyle = '#f1f5f9';
            cctx.lineWidth = 1;
            for (let i = 1; i < 4; i++) {
                let y = chartCanvas.height - (i * 100 / 400) * chartCanvas.height;
                cctx.beginPath(); cctx.moveTo(0, y); cctx.lineTo(chartCanvas.width, y); cctx.stroke();
            }

            cctx.setLineDash([8, 4]);
            let yMelting = chartCanvas.height - (MELTING_POINT / 400) * chartCanvas.height;
            cctx.strokeStyle = 'rgba(96, 165, 250, 0.6)';
            cctx.beginPath(); cctx.moveTo(0, yMelting); cctx.lineTo(chartCanvas.width, yMelting); cctx.stroke();
            cctx.fillStyle = '#3b82f6'; cctx.font = 'bold 10px sans-serif';
            cctx.fillText(`熔点: ${MELTING_POINT} K`, 10, yMelting - 5);

            let yBoiling = chartCanvas.height - (BOILING_POINT / 400) * chartCanvas.height;
            cctx.strokeStyle = 'rgba(251, 146, 60, 0.6)';
            cctx.beginPath(); cctx.moveTo(0, yBoiling); cctx.lineTo(chartCanvas.width, yBoiling); cctx.stroke();
            cctx.fillStyle = '#ea580c';
            cctx.fillText(`沸点: ${BOILING_POINT} K`, 10, yBoiling - 5);
            cctx.setLineDash([]);

            cctx.strokeStyle = '#f43f5e';
            cctx.lineWidth = 4;
            cctx.lineCap = 'round';
            cctx.beginPath();
            const maxPoints = 800;
            const step = chartCanvas.width / maxPoints;
            history.forEach((t, i) => {
                const x = i * step;
                const y = chartCanvas.height - (t / 400) * chartCanvas.height;
                if (i === 0) cctx.moveTo(x, y);
                else cctx.lineTo(x, y);
            });
            cctx.stroke();
        }

        // ===== 按钮事件 =====
        const heatBtn = document.getElementById('heatBtn');
        const coolBtn = document.getElementById('coolBtn');
        const stopBtn = document.getElementById('stopBtn');

        function setActiveButton(btn) {
            [heatBtn, coolBtn].forEach(b => {
                const icon = b.querySelector('.w-10');
                icon.classList.remove('scale-110', 'ring-2', 'ring-offset-2', 'ring-orange-400', 'ring-blue-400');
                if (b === btn) {
                    icon.classList.add('scale-110', 'ring-2', 'ring-offset-2');
                    icon.classList.add(b === heatBtn ? 'ring-orange-400' : 'ring-blue-400');
                }
            });
        }

        heatBtn.onclick = () => {
            if (heatMode === 1) { heatMode = 0; fireParticles = []; setActiveButton(null); }
            else { heatMode = 1; iceParticles = []; setActiveButton(heatBtn); }
        };
        coolBtn.onclick = () => {
            if (heatMode === -1) { heatMode = 0; iceParticles = []; setActiveButton(null); }
            else { heatMode = -1; fireParticles = []; setActiveButton(coolBtn); }
        };
        stopBtn.onclick = () => {
            heatMode = 0; fireParticles = []; iceParticles = []; setActiveButton(null);
        };

        // ===== 主循环 =====
        let frame = 0;
        function loop() {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawLiquidSurface();
            drawFire();
            drawIce();

            updateLogic();
            particles.forEach(p => p.update());

            // 粒子间排斥（滑动碰撞，含熔化后期）
            applyParticleRepulsion();

            particles.forEach(p => p.draw());

            if (frame % 4 === 0) {
                history.push(temperature);
                if (history.length > 800) history.shift();
                drawChart();
            }
            frame++;
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
        loop();
    </script>
</body>
</html>

            <div class="lg:col-span-2 stats-card p-6 rounded-2xl overflow-x-auto">

                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] text-slate-500 border-b border-slate-800">
                            <th class="pb-2">组别</th>
                            <th class="pb-2">H₂ 平均动能</th>
                            <th class="pb-2">Cl₂ 平均动能</th>

                        </tr>
                    </thead>
                    <tbody class="text-sm">
                        <tr>
                            <td class="py-3 text-blue-400 font-bold">实验组 A</td>
                            <td id="ek-h2-A">0.00</td>
                            <td id="ek-cl2-A">0.00</td>
                            <td id="rate-A">--</td>
                        </tr>
                        <tr>
                            <td class="py-3 text-orange-400 font-bold">实验组 B</td>
                            <td id="ek-h2-B">0.00</td>

    <script>
        const H_RADIUS = 10, CL_RADIUS = 15;
        const H_MASS = 1.0, CL_MASS = 2.5;
        const BASE_VELOCITY = 1.5; 

        // 定义微粒类
        class Particle {
            constructor(type, canvasW, canvasH, temp, vx, vy) {
                this.type = type;
                this.mass = type === 'H2' ? H_MASS : (type === 'Cl2' ? CL_MASS : (H_MASS + CL_MASS)/2);
                this.radius = type === 'H2' ? H_RADIUS : (type === 'Cl2' ? CL_RADIUS : (H_RADIUS + CL_RADIUS)*0.6);
                this.x = Math.random() * (canvasW - this.radius * 2) + this.radius;
                this.y = Math.random() * (canvasH - this.radius * 2) + this.radius;
                
                const speedScale = Math.sqrt(temp / 300);
                this.vx = vx || (Math.random() - 0.5) * BASE_VELOCITY * speedScale;
                this.vy = vy || (Math.random() - 0.5) * BASE_VELOCITY * speedScale;
            }

            update(w, h) {
                this.x += this.vx; this.y += this.vy;
                // 边界碰撞检测
                if (this.x < this.radius) { this.vx = Math.abs(this.vx); this.x = this.radius; }
                if (this.x > w - this.radius) { this.vx = -Math.abs(this.vx); this.x = w - this.radius; }
                if (this.y < this.radius) { this.vy = Math.abs(this.vy); this.y = this.radius; }
                if (this.y > h - this.radius) { this.vy = -Math.abs(this.vy); this.y = h - this.radius; }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx));
                const d = this.radius * 0.4;
                if (this.type === 'H2') this.drawBonded(ctx, -d, d, H_RADIUS, '#3b82f6', H_RADIUS, '#60a5fa');
                else if (this.type === 'Cl2') this.drawBonded(ctx, -d, d, CL_RADIUS, '#10b981', CL_RADIUS, '#34d399');
                else this.drawBonded(ctx, -d, d, H_RADIUS, '#3b82f6', CL_RADIUS, '#10b981');
                ctx.restore();
            }

            drawBonded(ctx, d1, d2, r1, c1, r2, c2) {
                ctx.beginPath(); ctx.fillStyle = c1; ctx.arc(d1, 0, r1, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.fillStyle = c2; ctx.arc(d2, 0, r2, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(d1, 0); ctx.lineTo(d2, 0); ctx.stroke();
            }

            getEk() { return 0.5 * this.mass * (this.vx**2 + this.vy**2); }
        }

        // 成功碰撞特效
        class Spark {
            constructor(x, y) { this.x = x; this.y = y; this.life = 1.0; }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, (1-this.life)*40, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(253, 224, 71, ${this.life})`; ctx.lineWidth = 2; ctx.stroke();
                this.life -= 0.05;
            }
        }

        // 模拟核心逻辑
        class Simulation {
            constructor(canvasId, containerId, sliders) {
                this.canvas = document.getElementById(canvasId);
                this.container = document.getElementById(containerId);
                this.ctx = this.canvas.getContext('2d');
                this.sliders = sliders;
                this.particles = [];
                this.effects = [];
                this.successCount = 0;
                this.init();
            }

            init() {
                // 根据压强缩放画布（模拟体积变化：V = 1/P）
                const pressureScale = 10 / parseInt(this.sliders.press.value); 
                const baseW = this.container.offsetWidth;
                const baseH = this.container.offsetHeight;
                
                this.canvas.width = baseW * pressureScale;
                this.canvas.height = baseH * pressureScale;
                
                this.particles = [];
                this.effects = [];
                this.successCount = 0;
                const count = parseInt(this.sliders.conc.value);
                const temp = parseInt(this.sliders.temp.value);
                for(let i=0; i<count; i++) {
                    this.particles.push(new Particle('H2', this.canvas.width, this.canvas.height, temp));
                    this.particles.push(new Particle('Cl2', this.canvas.width, this.canvas.height, temp));
                }
            }

            update() {
                const ea = parseInt(document.getElementById('slider-ea').value);
                const w = this.canvas.width;
                const h = this.canvas.height;

                for(let i=0; i<this.particles.length; i++) {
                    for(let j=i+1; j<this.particles.length; j++) {
                        const p1 = this.particles[i]; const p2 = this.particles[j];
                        const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        if (dist < p1.radius + p2.radius) {
                            this.resolveCollision(p1, p2);
                            // 判断是否为反应碰撞（H2 + Cl2）
                            if((p1.type === 'H2' && p2.type === 'Cl2') || (p1.type === 'Cl2' && p2.type === 'H2')) {
                                const relV2 = (p1.vx-p2.vx)**2 + (p1.vy-p2.vy)**2;
                                const energy = 0.5 * ((p1.mass+p2.mass)/2) * relV2;
                                if (energy > ea * 0.7) {
                                    this.successCount++;
                                    const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
                                    const v1x = p1.vx, v1y = p1.vy, v2x = p2.vx, v2y = p2.vy;
                                    this.effects.push(new Spark(mx, my));
                                    this.particles.splice(j, 1); this.particles.splice(i, 1);
                                    this.particles.push(new Particle('HCl', w, h, 0, v1x, v1y));
                                    this.particles.push(new Particle('HCl', w, h, 0, v2x, v2y));
                                    return;
                                }
                            }
                        }
                    }
                }
                this.particles.forEach(p => p.update(w, h));
                this.effects = this.effects.filter(e => e.life > 0);
            }

            resolveCollision(p1, p2) {
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const d = Math.hypot(dx, dy);
                if (d === 0) return;
                const nx = dx/d, ny = dy/d;
                const v1n = p1.vx*nx + p1.vy*ny, v2n = p2.vx*nx + p2.vy*ny;
                if (v1n < v2n) return;
                const mSum = p1.mass + p2.mass;
                const v1nF = (v1n*(p1.mass - p2.mass) + 2*p2.mass*v2n)/mSum;
                const v2nF = (v2n*(p2.mass - p1.mass) + 2*p1.mass*v1n)/mSum;
                p1.vx += (v1nF-v1n)*nx; p1.vy += (v1nF-v1n)*ny;
                p2.vx += (v2nF-v2n)*nx; p2.vy += (v2nF-v2n)*ny;
            }

            draw() {
                this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                this.particles.forEach(p => p.draw(this.ctx));
                this.effects.forEach(e => e.draw(this.ctx));
            }

            getData() {
                const h2 = this.particles.filter(p => p.type === 'H2');
                const cl2 = this.particles.filter(p => p.type === 'Cl2');
                const hcl = this.particles.filter(p => p.type === 'HCl');
                const ekH2 = h2.length ? h2.reduce((s,p)=>s+p.getEk(),0)/h2.length : 0;
                const ekCl2 = cl2.length ? cl2.reduce((s,p)=>s+p.getEk(),0)/cl2.length : 0;
                return { h2: h2.length, cl2: cl2.length, hcl: hcl.length, ekH2, ekCl2, success: this.successCount };
            }
        }

        const slidersA = { 
            temp: document.getElementById('slider-tempA'), 
            conc: document.getElementById('slider-concA'),
            press: document.getElementById('slider-pressA')
        };
        const slidersB = { 
            temp: document.getElementById('slider-tempB'), 
            conc: document.getElementById('slider-concB'),
            press: document.getElementById('slider-pressB')
        };
        
        const simA = new Simulation('canvasA', 'containerA', slidersA);
        const simB = new Simulation('canvasB', 'containerB', slidersB);

        function updateUI() {
            const dataA = simA.getData();
            const dataB = simB.getData();

            document.getElementById('h2-A').innerText = dataA.h2;
            document.getElementById('cl2-A').innerText = dataA.cl2;
            document.getElementById('hcl-A').innerText = dataA.hcl;
            document.getElementById('success-A').innerText = dataA.success;
            document.getElementById('ek-h2-A').innerText = dataA.ekH2.toFixed(2);
            document.getElementById('ek-cl2-A').innerText = dataA.ekCl2.toFixed(2);
            
            document.getElementById('h2-B').innerText = dataB.h2;
            document.getElementById('cl2-B').innerText = dataB.cl2;
            document.getElementById('hcl-B').innerText = dataB.hcl;
            document.getElementById('success-B').innerText = dataB.success;
            document.getElementById('ek-h2-B').innerText = dataB.ekH2.toFixed(2);
            document.getElementById('ek-cl2-B').innerText = dataB.ekCl2.toFixed(2);

            document.getElementById('val-ea').innerText = document.getElementById('slider-ea').value;
            document.getElementById('val-tempA').innerText = slidersA.temp.value;
            document.getElementById('val-concA').innerText = slidersA.conc.value;
            document.getElementById('val-pressA').innerText = (slidersA.press.value / 10).toFixed(1);
            document.getElementById('val-tempB').innerText = slidersB.temp.value;
            document.getElementById('val-concB').innerText = slidersB.conc.value;
            document.getElementById('val-pressB').innerText = (slidersB.press.value / 10).toFixed(1);

            const ea = document.getElementById('slider-ea').value;
            document.getElementById('rate-A').innerText = (Math.exp(-ea/(slidersA.temp.value/10)) * 100).toFixed(1) + "%";
            document.getElementById('rate-B').innerText = (Math.exp(-ea/(slidersB.temp.value/10)) * 100).toFixed(1) + "%";
        }

        function mainLoop() {
            simA.update(); simA.draw();
            simB.update(); simB.draw();
            if(Math.random() > 0.8) updateUI();
            requestAnimationFrame(mainLoop);
        }

        // 监听滑块变化
        [slidersA.temp, slidersA.conc, slidersA.press, slidersB.temp, slidersB.conc, slidersB.press].forEach(s => {
            s.addEventListener('input', () => {
                const isA = s.id.includes('A');
                const sim = isA ? simA : simB;
                
                if(s.id.includes('conc') || s.id.includes('press')) {
                    sim.init();
                }
                
                if(s.id.includes('temp')) {
                    const scale = Math.sqrt(s.value / 300);
                    sim.particles.forEach(p => {
                        const currentV = Math.hypot(p.vx, p.vy);
                        const targetV = (Math.random() + 0.5) * BASE_VELOCITY * scale;
                        if(currentV !== 0) { p.vx *= (targetV / currentV); p.vy *= (targetV / currentV); }
                    });
                }
                updateUI();
            });
        });

        document.getElementById('btn-reset').addEventListener('click', () => { simA.init(); simB.init(); updateUI(); });
        window.addEventListener('resize', () => { simA.init(); simB.init(); });
        window.onload = () => { updateUI(); mainLoop(); };
    </script>

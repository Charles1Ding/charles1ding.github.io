<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Space · Charles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url('bg.png') center center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.22);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px 80px;
    }

    nav {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 0 0;
      gap: 36px;
    }
    .nav-logo {
      font-family: 'Caveat', cursive;
      font-size: 1.7rem;
      font-weight: 700;
      color: #2d5fa3;
      letter-spacing: 0.5px;
    }
    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.95rem;
      font-weight: 600;
      color: #3a5a8c;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #1a3a6b; }

    .page-title {
      margin-top: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(2.2rem, 5.5vw, 3.5rem);
      font-weight: 800;
      font-style: italic;
      color: #1e3a6e;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .page-subtitle {
      margin-top: 8px;
      font-size: clamp(1rem, 2vw, 1.15rem);
      font-weight: 600;
      font-style: italic;
      color: #2563c7;
      opacity: 0.85;
      text-align: center;
    }
    .page-divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, #4a78c8, #0e8a6d);
      border-radius: 2px;
      margin: 16px auto 0;
    }

    /* ── Private space cards ── */
    .private-grid {
      margin-top: 48px;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .private-card {
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 28px 32px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .private-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }

    .pc-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
    }
    .pc-icon.guitar {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
    }

    .pc-body { flex: 1; min-width: 0; }

    .pc-title {
      font-size: 1.25rem;
      font-weight: 800;
      font-style: italic;
      color: #1e3a6e;
      letter-spacing: 0.3px;
    }
    .pc-desc {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #5a7aac;
      font-weight: 500;
      line-height: 1.5;
    }
    .pc-arrow {
      font-size: 1.5rem;
      color: #4a78c8;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .private-card:hover .pc-arrow { transform: translateX(4px); }

    .back-link {
      margin-top: 48px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #4a78c8;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #1a3a6b; }

    @media (max-width: 580px) {
      .private-card { flex-direction: column; text-align: center; padding: 24px 20px; }
      .pc-arrow { display: none; }
    }

    footer {
      margin-top: 50px;
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      color: #6a8fc0;
      text-align: center;
      letter-spacing: 0.3px;
    }
    footer span { color: #c06a7a; }
  </style>
</head>
<body>

<div class="bg"></div>

<div class="page">

  <nav>
    <div class="nav-logo">Charles.chem ⚗️</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
    </ul>
  </nav>

  <h1 class="page-title">🔐 Private Space</h1>
  <p class="page-subtitle">A little corner for my hobbies &amp; side projects</p>
  <div class="page-divider"></div>

  <div class="private-grid">
    <!-- Guitar Academy -->
    <a class="private-card" href="guitar-academy.html">
      <div class="pc-icon guitar">🎸</div>
      <div class="pc-body">
        <div class="pc-title">吉他弹唱学院</div>
        <div class="pc-desc">Guitar Academy — interactive chords, tuner, and practice tools for singing &amp; playing</div>
      </div>
      <div class="pc-arrow">→</div>
    </a>
  </div>

  <a class="back-link" href="index.html">← Back to Home</a>

  <footer>Made with <span>♥</span> by Charles · Chemistry is everywhere 🧪</footer>

</div>
</body>
</html>

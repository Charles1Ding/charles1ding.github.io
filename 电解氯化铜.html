    <div class="flex flex-col gap-6 p-6 bg-white rounded-3xl shadow-2xl w-full max-w-[1000px] border border-slate-100">
        <!-- 顶部标题与控制栏 -->
        <div class="flex flex-col md:flex-row items-center justify-between px-4 gap-6">
            <div class="flex flex-col">
                <h2 class="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                    <div class="p-2 bg-blue-100 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="zap-icon"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                    </div>
                    氯化铜电解 (视觉优化版)
                </h2>
                <p class="text-[10px] text-slate-400 mt-1 uppercase font-bold tracking-widest ml-12 italic">Reduced Electrons & Clear Labels</p>
            </div>
            
            <div class="flex flex-1 items-center gap-4 bg-slate-50 px-6 py-2 rounded-2xl border border-slate-100">
                <span class="text-xs font-bold text-slate-500 whitespace-nowrap">反应速率</span>

                </button>
                <button id="resetBtn" class="p-3 rounded-xl border-2 border-slate-100 text-slate-400 hover:bg-slate-50 transition-colors" title="重置实验">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </button>

        <!-- 核心模拟区 -->

            <canvas id="electrolysisCanvas" width="900" height="500" class="w-full h-auto"></canvas>
            
            <div class="absolute top-4 right-4 bg-white/90 backdrop-blur p-4 rounded-xl border border-slate-200 shadow-sm space-y-2 pointer-events-none">

                    <span class="text-xs font-bold text-blue-500">剩余 Cu²⁺:</span>
                    <span id="cuCount" class="text-sm font-mono font-bold text-slate-800">0</span>
                </div>
                <div class="flex items-center justify-between gap-8">
                    <span class="text-xs font-bold text-green-600">剩余 Cl⁻:</span>
                    <span id="clCount" class="text-sm font-mono font-bold text-slate-800">0</span>
                </div>
            </div>
        </div>

        <!-- 底部信息区 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 px-2 text-center md:text-left">
            <div class="md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4 text-left">
                <div class="p-4 bg-green-50/50 rounded-2xl border border-green-100">

                    <p class="text-xl font-mono font-bold text-slate-700 mt-1">2Cl⁻ - 2e⁻ → Cl₂↑</p>
                </div>
                <div class="p-4 bg-blue-50/50 rounded-2xl border border-blue-100 text-left">
                    <span class="text-xs font-bold text-blue-500 uppercase tracking-widest italic">Cathode (-) 阴极</span>
                    <p class="text-xl font-mono font-bold text-slate-700 mt-1">Cu²⁺ + 2e⁻ → Cu↓</p>
                </div>

                <p class="text-[10px] text-slate-400 font-bold mb-2 uppercase tracking-tighter">UI 优化说明</p>
                <ul class="text-white text-[11px] space-y-1 opacity-80 leading-tight">
                    <li>• 电子数量已减少，轨迹清晰。</li>
                    <li>• 极性符号置于顶层，无遮挡。</li>
                    <li>• 电子仅在电极顶部连接处穿梭。</li>
                </ul>
            </div>
        </div>

    <script>
        const canvas = document.getElementById('electrolysisCanvas');
        const ctx = canvas.getContext('2d');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const btnText = document.getElementById('btnText');
        const playIcon = document.getElementById('playIcon');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const cuCounter = document.getElementById('cuCount');
        const clCounter = document.getElementById('clCount');

        let isActive = false;
        let ions = [];
        let electrons = [];
        let bubbles = [];
        let depositedCu = [];
        let ionSpeed = 3.5;

        // 布局坐标
        const anodeX = 220;   
        const cathodeX = 680; 
        const startY = 220;
        const tankWidth = 700;
        const tankHeight = 250;
        const wireTopY = 80;
        const powerCenterX = 450;

        function init() {
            ions = [];
            for (let i = 0; i < 20; i++) {
                ions.push({ 
                    x: 230 + Math.random() * 440, 
                    y: 240 + Math.random() * 160, 
                    type: 'cu', 
                    color: '#3b82f6', 
                    vx: (Math.random()-0.5)*0.5, 
                    vy: (Math.random()-0.5)*0.5 
                });
            }
            for (let i = 0; i < 40; i++) {
                ions.push({ 
                    x: 230 + Math.random() * 440, 
                    y: 240 + Math.random() * 160, 
                    type: 'cl', 
                    color: '#22c55e', 
                    vx: (Math.random()-0.5)*0.5, 
                    vy: (Math.random()-0.5)*0.5 
                });
            }
            // 核心修改：电子减少到 12 个
            electrons = [];
            for (let i = 0; i < 12; i++) {
                electrons.push({ pos: i / 12, speed: 0.002 });
            }
            bubbles = [];
            depositedCu = [];
            updateStats();
        }

        function updateStats() {
            const cus = ions.filter(i => i.type === 'cu').length;
            const cls = ions.filter(i => i.type === 'cl').length;
            cuCounter.innerText = cus;
            clCounter.innerText = cls;
            if (cus === 0 && cls === 0 && isActive) stopExperiment();
        }

        function stopExperiment() {
            isActive = false;
            btnText.innerText = "开始";
            toggleBtn.className = "flex items-center gap-2 px-10 py-3 bg-blue-600 text-white rounded-xl font-bold transition-all transform active:scale-95 shadow-xl shadow-blue-200 hover:bg-blue-700";
            playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 绘制容器
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(100, startY);
            ctx.lineTo(100, startY + tankHeight);
            ctx.lineTo(800, startY + tankHeight);
            ctx.lineTo(800, startY);
            ctx.stroke();
            const ionDensity = ions.length / 60;
            ctx.fillStyle = `rgba(224, 242, 254, ${0.1 + ionDensity * 0.4})`;
            ctx.fillRect(103, startY + 2, 694, tankHeight - 5);

            // 2. 绘制沉积铜
            depositedCu.forEach(cu => {
                ctx.fillStyle = '#ea580c';
                ctx.beginPath();
                ctx.arc(cu.x, cu.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#9a3412';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // 3. 绘制离子
            for (let i = ions.length - 1; i >= 0; i--) {
                const ion = ions[i];
                if (isActive) {
                    if (ion.type === 'cu') {
                        ion.x += ionSpeed; 
                        if (ion.x >= cathodeX - 15) {
                            depositedCu.push({ x: cathodeX - 15 + Math.random() * 5, y: ion.y });
                            ions.splice(i, 1);
                            updateStats();
                            continue;
                        }
                    } else {
                        ion.x -= ionSpeed; 
                        if (ion.x <= anodeX + 15) {
                            bubbles.push({ x: anodeX - 10, y: ion.y, r: 3 + Math.random() * 5, vx: (Math.random() - 0.5) * 0.4 });
                            ions.splice(i, 1);
                            updateStats();
                            continue;
                        }
                    }
                } else {
                    ion.x += ion.vx; ion.y += ion.vy;
                    if (ion.x < 120 || ion.x > 780) ion.vx *= -1;
                    if (ion.y < 230 || ion.y > 440) ion.vy *= -1;
                }
                ctx.fillStyle = ion.color;
                ctx.beginPath(); ctx.arc(ion.x, ion.y, 14, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(ion.type === 'cu' ? 'Cu²⁺' : 'Cl⁻', ion.x, ion.y + 4);
            }

            // 4. 气泡
            bubbles.forEach((b) => {
                b.y -= 1.5; b.x += b.vx;
                ctx.fillStyle = 'rgba(74, 222, 128, 0.4)';
                ctx.strokeStyle = '#15803d';
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            });
            bubbles = bubbles.filter(b => b.y > 150);

            // 5. 绘制导线和电极主体 (不含符号)
            ctx.fillStyle = '#334155';
            ctx.fillRect(anodeX - 15, 180, 30, 220); 
            ctx.fillRect(cathodeX - 15, 180, 30, 220); 

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(anodeX, 180); ctx.lineTo(anodeX, wireTopY); ctx.lineTo(powerCenterX - 40, wireTopY); ctx.lineTo(powerCenterX - 40, 120);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cathodeX, 180); ctx.lineTo(cathodeX, wireTopY); ctx.lineTo(powerCenterX + 40, wireTopY); ctx.lineTo(powerCenterX + 40, 120);
            ctx.stroke();
            
            // 6. 电子流动 (在符号之前绘制，符号将覆盖在电子之上)
            if (isActive && ions.length > 0) {
                electrons.forEach(e => {
                    e.pos += e.speed * (ionSpeed / 2.5);
                    if (e.pos > 1) e.pos = 0;
                    let x, y;
                    if (e.pos < 0.5) { 
                        let t = e.pos / 0.5;
                        if (t < 0.4) { x = anodeX; y = 180 - (t/0.4)*100; }
                        else if (t < 0.8) { x = anodeX + ((t-0.4)/0.4)*(powerCenterX-40-anodeX); y = wireTopY; }
                        else { x = powerCenterX - 40; y = wireTopY + ((t-0.8)/0.2)*40; }
                    } else {
                        let t = (e.pos - 0.5) / 0.5;
                        if (t < 0.2) { x = powerCenterX + 40; y = 120 - (t/0.2)*40; }
                        else if (t < 0.6) { x = powerCenterX + 40 + ((t-0.2)/0.4)*(cathodeX-(powerCenterX+40)); y = wireTopY; }
                        else { x = cathodeX; y = wireTopY + ((t-0.6)/0.4)*100; }
                    }
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 8; ctx.shadowColor = 'yellow';
                    ctx.strokeStyle = '#ca8a04'; ctx.stroke(); ctx.shadowBlur = 0;
                    ctx.fillStyle = '#1e293b'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText('e⁻', x, y + 3);
                });
            }

            // 7. 绘制电源盒及符号 (顶层绘制，确保不被电子挡住)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(powerCenterX - 60, 40, 120, 80);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText('直流电源', powerCenterX, 75);
            
            // 极性符号绘制 - 始终在顶层
            ctx.font = '900 24px sans-serif';
            ctx.fillStyle = '#f87171'; ctx.fillText('+', powerCenterX - 40, 105); // 电源正极
            ctx.fillStyle = '#60a5fa'; ctx.fillText('-', powerCenterX + 40, 105); // 电源负极

            // 电极上的符号 - 始终在顶层
            ctx.font = '900 32px sans-serif';
            ctx.fillStyle = '#ef4444'; ctx.fillText('+', anodeX, 208);   // 阳极符号
            ctx.fillStyle = '#3b82f6'; ctx.fillText('-', cathodeX, 208); // 阴极符号
            
            ctx.font = 'bold 11px sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('ANODE', anodeX, 235);
            ctx.fillText('CATHODE', cathodeX, 235);

            requestAnimationFrame(draw);
        }

        speedSlider.oninput = (e) => {
            ionSpeed = parseFloat(e.target.value);
            speedValue.innerText = ionSpeed.toFixed(1);
        };

        toggleBtn.onclick = () => {
            if (ions.length === 0) init();
            isActive = !isActive;
            if (isActive) {
                btnText.innerText = "暂停";
                toggleBtn.classList.replace('bg-blue-600', 'bg-orange-100');
                toggleBtn.classList.replace('text-white', 'text-orange-600');
                toggleBtn.classList.add('border-2', 'border-orange-200');
                playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
            } else {
                stopExperiment();
            }
        };

        resetBtn.onclick = () => { stopExperiment(); init(); };
        window.onload = () => { init(); draw(); };
    </script>

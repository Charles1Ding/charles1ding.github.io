    :root {
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --accent: #1a56a0;
      --accent-light: #e8f0fb;
      --accent2: #0e8a6d;
      --accent2-light: #e6f5f1;
      --text: #1e293b;
      --subtext: #64748b;
      --border: #e2e8f0;
      --tag-en: #dbeafe;
      --tag-en-text: #1d4ed8;
      --tag-cn: #fce7f3;
      --tag-cn-text: #9d174d;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a3a6b 0%, #1a56a0 60%, #0e8a6d 100%);
      color: #fff;
      padding: 48px 24px 36px;
      text-align: center;
    }
    header .logo {
      font-size: 2.6rem;
      margin-bottom: 8px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    header p {
      font-size: 1.05rem;
      opacity: 0.85;
    }
    header .badge {
      display: inline-block;
      margin-top: 16px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
    }

    .controls {
      max-width: 1100px;
      margin: 24px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--subtext);
      font-size: 1.1rem;
    }
    .filter-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btns button {
      padding: 7px 14px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.18s;
    }
    .filter-btns button.active,
    .filter-btns button:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .stats {
      max-width: 1100px;
      margin: 16px auto 4px;
      padding: 0 20px;
      font-size: 0.9rem;
      color: var(--subtext);
    }

    .grid {
      max-width: 1100px;
      margin: 12px auto 48px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(26,86,160,0.13);
      border-color: var(--accent);
    }
    .card-icon {
      font-size: 1.7rem;
      line-height: 1;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .tag-en { background: var(--tag-en); color: var(--tag-en-text); }
    .tag-cn { background: var(--tag-cn); color: var(--tag-cn-text); }
    .tag-topic {
      background: #f0fdf4;
      color: #15803d;
    }
    .card-desc {
      font-size: 0.83rem;
      color: var(--subtext);
      line-height: 1.5;
    }

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: var(--subtext);
      font-size: 1.05rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--subtext);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.4rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

let currentFilter = 'all';

function topicInFilter(topic, filter) {
  if (filter === 'all') return true;
  if (filter === 'en' || filter === 'cn') return false; // handled by lang
  const topicMap = {
    electrochemistry: ['electrochemistry'],
    acids: ['acids', 'equilibrium'],
    metals: ['metals'],
    thermochemistry: ['thermochemistry'],
    organic: ['organic'],
    other: ['other', 'kinetics', 'analytical', 'equilibrium']
  };
  return (topicMap[filter] || []).includes(topic);
}

function renderCards(list) {
  const grid = document.getElementById('cardGrid');
  const stats = document.getElementById('statsBar');
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<div class="no-result">😕 No models found. Try a different search.</div>';
    stats.textContent = 'No models found';
    return;
  }
  stats.textContent = `Showing ${list.length} of 63 models`;
  list.forEach(m => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = encodeURIComponent(m.file);
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `
      <div class="card-icon">${m.icon}</div>
      <div class="card-title">${m.title}</div>
      <div class="card-tags">
        <span class="tag ${m.lang === 'en' ? 'tag-en' : 'tag-cn'}">${m.lang === 'en' ? 'English' : '中文'}</span>
        <span class="tag tag-topic">${m.topicLabel}</span>
      </div>
      <div class="card-desc">${m.desc}</div>
    `;
    grid.appendChild(a);
  });
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = models.filter(m => {
    const matchLang = currentFilter === 'en' ? m.lang === 'en'
                    : currentFilter === 'cn' ? m.lang === 'cn'
                    : currentFilter === 'all' ? true
                    : topicInFilter(m.topic, currentFilter);
    const matchQ = !q || m.title.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q) || m.file.toLowerCase().includes(q);
    return matchLang && matchQ;
  });
  renderCards(filtered);
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btns button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

renderCards(models);
</script>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f2f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a3a6b 0%, #1a56a0 60%, #0e8a6d 100%);
      color: #fff;
      padding: 36px 24px 28px;
      text-align: center;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    header .badge {
      display: inline-block;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 3px 14px;
      font-size: 0.78rem;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    header h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    header p {
      font-size: 0.95rem;
      opacity: 0.85;
    }

    /* ── Back link ── */
    .back-link {
      max-width: 1040px;
      margin: 18px auto 0;
      padding: 0 20px;
      font-size: 0.85rem;
    }
    .back-link a {
      color: #4a78c8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.18s;
    }
    .back-link a:hover { color: #1a3a6b; }

    /* ── Year selector tabs ── */
    .year-selector {
      max-width: 1040px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .year-tab {
      padding: 10px 22px;
      border-radius: 10px 10px 0 0;
      border: 1.5px solid transparent;
      background: #fff;
      color: #475569;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
      position: relative;
    }
    .year-tab:hover { color: #1a56a0; background: #e8f4fd; }
    .year-tab.active {
      background: #1a56a0;
      color: #fff;
      border-color: #1a56a0;
    }
    .year-tab .tab-count {
      font-size: 0.72rem;
      font-weight: 400;
      opacity: 0.75;
      margin-left: 4px;
    }

    /* ── Year content panel ── */
    .year-panel {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px;
      background: #fff;
      border-radius: 0 12px 12px 12px;
      border: 1px solid #e2e8f0;
      border-top: 3px solid #1a56a0;
      min-height: 120px;
      display: none;
    }
    .year-panel.active { display: block; }
    .year-panel-placeholder {
      text-align: center;
      color: #94a3b8;
      padding: 40px;
      font-size: 0.9rem;
    }

    /* ── Stats bar ── */
    .stats-bar {
      max-width: 1040px;
      margin: 14px auto 8px;
      padding: 0 20px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .stats-left {
      font-size: 0.88rem;
      color: #64748b;
    }
    .search-box input {
      padding: 8px 14px;
      border: 1.5px solid #d0d9e4;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 220px;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.18s;
    }
    .search-box input:focus { border-color: #4a78c8; }

    /* ── Paper type key ── */
    .paper-key {
      max-width: 1040px;
      margin: 6px auto 12px;
      padding: 0 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: #64748b;
    }
    .paper-key span {
      background: #eef3fa;
      padding: 3px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .paper-key strong { color: #2d5fa3; }

    /* ── Container ── */
    .container {
      max-width: 1040px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }

    /* ── Session tabs ── */
    .sessions {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .session-tab {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1.5px solid #d0d9e4;
      background: #fff;
      color: #475569;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.18s;
    }
    .session-tab.active {
      background: #1a56a0;
      color: #fff;
      border-color: #1a56a0;
    }
    .session-tab:hover:not(.active) {
      border-color: #4a78c8;
      color: #2d5fa3;
    }

    /* ── Paper type groups ── */
    .type-group {
      margin-bottom: 22px;
    }
    .type-group-header {
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
      padding: 8px 12px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .type-group-header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.mc { background: #3b82f6; }
    .dot.th { background: #8b5cf6; }
    .dot.co { background: #06b6d4; }
    .dot.pr { background: #f59e0b; }

    /* ── Paper number cards ── */
    .paper-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    @media (max-width: 680px) { .paper-grid { grid-template-columns: 1fr; } }

    .paper-card {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.03);
      transition: box-shadow 0.18s;
    }
    .paper-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .paper-card-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 600;
      font-size: 0.88rem;
      color: #1e293b;
    }
    .paper-card-head .pn {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a56a0;
      background: #e8f4fd;
      width: 38px; height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .paper-card-head .pn.th-color { color: #7c3aed; background: #ede9fe; }
    .paper-card-head .pn.co-color { color: #0891b2; background: #cffafe; }
    .paper-card-head .pn.pr-color { color: #d97706; background: #fef3c7; }
    .paper-card-body {
      display: flex;
      flex-direction: column;
    }
    .paper-file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      font-size: 0.8rem;
      border-bottom: 1px solid #f8fafc;
    }
    .paper-file-row:last-child { border-bottom: none; }
    .paper-file-row .ft {
      font-weight: 500;
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 5px;
      flex-shrink: 0;
      margin-right: 8px;
    }
    .ft.qp-tag { background: #e8f4fd; color: #1d4ed8; }
    .ft.ms-tag { background: #fef3c7; color: #b45309; }
    .paper-file-row .fn {
      color: #475569;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .paper-file-row .actions { display: flex; gap: 4px; flex-shrink: 0; margin-left: 8px; }
    .paper-file-row a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 5px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .paper-file-row a.open-link { background: #e8f4fd; color: #1d4ed8; }
    .paper-file-row a.open-link:hover { background: #bfdbfe; }
    .paper-file-row a.open-link.ms-link { background: #fef3c7; color: #b45309; }

    .paper-file-row a.dl-link { background: #eef2ff; color: #4f46e5; }

    .paper-file-row a.dl-link.ms-link:hover { background: #fef3c7; }

      padding: 20px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 28px;
      color: #94a3b8;
      font-size: 0.82rem;
      border-top: 1px solid #e2e8f0;
      margin-top: 40px;
    }

    .hidden { display: none; }
  </style>
</head>

const years = Object.keys(DATA).sort((a,b) => b - a);
const sessionOrder = ['March', 'June', 'November'];

function countPapers(sessionData) {
  return (sessionData['Question Paper'] || []).length + (sessionData['Mark Scheme'] || []).length;
}

function countYearPapers(yearData) {
  let c = 0;
  for (const s in yearData) c += countPapers(yearData[s]);
  return c;
}

var totalFiles = 0;
for (const y in DATA) totalFiles += countYearPapers(DATA[y]);

let currentYear = years[0];
let currentSession = null;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('statsText').textContent =
    `${totalFiles} papers across ${years.length} years`;

  // Build year tabs
  const sel = document.getElementById('yearSelector');
  years.forEach((year, i) => {
    const yc = countYearPapers(DATA[year]);
    const tab = document.createElement('div');
    tab.className = 'year-tab' + (i === 0 ? ' active' : '');
    tab.innerHTML = `${year}<span class="tab-count">${yc} papers</span>`;
    tab.onclick = () => {
      document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentYear = year;
      currentSession = null;
      renderYear(year);
    };
    sel.appendChild(tab);
  });

  // Render the first (latest) year by default
  renderYear(years[0]);
});

function renderYear(year) {
  const panel = document.getElementById('yearPanel');
  const yearData = DATA[year];
  const sessions = sessionOrder.filter(s => yearData[s] && countPapers(yearData[s]) > 0);

  if (!sessions.length) {
    panel.innerHTML = '<div class="year-panel-placeholder">No papers available for ' + year + '</div>';
    return;
  }

  panel.innerHTML = '';

  // Session tabs
  const tabsDiv = document.createElement('div');
  tabsDiv.className = 'sessions';
  sessions.forEach((sess, i) => {
    const tab = document.createElement('div');
    tab.className = 'session-tab' + ((!currentSession && i === 0) || currentSession === sess ? ' active' : '');
    tab.textContent = sess + ' ' + year;
    tab.onclick = () => {
      tabsDiv.querySelectorAll('.session-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentSession = sess;
      renderSessionPanel(year, sess, panelsDiv);
    };
    tabsDiv.appendChild(tab);
  });
  panel.appendChild(tabsDiv);

  const panelsDiv = document.createElement('div');
  panelsDiv.className = 'session-panel';
  panel.appendChild(panelsDiv);

  // Render the active session
  const activeSess = currentSession || sessions[0];
  currentSession = activeSess;
  renderSessionPanel(year, activeSess, panelsDiv);
}

function renderSessionPanel(year, session, container) {
  const sessionData = DATA[year][session];
  const qp = sessionData['Question Paper'] || [];
  const ms = sessionData['Mark Scheme'] || [];

  // Build a map: paperNumber → { qpFile, msFile, label }
  const paperMap = {};
  qp.forEach(p => {
    if (!paperMap[p.paper]) paperMap[p.paper] = { label: p.label };
    paperMap[p.paper].qpFile = p.file;
  });
  ms.forEach(p => {
    if (!paperMap[p.paper]) paperMap[p.paper] = { label: p.label };
    paperMap[p.paper].msFile = p.file;
  });

  const paperNums = Object.keys(paperMap).sort((a,b) => parseInt(a) - parseInt(b));

  // Group paper numbers by type
  const groups = [
    { id: 'mc', name: 'Multiple Choice', dot: 'mc', desc: 'Papers 21 · 22 · 23', color: 'mc-color',
      papers: paperNums.filter(p => ['21','22','23'].includes(p)) },
    { id: 'th', name: 'Theory — Extended', dot: 'th', desc: 'Papers 41 · 42 · 43', color: 'th-color',
      papers: paperNums.filter(p => ['41','42','43'].includes(p)) },
    { id: 'co', name: 'Theory — Core', dot: 'co', desc: 'Paper 32', color: 'co-color',
      papers: paperNums.filter(p => p === '32') },
    { id: 'pr', name: 'Alternative to Practical', dot: 'pr', desc: 'Papers 61 · 62 · 63', color: 'pr-color',
      papers: paperNums.filter(p => ['61','62','63'].includes(p)) },
  ];

  container.innerHTML = '';

  groups.forEach(g => {
    if (!g.papers.length) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'type-group';

    const hdr = document.createElement('div');
    hdr.className = 'type-group-header';
    hdr.innerHTML = `<span class="dot ${g.dot}"></span>${g.name} <span style="font-weight:400;font-size:0.78rem;color:#94a3b8;">${g.desc}</span>`;
    wrapper.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'paper-grid';

    g.papers.forEach(pn => {
      const info = paperMap[pn];
      const card = document.createElement('div');
      card.className = 'paper-card';
      card.setAttribute('data-search', `${year} ${session} ${pn} ${info.label}`);

      // Card header
      const ch = document.createElement('div');
      ch.className = 'paper-card-head';
      ch.innerHTML = `<span class="pn ${g.color}">${pn}</span><span>${info.label.replace('Paper '+pn+' - ','')}</span>`;
      card.appendChild(ch);

      // Card body
      const cb = document.createElement('div');
      cb.className = 'paper-card-body';

      // QP row
      const qpRow = document.createElement('div');
      qpRow.className = 'paper-file-row';
      if (info.qpFile) {
        qpRow.innerHTML = `<span class="ft qp-tag">QP</span>
          <span class="fn">Question Paper</span>
          <span class="actions">
            <a href="past-papers/${encodeURIComponent(info.qpFile)}" target="_blank" class="open-link">Open</a>
            <a href="past-papers/${encodeURIComponent(info.qpFile)}" download class="dl-link">Download</a>
          </span>`;
      } else {
        qpRow.innerHTML = `<span class="ft qp-tag">QP</span>
          <span class="fn" style="color:#cbd5e1;">Not available</span>`;
      }
      cb.appendChild(qpRow);

      // MS row
      const msRow = document.createElement('div');
      msRow.className = 'paper-file-row';
      if (info.msFile) {
        msRow.innerHTML = `<span class="ft ms-tag">MS</span>
          <span class="fn">Mark Scheme</span>
          <span class="actions">
            <a href="past-papers/${encodeURIComponent(info.msFile)}" target="_blank" class="open-link ms-link">Open</a>
            <a href="past-papers/${encodeURIComponent(info.msFile)}" download class="dl-link ms-link">Download</a>
          </span>`;
      } else {
        msRow.innerHTML = `<span class="ft ms-tag">MS</span>
          <span class="fn" style="color:#cbd5e1;">Not available</span>`;
      }
      cb.appendChild(msRow);

      card.appendChild(cb);
      grid.appendChild(card);
    });

    wrapper.appendChild(grid);
    container.appendChild(wrapper);
  });

  if (!paperNums.length) {
    container.innerHTML = '<div class="no-files">No papers available for this session</div>';
  }
}

function filterPapers() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const panel = document.getElementById('yearPanel');
  const cards = panel.querySelectorAll('.paper-card');
  const typeGroups = panel.querySelectorAll('.type-group');
  let visible = 0;
  typeGroups.forEach(g => {
    let hasVisible = false;
    g.querySelectorAll('.paper-card').forEach(card => {
      const txt = (card.getAttribute('data-search') || '').toLowerCase();
      if (!q || txt.includes(q)) {
        card.style.display = '';
        visible++;
        hasVisible = true;
      } else {
        card.style.display = 'none';
      }
    });
    g.style.display = hasVisible ? '' : 'none';
  });
  document.getElementById('statsText').textContent =
    q ? `Filtered: ${visible} of ${totalFiles} papers` : `${totalFiles} papers across ${years.length} years`;
}

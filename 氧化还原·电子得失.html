*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#BEBEBE;
  font-family:'MB','Segoe UI',system-ui,sans-serif;
  font-weight:900;
  color:#2F2F2F;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.wrap{
  flex:1;min-height:0;width:100%;max-width:1460px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;padding:12px 20px 14px;
}
.kicker{
  text-align:center;font-size:15px;letter-spacing:3.2px;
  color:#4A4A4A;opacity:.75;
}
.eq{
  text-align:center;font-size:38px;line-height:1.1;color:#2F2F2F;
  letter-spacing:.5px;
}
.tabs{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.tab{
  font-family:inherit;font-weight:900;font-size:17px;color:#2F2F2F;
  background:rgba(255,255,255,.42);border:0;border-radius:9px;
  padding:8px 17px;cursor:pointer;letter-spacing:.3px;
  transition:background .16s,color .16s;
}
.tab:hover{background:rgba(255,255,255,.68)}
.tab[aria-selected="true"]{background:#2F2F2F;color:#fff}
.stage{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
}
canvas{display:block;border-radius:6px}
.ctl{display:flex;gap:9px;justify-content:center}
.btn{
  font-family:inherit;font-weight:900;font-size:16px;color:#2F2F2F;
  background:rgba(255,255,255,.5);border:0;border-radius:9px;
  padding:9px 20px;cursor:pointer;letter-spacing:.3px;min-width:104px;
  transition:background .16s;
}
.btn:hover{background:rgba(255,255,255,.78)}
.btn:active{transform:translateY(1px)}
.btn.wide{min-width:150px}
.hint{text-align:center;font-size:12.5px;color:#4A4A4A;opacity:.62;letter-spacing:.4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">REDOX &mdash; ELECTRON LOSS &amp; GAIN</div>
  <div class="eq" id="eq">&nbsp;</div>
  <div class="tabs" id="tabs"></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="ctl">
    <button class="btn wide" id="play">Pause</button>
    <button class="btn" id="step">Step</button>
    <button class="btn" id="replay">Replay</button>
  </div>
  <div class="hint">Space = play / pause &nbsp;·&nbsp; Right arrow = step one group &nbsp;·&nbsp; R = replay</div>
</div>
<script>
'use strict';

/* ============================================================
   Canvas is authored in a fixed 1280x720 logical space and letterboxed to
   whatever box the stage gives us, so every coordinate below is resolution
   independent.
   ============================================================ */
const W = 1280, H = 720;
const R = 120;              // particle radius (0.167 x H -- the agreed unified scale)
const ER = 17;              // electron dot radius

const COL = {
  bg:'#BEBEBE',
  dark:'#666666',
  ink:'#2F2F2F',
  inkSoft:'#4A4A4A',
  mg:'#83CD3D',   // taken from the source video
  o :'#F42424',   // taken from the source video
  cl:'#D9B22B',
  k :'#726E91',
  br:'#8C4A2F',
  au:'#E8A81C',   // gold -- warm amber-metal, distinct from Cl's lemon yellow
  ar:'#5FA8D3',   // argon -- pale blue, unused elsewhere
  bond:'rgba(70,70,70,.34)',
  glow:'#EF9F27',
  force:'rgba(47,47,47,.50)',      // force arrows are neutral ink, not matter
  ghostPath:'rgba(47,47,47,.24)'   // the route an electron WOULD take
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function fit(){
  const box = document.getElementById('stage').getBoundingClientRect();
  if(box.width < 10 || box.height < 10) return;
  const s = Math.min(box.width / W, box.height / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}

/* ============================================================
   SMALL HELPERS
   ============================================================ */
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const smoothstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const clone = o=>JSON.parse(JSON.stringify(o));

function darken(hex, k){
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(((n>>16)&255)*k);
  const g = Math.round(((n>>8)&255)*k);
  const b = Math.round((n&255)*k);
  return 'rgb('+r+','+g+','+b+')';
}

// Particle glyph size: two-letter symbols need to be smaller to stay inside the
// circle. Tuned against R so it holds at any canvas size.
function glyphSize(el){ return el.length > 1 ? R*0.78 : R*0.98; }

function fitFont(text, maxW, base, weight){
  let s = base;
  for(let i=0;i<40;i++){
    ctx.font = weight + ' ' + s + 'px MB, sans-serif';
    if(ctx.measureText(text).width <= maxW) break;
    s -= 1;
    if(s < 8) break;
  }
  return s;
}

   a time cursor rather than inverting a state machine.

   need distinct ids. Rewrite them at load so the data above can stay readable. */
(function fixBromineIds(){
  const rx = REACTIONS[2];
  ['br1','br2'].forEach(pid=>{
    rx.init.rim[pid] = Array.from({length:8},(_,i)=>pid+'-b'+(i+1));
  });
  // the electron each Br- loses is its 8th; the pair it keeps for the Br-Br bond is its 1st
  rx.events[2].moves = [['br1-b8','cl1'],['br2-b8','cl2']];
  delete rx.events[2].moves2;
  rx.events[3].take = [['br1','br1-b1'],['br2','br2-b1']];

/* ============================================================
   SNAPSHOT MACHINE
   ============================================================ */
function stripElectron(st, eid){
  for(const pid in st.rim){
    const i = st.rim[pid].indexOf(eid);
    if(i >= 0){ st.rim[pid].splice(i,1); return; }
  }
  for(const bid in st.bondE){
    const i = st.bondE[bid].indexOf(eid);
    if(i >= 0){ st.bondE[bid].splice(i,1); return; }
  }
}

function applyEvent(st, ev){
  if(ev.type === 'split'){
    const arr = (st.bondE[ev.bond] || []).slice();
    delete st.bondE[ev.bond];
    const half = Math.ceil(arr.length / 2);
    arr.forEach((e,i)=> st.rim[i < half ? ev.pairA : ev.pairB].push(e));
  }
  if(ev.type === 'move'){
    ev.moves.forEach(m=>{ stripElectron(st, m[0]); st.rim[m[1]].push(m[0]); });
  }
  if(ev.type === 'form'){
    st.bondE[ev.bond] = [];
    ev.take.forEach(t=>{ stripElectron(st, t[1]); st.bondE[ev.bond].push(t[1]); });
  }
  if(ev.charges) Object.assign(st.charges, ev.charges);
  if(ev.tags)    Object.assign(st.tags, ev.tags);
  return st;
}

// A split needs to know which particle each half of the shared pair goes to.
// Derive it from the bond definition rather than hand-writing it per event.
function prepare(rx){
  rx.events.forEach(ev=>{
    if(ev.type === 'split'){
      const def = rx.bondDef[ev.bond];
      ev.pairA = def[0]; ev.pairB = def[1];
    }
    // `repel` acts on the whole shell, so let the data say "all" instead of listing ids
    if(ev.repel && ev.repel.all){
      ev.repel.eids = (rx.init.rim[ev.repel.at] || []).slice();
    }
  });
}

function buildSnapshots(rx){
  prepare(rx);
  const snaps = [clone(rx.init)];
  const times = [0];
  let acc = 0;
  rx.events.forEach(ev=>{
    const st = applyEvent(clone(snaps[snaps.length-1]), ev);
    acc += ev.dur;
    snaps.push(st);
    times.push(acc);
  });
  rx._snaps = snaps; rx._times = times; rx.total = acc;

  // Roster + which electrons actually move anywhere in this reaction. Derived by
  // diffing snapshots so the "dim the ones that never change" highlight can never
  // drift out of sync with the choreography.
  const ids = new Set();
  snaps.forEach(s=>{
    for(const pid in s.rim) s.rim[pid].forEach(e=>ids.add(e));
    for(const bid in s.bondE) s.bondE[bid].forEach(e=>ids.add(e));
  });
  rx._ids = [...ids];
  rx._actors = new Set();
  // Owner only -- deliberately NOT the slot index. Slot indices shift whenever a
  // shell gains or loses an electron, so including them would flag every electron
  // on that particle as an actor and the dimming would never show.
  const at = (s, eid)=>{
    for(const pid in s.rim){ if(s.rim[pid].indexOf(eid) >= 0) return 'r'+pid; }
    for(const bid in s.bondE){ if(s.bondE[bid].indexOf(eid) >= 0) return 'b'+bid; }
    return '?';
  };
  rx._ids.forEach(eid=>{
    for(let k=0;k+1<snaps.length;k++){
      if(at(snaps[k],eid) !== at(snaps[k+1],eid)){ rx._actors.add(eid); break; }
    }
  });
}

/* ============================================================
   POSITIONS
   ============================================================ */
function rimPos(rx, pid, i, n){
  const p = rx.particles[pid];
  const a = -Math.PI/2 + i * (Math.PI*2/n);
  return { x: p.x + Math.cos(a)*R, y: p.y + Math.sin(a)*R };
}

function bondPos(rx, bid, i, n){
  const def = rx.bondDef[bid];
  const A = rx.particles[def[0]], B = rx.particles[def[1]];
  const mx = (A.x+B.x)/2, my = (A.y+B.y)/2;
  let ux = B.x-A.x, uy = B.y-A.y;
  const L2 = Math.hypot(ux,uy) || 1; ux/=L2; uy/=L2;
  const vx = -uy, vy = ux;
  if(n <= 2){
    const s = i === 0 ? -1 : 1;
    return { x: mx + vx*ER*1.15*s, y: my + vy*ER*1.15*s };
  }
  // double bond: two pairs, one pair each side along the bond axis
  const along = (i < 2 ? -1 : 1) * ER*1.38;
  const perp  = (i % 2 === 0 ? -1 : 1) * ER*1.15;
  return { x: mx + ux*along + vx*perp, y: my + uy*along + vy*perp };
}

function findPos(rx, st, eid){
  for(const pid in st.rim){
    const arr = st.rim[pid], i = arr.indexOf(eid);
    if(i >= 0) return rimPos(rx, pid, i, arr.length);
  }
  for(const bid in st.bondE){
    const arr = st.bondE[bid], i = arr.indexOf(eid);
    if(i >= 0) return bondPos(rx, bid, i, arr.length);
  }
  return null;
}

/* Quadratic-bezier flight path. Straight lines read as "teleporting" when many
   electrons move at once; a bow makes the direction of travel obvious.
   bowSign lets a caller bow the same path the other way, which is how the no-reaction
   tabs keep the dashed route clear of the force arrows instead of knotting them together. */
function flight(a, b, p, bowSign){
  const e = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
  const dx = b.x-a.x, dy = b.y-a.y;
  const L2 = Math.hypot(dx,dy);
  if(L2 < 1.5) return { x:b.x, y:b.y };
  const nx = -dy/L2, ny = dx/L2;
  const bow = Math.min(L2*0.20, 62) * (bowSign === undefined ? 1 : bowSign);
  const cx = (a.x+b.x)/2 + nx*bow, cy = (a.y+b.y)/2 + ny*bow;
  const q = (1-e)*(1-e);
  return { x: q*a.x + 2*(1-e)*e*cx + e*e*b.x,
           y: q*a.y + 2*(1-e)*e*cy + e*e*b.y };
}

/* ============================================================
   FAILED-TRANSFER VISUALS  (the Au / Ar no-reaction tabs)

   Oxygen's demand is real, so the animation has to show a genuine tug -- and then show it
   FAILING. Three pieces, none of which is a text label:

     tugEnv(p)  out-and-back envelope: the electron strains toward the oxygen and springs
                back, repeatedly, decaying to zero. Ownership never changes.
     drawRoute  the whole flight path drawn as a dashed "route not taken"; only the fraction
                the electron actually reaches is overdrawn solid. The unused remainder IS
                the argument.
     drawPull   force arrows along the direction the electron would travel. Neutral ink,
                because they are force, not matter.
   ============================================================ */
function tugEnv(p){
  // |sin| so it never overshoots toward the target; (1-p) so it has settled by the end
  return Math.abs(Math.sin(p*Math.PI*2.6)) * (1-p) * 1.25;
}

/* The closed-shell ripple: a band that travels round the 8 electrons and dies. The
   sin(pi*p) window is not decoration -- it forces the wave to ZERO at both ends, so the
   last frame of the event is bit-identical to the static figure. Without it the wave was
   still 2.3 px out when the event ended and every electron jumped on the next event. */
function repelWave(p, idx){
  const band = Math.exp(-Math.pow(p*9.5 - 0.6 - idx, 2)/1.1);
  return band * Math.sin(Math.PI*p);
}

/* How far the force arrows have reached out. Deliberately NOT zero-based: the arrows must
   look IDENTICAL at p=0 and p=1 so the two consecutive strain events join without a pop.
   A zero-based envelope (|sin(pi p)|) left the arrows at full reach when the event ended and
   they vanished on the next frame. */
function pullReach(p){
  return 0.55 + 0.45*Math.abs(Math.sin(p*Math.PI*2));
}

/* the point on pid's rim that faces (x,y) */
function rimFacing(rx, pid, x, y){
  const p = rx.particles[pid];
  const dx = x-p.x, dy = y-p.y, L = Math.hypot(dx,dy) || 1;
  return { x: p.x + dx/L*R, y: p.y + dy/L*R };
}

function pathThrough(a, b, q, bowSign){
  const n = Math.max(2, Math.round(26*q));
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const pt = flight(a, b, q*i/n, bowSign);
    i ? ctx.lineTo(pt.x,pt.y) : ctx.moveTo(pt.x,pt.y);
  }
}

function drawRoute(a, b, travelled, color, bowSign){
  ctx.save();
  ctx.lineCap = 'round';
  ctx.setLineDash([9,10]);
  ctx.strokeStyle = COL.ghostPath; ctx.lineWidth = 3.2;
  pathThrough(a, b, 1, bowSign); ctx.stroke();
  ctx.setLineDash([]);
  if(travelled > 0.012){
    ctx.strokeStyle = color; ctx.lineWidth = 5;
    pathThrough(a, b, travelled, bowSign); ctx.stroke();
  }
  ctx.restore();
}

/* Arrows from the atom towards the oxygen -- the direction the electron would travel. */
function drawPull(rx, fromPid, toPid, reach){
  const A = rx.particles[fromPid], B = rx.particles[toPid];
  let ux = B.x-A.x, uy = B.y-A.y;
  const L = Math.hypot(ux,uy) || 1; ux/=L; uy/=L;
  const vx = -uy, vy = ux;
  ctx.save();
  ctx.strokeStyle = COL.force;
  ctx.lineWidth = 4.5; ctx.lineCap='round'; ctx.lineJoin='round';
  [-1,1].forEach(k=>{
    const off = k*R*0.42;
    const sx = A.x + ux*(R*1.16) + vx*off;
    const sy = A.y + uy*(R*1.16) + vy*off;
    const span = (L - R*1.16 - R*1.12) * reach;
    if(span < 18) return;
    const ex = sx + ux*span - vx*off*0.55;
    const ey = sy + uy*span - vy*off*0.55;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
    const h = 15;
    ctx.beginPath();
    ctx.moveTo(ex,ey); ctx.lineTo(ex - ux*h + vx*h*0.55, ey - uy*h + vy*h*0.55);
    ctx.moveTo(ex,ey); ctx.lineTo(ex - ux*h - vx*h*0.55, ey - uy*h - vy*h*0.55);
    ctx.stroke();
  });
  ctx.restore();
}

/* ============================================================
   SCENE LOOKUP AT TIME t
   ============================================================ */
function sceneAt(rx, t){
  const T = rx._times;
  let k = 0;
  while(k+1 < T.length && t > T[k+1]) k++;
  if(k+1 >= T.length) k = T.length-2;
  const span = Math.max(1e-6, T[k+1]-T[k]);
  const p = clamp((t-T[k])/span, 0, 1);
  return { k, p, cap: rx.events[k].cap, elapsed: t-T[k] };
}

function electronXY(rx, k, p, eid, pp){
  const a = findPos(rx, rx._snaps[k], eid);
  const b = findPos(rx, rx._snaps[k+1], eid);
  if(!a && !b) return null;
  if(!a) return { x:b.x, y:b.y };
  if(!b) return { x:a.x, y:a.y };
  const q = (pp === undefined ? p : pp);
  return flight(a, b, q);
}

/* ============================================================
   DRAWING
   ============================================================ */
function drawElectron(x, y, alpha, opts){
  const o = opts || {};
  const r = o.r || ER;
  if(o.trail){
    for(let i=1;i<=3;i++){
      const g = o.trail(i);
      if(!g) continue;
      ctx.globalAlpha = alpha * (0.30 - i*0.08);
      ctx.fillStyle = COL.glow;
      ctx.beginPath(); ctx.arc(g.x, g.y, r*(1-i*0.10), 0, 7); ctx.fill();
    }
  }
  if(o.glow){
    ctx.globalAlpha = alpha*0.55;
    const gg = ctx.createRadialGradient(x,y,r*0.6,x,y,r*3.1);
    gg.addColorStop(0,'rgba(239,159,39,.85)');
    gg.addColorStop(1,'rgba(239,159,39,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x,y,r*3.1,0,7); ctx.fill();
  }
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(x,y,r,0,7);
  ctx.fillStyle = o.shared ? '#E9E9E9' : '#FFFFFF';
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(55,55,55,.42)';
  ctx.stroke();
  if(o.label !== false){
    const fs = Math.round(r*0.98);
    ctx.font = '900 '+fs+'px MB, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = 'rgba(40,40,40,.92)';
    ctx.fillText('e\u207B', x, y+r*0.06);
  }
  ctx.globalAlpha = 1;
}

function drawBond(rx, bid, st){
  const n = (st.bondE[bid]||[]).length;
  if(!n) return;
  const def = rx.bondDef[bid];
  const A = rx.particles[def[0]], B = rx.particles[def[1]];
  const lines = n >= 4 ? 2 : 1;
  const off = n >= 4 ? 11 : 0;
  let ux = B.x-A.x, uy = B.y-A.y;
  const L2 = Math.hypot(ux,uy)||1; ux/=L2; uy/=L2;
  const vx = -uy, vy = ux;
  ctx.save();
  ctx.strokeStyle = COL.bond; ctx.lineWidth = 7; ctx.lineCap='round';
  for(let i=0;i<lines;i++){
    const s = lines===1 ? 0 : (i===0 ? -1 : 1) * off;
    ctx.beginPath();
    ctx.moveTo(A.x + ux*(R*0.30) + vx*s, A.y + uy*(R*0.30) + vy*s);
    ctx.lineTo(B.x - ux*(R*0.30) + vx*s, B.y - uy*(R*0.30) + vy*s);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticle(rx, pid, st, chAlpha){
  const p = rx.particles[pid];
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7);
  ctx.fillStyle = p.color; ctx.fill();

  const ch = st.charges[pid] || '';
  const gly = glyphSize(p.el);
  ctx.font = '900 '+gly+'px MB, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#fff';
  const gx = p.x - (ch ? R*0.10 : 0);
  ctx.fillText(p.el, gx, p.y + R*0.04);

  if(ch && chAlpha > 0.01){
    ctx.globalAlpha = chAlpha;
    const cs = Math.round(R*0.44);
    ctx.font = '900 '+cs+'px MB, sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle = darken(p.color, 0.52);
    ctx.fillText(ch, p.x + R*0.16, p.y - R*0.34);
    ctx.globalAlpha = 1;
  }

}

/* --- the OIL RIG end card: dark backdrop, stacked mnemonic, oil derrick --- */
function drawDerrick(x, y, h, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = 3.4; ctx.lineJoin='round';
  const w = h*0.34;
  // legs
  ctx.beginPath();
  ctx.moveTo(x-w, y); ctx.lineTo(x-w*0.12, y-h);
  ctx.lineTo(x+w*0.12, y-h); ctx.lineTo(x+w, y);
  ctx.stroke();
  // cross bracing
  for(let i=1;i<=4;i++){
    const t0 = i/5, t1 = (i+1)/5;
    const w0 = w*(1-t0), w1 = w*(1-t1);
    const y0 = y - h*t0, y1 = y - h*t1;
    ctx.beginPath();
    ctx.moveTo(x-w0, y0); ctx.lineTo(x+w1, y1);
    ctx.moveTo(x+w0, y0); ctx.lineTo(x-w1, y1);
    ctx.stroke();
  }
  // crown + beam
  ctx.beginPath(); ctx.moveTo(x-6, y-h); ctx.lineTo(x+6, y-h); ctx.stroke();
  ctx.restore();
  // walking beam silhouette
  ctx.save();
  ctx.fillStyle = color;
  ctx.translate(x, y-h);
  ctx.beginPath();
  ctx.moveTo(-h*0.30, 2); ctx.lineTo(h*0.26, -6);
  ctx.lineTo(h*0.26, 2);  ctx.lineTo(-h*0.30, 10);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(h*0.30, -2, 9, 0, 7); ctx.fill();
  ctx.restore();
}

function drawOilRig(t){
  ctx.fillStyle = COL.dark;
  ctx.fillRect(0,0,W,H);
  const appear = smoothstep(0, 0.5, t);

  const rows = [
    ['O','xidation'], ['I','s'], ['L','oss'],
    ['R','eduction'], ['I','s'], ['G','ain']
  ];
  const colX = [W*0.33, W*0.66];
  const startY = 168, gapY = 78;
  ctx.globalAlpha = appear;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  rows.forEach((row,i)=>{
    const col = i < 3 ? 0 : 1;
    const line = i % 3;
    const x = colX[col], y = startY + line*gapY;
    ctx.font = '900 46px MB, sans-serif';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(row[0], x, y);
    const leadW = ctx.measureText(row[0]).width;
    ctx.font = '900 34px MB, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.fillText(row[1], x + leadW + 7, y + 2);
  });
  drawDerrick(W*0.83, H-92, 150, 'rgba(255,255,255,.30)');
  ctx.globalAlpha = 1;

  const a2 = smoothstep(0.35, 1.0, t);
  ctx.globalAlpha = a2;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = '900 20px MB, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.66)';
  ctx.fillText('click to go back', W/2, H-52);
  ctx.globalAlpha = 1;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
let cur = 0;                 // reaction index
let t = 0;                   // time cursor inside the reaction, seconds
let playing = false;
let oilRig = false;
let oilT = 0;
let pausedDone = false;      // reached the end, waiting

// True when this particle has an active bond whose partner sits BELOW it, i.e.
// the bond line and its shared electrons occupy the space the tag would use.
function bondLeavesDownward(rx, st, pid){
  for(const bid in st.bondE){
    if(!st.bondE[bid] || !st.bondE[bid].length) continue;
    const def = rx.bondDef[bid];
    const other = def[0] === pid ? def[1] : (def[1] === pid ? def[0] : null);
    if(other && rx.particles[other].y > rx.particles[pid].y) return true;
  }
  return false;
}

function draw(){
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0,0,W,H);

  if(oilRig){ drawOilRig(oilT); return; }

  const rx = REACTIONS[cur];
  const sc = sceneAt(rx, t);
  const stA = rx._snaps[sc.k], stB = rx._snaps[sc.k+1];

  const EV = rx.events[sc.k];
  const strainCfg = EV.strain || null;
  const repelCfg  = EV.repel  || null;
  /* When a reaction transfers nothing anywhere there are no actors to contrast against, so
     the "dim everything that never moves" treatment would just wash the whole scene out. */
  const noActors = rx._actors.size === 0;

  // captions first (behind everything), then bonds, then particles, then electrons
  const capA = smoothstep(0, 0.28, sc.elapsed);
  ctx.globalAlpha = capA;
  const cs = fitFont(sc.cap, W-140, 28, '900');
  ctx.font = '900 '+cs+'px MB, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = COL.ink;
  ctx.fillText(sc.cap, W/2, H-20);
  ctx.globalAlpha = 1;

  for(const bid in rx.bondDef) drawBond(rx, bid, sc.p < 0.5 ? stA : stB);

  /* The failed-tug layer sits BEHIND the particles, so the strained electron ends up drawn
     on top of its own force arrow -- which is exactly how it should read.
     bowSign -1 arcs the route clear of the straight force arrows; at +1 the two knotted
     together into an unreadable cluster in the middle of the gap. */
  if(strainCfg){
    const home = findPos(rx, stA, strainCfg.eids[0]);
    const tip  = rimFacing(rx, strainCfg.toward, home.x, home.y);
    drawRoute(home, tip, strainCfg.amp * tugEnv(sc.p), rx.particles[strainCfg.at].color, -1);
  }
  if(repelCfg){
    const home = findPos(rx, stA, repelCfg.eids[0]);
    const tip  = rimFacing(rx, repelCfg.toward, home.x, home.y);
    // travelled = 0 for the whole animation: the route never stops being dashed
    drawRoute(home, tip, 0, COL.ink, -1);
  }
  if(strainCfg || repelCfg){
    const cfg = strainCfg || repelCfg;
    drawPull(rx, cfg.at, cfg.toward, pullReach(sc.p));
  }

  // charges fade as the electron lands, so the label and the arrival are one beat
  const charged = {};
  for(const pid in rx.particles){
    const a = stA.charges[pid] || '', b = stB.charges[pid] || '';
    let al = 1;
    if(a !== b){
      al = b ? smoothstep(0.55, 1.0, sc.p) : 1 - smoothstep(0, 0.42, sc.p);
    }
    charged[pid] = al;
  }
  const tagAlpha = smoothstep(0.5, 1.0, sc.p);

  ctx.globalAlpha = 1;
  for(const pid in rx.particles) drawParticle(rx, pid, stB, charged[pid]);
  // Tags. A tag that already exists in the PREVIOUS snapshot (K+ is a spectator
  // from the very first frame) has to render at full opacity -- requiring it to
  // be newly added is what made the spectator-ion label invisible.
  for(const pid in rx.particles){
    const tg = stB.tags[pid];
    if(!tg) continue;
    const al = stA.tags[pid] ? 1 : tagAlpha;
    if(al < 0.01) continue;
    const p = rx.particles[pid];
    const ts = fitFont(tg, R*2.0, Math.round(R*0.30), '900');
    ctx.font = '900 '+ts+'px MB, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    const tw = ctx.measureText(tg).width;
    /* A tag hanging under a particle that has a bond leaving it downward would land on that
       bond's shared electrons, so shift it clear of the bond axis. The clearance must be
       derived from the TAG WIDTH: the shared electrons only reach ER*2.15 either side of the
       axis, but the tag is centred, so half of it still hangs back in. The old fixed R*1.05
       happened to work for the 7-character "reduced" and silently failed for "not reduced",
       whose first letter was painted straight over the electrons. */
    let tx = p.x;
    if(bondLeavesDownward(rx, stB, pid)) tx = p.x + (p.x < W/2 ? -1 : 1) * (ER*2.15 + 18 + tw/2);
    tx = clamp(tx, 24 + tw/2, W - 24 - tw/2);
    ctx.globalAlpha = al;
    ctx.fillStyle = COL.ink;
    ctx.fillText(tg, tx, p.y + R + 12);
    ctx.globalAlpha = 1;
  }

  // electrons
  rx._ids.forEach(eid=>{
    const isActor = rx._actors.has(eid);
    /* noActors: nothing anywhere moves, so there is nothing to dim against */
    const emph = isActor || noActors;
    const pos = electronXY(rx, sc.k, sc.p, eid);
    if(!pos) return;

    /* A strained electron is emphatically NOT an actor -- the whole point is that it never
       leaves -- so it needs its own position and its own emphasis. */
    let x = pos.x, y = pos.y, strained = false;
    if(strainCfg && strainCfg.eids.indexOf(eid) >= 0){
      const home = findPos(rx, stA, eid);
      const tip  = rimFacing(rx, strainCfg.toward, home.x, home.y);
      const pt = flight(home, tip, strainCfg.amp * tugEnv(sc.p), -1);
      x = pt.x; y = pt.y; strained = true;
    }
    if(repelCfg && repelCfg.eids.indexOf(eid) >= 0){
      const home = findPos(rx, stA, eid);
      const c0 = rx.particles[repelCfg.at];
      const idx = (stB.rim[repelCfg.at] || []).indexOf(eid);
      /* A wave travelling ROUND the ring rather than outward: a closed shell can absorb the
         tug, but the disturbance has nowhere to go except around and back into itself. */
      const w = repelWave(sc.p, idx);
      const nx = (home.x - c0.x)/R, ny = (home.y - c0.y)/R;
      x = home.x + nx*R*repelCfg.amp*w;
      y = home.y + ny*R*repelCfg.amp*w;
      /* Only the CREST of the wave lights up. Glowing all eight said "the whole shell is
         reacting", which is the exact opposite of what this tab has to say. */
      if(w > 0.15) strained = true;
    }

    const a2 = findPos(rx, stA, eid), b2 = findPos(rx, stB, eid);
    const moving = a2 && b2 && (Math.abs(a2.x-b2.x) > 1.5 || Math.abs(a2.y-b2.y) > 1.5);
    const inBond = (()=>{ for(const bid in stB.bondE) if(stB.bondE[bid].indexOf(eid)>=0) return true; return false; })();

    if(strained){
      drawElectron(x, y, 1, { shared:false, glow:true, label:true });
    } else if(moving && isActor){
      drawElectron(pos.x, pos.y, 1, {
        shared:false, glow:true,
        trail:(i)=> electronXY(rx, sc.k, sc.p, eid, clamp(sc.p - i*0.055, 0, 1))
      });
    } else {
      drawElectron(x, y, emph ? 1 : 0.38, {
        shared: inBond, glow:false, label: emph
      });
    }
  });

  // progress hairline -- unobtrusive, tells the teacher how far the beat goes
  const pgX = 44, pgW = W - 88, pgY = 15;
  ctx.fillStyle = 'rgba(47,47,47,.13)';
  ctx.beginPath(); ctx.roundRect(pgX, pgY, pgW, 4, 2); ctx.fill();
  ctx.fillStyle = 'rgba(47,47,47,.40)';
  ctx.beginPath();
  ctx.roundRect(pgX, pgY, Math.max(4, pgW * clamp(t / rx.total, 0, 1)), 4, 2);
  ctx.fill();
}

/* ============================================================
   TRANSPORT + UI
   ============================================================ */
function eventsCount(rx){ return rx.events.length; }

function stepOnce(){
  const rx = REACTIONS[cur];
  if(t >= rx.total) { t = rx.total; return; }
  // advance to the end of the next event boundary
  let k = 0;
  while(k+1 < rx._times.length && t >= rx._times[k+1] - 1e-4) k++;
  t = rx._times[k+1];
  if(t >= rx.total - 1e-6) onComplete();
}

function onComplete(){
  playing = false;
  /* The OIL RIG mnemonic is the closing card of the whole deck, so fire it on the LAST
     reaction instead of hard-coding a key -- `key === 'kbr'` only worked while KBr happened
     to be the last tab, and it now sits in the middle. */
  if(cur === REACTIONS.length - 1){ oilRig = true; oilT = 0; }
  syncBtns();
}

function replay(){
  oilRig = false; oilT = 0;
  t = 0; playing = true; syncBtns();
}

function syncBtns(){
  document.getElementById('play').textContent = playing ? 'Pause' : 'Play';
  syncEq();
}

/* The OIL RIG card closes the whole deck, but it is painted over whichever reaction you were
   last on -- and that reaction is now Ar + O2, whose equation reads "no reaction". A mnemonic
   about electron transfer sitting above a line saying nothing transfers contradicts itself, so
   hide the equation while the card is up. visibility, not display: the layout must not jump. */
function syncEq(){
  document.getElementById('eq').style.visibility = oilRig ? 'hidden' : 'visible';
}

function selectReaction(i){
  cur = i; t = 0; oilRig = false; oilT = 0; playing = true;
  document.getElementById('eq').textContent = REACTIONS[i].eq;
  [...document.querySelectorAll('.tab')].forEach((b,j)=>
    b.setAttribute('aria-selected', j === i ? 'true' : 'false'));
  syncBtns();
}

function boot(){
  const tabs = document.getElementById('tabs');
  REACTIONS.forEach((rx,i)=>{
    const b = document.createElement('button');
    b.className = 'tab'; b.textContent = rx.tab;
    b.setAttribute('aria-selected','false');
    b.onclick = ()=> selectReaction(i);
    tabs.appendChild(b);
  });
  REACTIONS.forEach(buildSnapshots);

  document.getElementById('play').onclick = ()=>{
    if(oilRig){ oilRig = false; oilT = 0; t = 0; playing = true; syncBtns(); return; }
    if(t >= REACTIONS[cur].total) t = 0;
    playing = !playing; syncBtns();
  };
  document.getElementById('step').onclick = ()=>{
    if(oilRig) return;
    playing = false; stepOnce(); syncBtns();
  };
  document.getElementById('replay').onclick = ()=>{
    if(oilRig){ oilRig = false; oilT = 0; }
    replay();
  };
  cv.onclick = ()=>{ if(oilRig){ oilRig = false; syncEq(); } };

  window.addEventListener('keydown', e=>{
    if(e.code === 'Space'){ e.preventDefault(); document.getElementById('play').click(); }
    else if(e.code === 'ArrowRight'){ e.preventDefault(); document.getElementById('step').click(); }
    else if(e.key === 'r' || e.key === 'R'){ document.getElementById('replay').click(); }
  });

  selectReaction(0);
  fit();
  window.addEventListener('resize', fit);
  requestAnimationFrame(loop);
}

let last = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000 || 0);
  last = now;
  if(oilRig){
    if(oilT < 1.2) oilT += dt;
  } else if(playing){
    const rx = REACTIONS[cur];
    t += dt;
    if(t >= rx.total){ t = rx.total; onComplete(); }
  }
  draw();
  requestAnimationFrame(loop);
}

if(document.fonts && document.fonts.load){
  Promise.all([document.fonts.load('900 100px MB'), document.fonts.ready])
    .then(boot).catch(boot);
} else {
  boot();
}
</script>

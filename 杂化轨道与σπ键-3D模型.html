const stepByN=n=>STEPS.find(s=>s.n===n);
const curStep=()=>stepByN(state.step);

/* =================== molecular geometry used by every bonding step ===========
   Bond lengths are in the same arbitrary units as the lobe semi-axes, chosen so
   a C-H bond just reaches the tip of an sp3 lobe and the H cloud overlaps it. */
const BL_CH=0.98;             // C-H bond length
const BL_CC=1.30;             // C=C / C-C bond length
const SP3_H=TET.map(d=>V.add(d, [0,0,0]).map(v=>v));   // four sp3 directions

/* The sigma-bond region between two atoms: a lens centred at the midpoint,
   elongated along the bond. `n` gives the plane the lens is flattened in. */
function sigmaLens(a,b,w,col,opt){
  const mid=V.mul(V.add(a,b),0.5);
  const ax=V.sub(b,a);
  const up=Math.abs(V.norm(ax)[1])<0.9?[0,1,0]:[1,0,0];
  const n=V.norm(V.cross(ax,up));
  return lens(mid,ax,n,V.len(ax)*0.52,w,col,opt);
}
/* A curved arrow arcing along `dir` from `from`, bulging by `bulge` along `n`.
   Used for the pi electron density sitting above and below the bond axis. */
function arcArrow(from,dir,n,len,bulge,col){
  const pts=[];
  for(let i=0;i<=8;i++){
    const t=i/8;
    const p=V.add(from,V.mul(dir,t*len));
    const b=Math.sin(Math.PI*t)*bulge;
    pts.push(V.add(p,V.mul(n,b)));
  }
  return curl(pts,col);
}

/* =================== drawing: scene furniture =================== */
function drawAxes(R,scale,cx,cy,faint){
  const L=1.34, alpha=faint?0.38:0.54;
  [[[L,0,0],'x'],[[0,L,0],'y'],[[0,0,L],'z']].forEach((ax,i)=>{
    const a=applyR(R,V.mul(ax[0],-1)), b=applyR(R,ax[0]);
    ctx.save();
    ctx.globalAlpha=alpha; ctx.strokeStyle='#94A3B8'; ctx.lineWidth=1.2; ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(cx+a[0]*scale,cy-a[1]*scale);
    ctx.lineTo(cx+b[0]*scale,cy-b[1]*scale);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha=0.9; ctx.fillStyle='#7C8B99';
    ctx.font='700 12px Inter,Segoe UI,sans-serif';
    const p=applyR(R,V.mul(ax[0],L*1.07));
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ax[1],cx+p[0]*scale,cy-p[1]*scale);
    ctx.restore();
  });
  const o=applyR(R,[0,0,0]);
  ctx.save();
  ctx.fillStyle='rgba(30,41,59,.55)';
  ctx.beginPath(); ctx.arc(cx+o[0]*scale,cy-o[1]*scale,2.1,0,7); ctx.fill();
  ctx.restore();
}

/* ---------- drawing: screen-space energy-level inset ---------- */
function drawLevelPanel(o,cx,cy,fade){
  fade=(fade==null?1:fade)*o.alpha;
  if(fade<=0.012) return;
  const X=o.x*CW, Y=o.y*CH;
  const rowH=o.rowH||52, spanW=o.spanW||32, gap=(o.gap==null?7:o.gap);
  const rows=o.rows;

  /* Panel width follows the widest row so a 4-bar row and a 1-bar row are both
     centred in the same card; a fixed width would left-align the short rows. */
  let maxW=0;
  rows.forEach(r=>{ maxW=Math.max(maxW, r.spans.length*spanW+(r.spans.length-1)*gap); });
  /* TWO separate gutters, and this is not cosmetic. The tag sits on the LEFT
     (it names the level, so it belongs beside the bars) and the transition
     arrows get a channel of their own on the RIGHT. An earlier version right-
     aligned the tags at the far edge, which put them in exactly the same strip
     as the transition arrows and collided on every transition frame. */
  const padX=13, padY=12, head=16, gutterL=52, gutterR=22;
  const boxW=Math.max(maxW, 104)+padX*2+gutterL+gutterR;
  const boxH=rowH*(rows.length-1)+padY*2+head+22;
  const rr=10;
  const barsX=X+padX+gutterL;              // left edge of the bar column

  ctx.save();
  ctx.globalAlpha=fade;
  ctx.beginPath();
  ctx.moveTo(X+rr,Y);
  ctx.lineTo(X+boxW-rr,Y); ctx.quadraticCurveTo(X+boxW,Y,X+boxW,Y+rr);
  ctx.lineTo(X+boxW,Y+boxH-rr); ctx.quadraticCurveTo(X+boxW,Y+boxH,X+boxW-rr,Y+boxH);
  ctx.lineTo(X+rr,Y+boxH); ctx.quadraticCurveTo(X,Y+boxH,X,Y+boxH-rr);
  ctx.lineTo(X,Y+rr); ctx.quadraticCurveTo(X,Y,X+rr,Y);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,.82)'; ctx.fill();
  ctx.strokeStyle='rgba(150,170,188,.50)'; ctx.lineWidth=1; ctx.stroke();

  ctx.font='700 10px Inter,Segoe UI,sans-serif';
  ctx.fillStyle='#8496A4'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(o.caption||'ENERGY',X+padX,Y+head*0.8);

  /* Row count drives the bar height: a one-bar row is centred on the row axis
     and gets only ONE label underneath (in the earlier layout the tag sat
     beside it and the span label underneath, which read as two names for the
     same orbital). The bar height is 62% of the row so a lone bar looks like a
     level line and not like a bullet point lost in white space. */
  const barH=n=>Math.min(n*spanW+(n-1)*gap, spanW*2.6);

  /* the level bars */
  rows.forEach((r,ri)=>{
    const ry=Y+head+padY+ri*rowH;
    const n=r.spans.length;
    const total=n*spanW+(n-1)*gap;
    const bh=barH(n);
    let bx=barsX+(maxW-total)/2;
    r.spans.forEach(sp=>{
      const a=(sp.alpha==null?1:sp.alpha)*fade;
      const col=sp.col||'#5B7684';
      if(a>0.012){
        ctx.globalAlpha=a;
        ctx.strokeStyle=col; ctx.lineWidth=3.0; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(bx,ry); ctx.lineTo(bx+bh,ry); ctx.stroke();
        /* electrons as up/down half-arrows ON the bar - the standard orbital
           notation, so the count is readable at a glance */
        if(sp.e){
          const ew=4.6, eh=7.0;
          for(let k=0;k<sp.e;k++){
            const ex=bx+bh*(k+1)/(sp.e+1);
            const up=(k%2===0);
            const ty=ry-(up?eh:-eh);
            ctx.strokeStyle=col; ctx.lineWidth=1.8;
            ctx.beginPath(); ctx.moveTo(ex,ry); ctx.lineTo(ex,ty); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ex,ty);
            ctx.lineTo(ex-ew*0.5, ty+(up? eh*0.42 : -eh*0.42));
            ctx.lineTo(ex+ew*0.5, ty+(up? eh*0.42 : -eh*0.42));
            ctx.closePath(); ctx.fillStyle=col; ctx.fill();
          }
          ctx.globalAlpha=a;
        }
      }
      /* Only one span in a row carries a label, and it is centred under the
         BAR COLUMN rather than under its own bar, so it reads as the name of
         the whole row. */
      if(n===1 && sp.label){
        ctx.globalAlpha=fade;
        ctx.font='700 10.5px Inter,Segoe UI,sans-serif';
        ctx.fillStyle=sp.labCol||'#5B7684';
        ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillText(sp.label,bx+bh/2,ry+8);
      }
      bx+=spanW+gap;
    });
    if(r.tag){
      ctx.globalAlpha=fade;
      ctx.font='700 10.5px Inter,Segoe UI,sans-serif';
      ctx.fillStyle=r.tagCol||'#A2B1BC';
      /* right-aligned to the inner edge of the LEFT gutter, so every tag ends
         the same distance from the bars whatever its length */
      ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillText(r.tag,X+padX+gutterL-8,ry);
    }
  });

  /* transition arrows, drawn last so they ride over the bars */
  o.arrows.forEach(ar=>{
    const a=(ar.alpha==null?1:ar.alpha)*fade;
    if(a<=0.012) return;
    const y1=Y+head+padY+ar.from*rowH, y2=Y+head+padY+ar.to*rowH;
    const ax=X+boxW-padX-7;
    const col=ar.col||'#93A8B6';
    ctx.globalAlpha=a;
    ctx.strokeStyle=col; ctx.lineWidth=1.4;
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(ax,y1); ctx.lineTo(ax,y2); ctx.stroke();
    ctx.setLineDash([]);
    const d=(y2>y1)?1:-1;
    ctx.beginPath();
    ctx.moveTo(ax,y2);
    ctx.lineTo(ax-3.4,y2-d*5); ctx.lineTo(ax+3.4,y2-d*5);
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  });
  ctx.restore();
}

function drawDashBand(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const u=o.dir;
  const t=Math.abs(u[0])<0.9?[1,0,0]:[0,1,0];
  const pu=V.norm(V.cross(u,t));
  const len=Math.hypot(0.90,0.44);
  ctx.save();
  ctx.globalAlpha=fade*0.95;
  ctx.strokeStyle=COL.dash; ctx.lineWidth=1.5; ctx.lineCap='round';
  for(let i=0;i<o.n;i++){
    const s=(i/(o.n-1)-0.5)*len;
    const p0=V.add(o.at,V.mul(u,(s-0.5)*o.len));
    const p1=V.add(o.at,V.mul(u,(s+0.5)*o.len));
    const a=applyR(R,p0), b=applyR(R,p1);
    ctx.beginPath();
    ctx.moveTo(cx+a[0]*scale,cy-a[1]*scale);
    ctx.lineTo(cx+b[0]*scale,cy-b[1]*scale);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---- clay teardrop: tip at x=-1 (nucleus side), round end at x=+1 ---- */
function teardropPath(){
  ctx.beginPath();
  ctx.moveTo(-1,0);
  ctx.bezierCurveTo(-0.62,-0.60, 0.26,-1.00, 0.83,-0.52);
  ctx.bezierCurveTo( 1.05,-0.28, 1.05, 0.28, 0.83, 0.52);
  ctx.bezierCurveTo( 0.26, 1.00,-0.62, 0.60,-1, 0);
  ctx.closePath();
}
function drawLobe(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const v=applyR(R,o.c);
  const e=ellipseParams(o.c,o.axis,o.a,o.b,R);
  // Keep the eigen-decomposition's own (algebraically larger, smaller) pairing:
  // `ang` is the rotation of the FIRST axis, so swapping A and B without
  // rotating by 90 degrees draws the ellipse sideways.
  const A=e.A*scale, B=e.B*scale;
  if(A<0.6) return;
  const px=cx+v[0]*scale, py=cy-v[1]*scale;

  // --- probability-cloud style, used for the s orbital ---
  if(o.soft){
    const Rr=Math.max(A,B)*1.04;
    ctx.save(); ctx.translate(px,py); ctx.globalAlpha=fade;
    // Denser than a bare wash: an s orbital drawn too faintly disappears into
    // the white stage and the class cannot see the spherical shape at all.
    const g=ctx.createRadialGradient(0,0,0,0,0,Rr);
    g.addColorStop(0,   hex2rgba(o.col,1.00));
    g.addColorStop(0.34,hex2rgba(o.col,0.86));
    g.addColorStop(0.62,hex2rgba(o.col,0.58));
    g.addColorStop(0.84,hex2rgba(o.col,0.28));
    g.addColorStop(1,   hex2rgba(o.col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,Rr,0,7); ctx.fill();
    const g2=ctx.createRadialGradient(-Rr*0.30,-Rr*0.32,0,-Rr*0.12,-Rr*0.14,Rr*0.60);
    g2.addColorStop(0,'rgba(255,255,255,.50)');
    g2.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(0,0,Rr,0,7); ctx.fill();
    // a firm outer rim + a dashed shell: the boundary surface that makes the
    // sphere read as a shape rather than a green smudge
    ctx.strokeStyle=hex2rgba(o.col,0.95); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(0,0,Rr*0.985,0,7); ctx.stroke();
    ctx.strokeStyle=hex2rgba(o.col,0.55); ctx.lineWidth=1.2; ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.arc(0,0,Rr*0.72,0,7); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    return v[2];
  }

  // --- clay lobe: three-stop gradient along the projected major axis ---
  ctx.save();
  ctx.translate(px,py); ctx.rotate(e.ang); ctx.scale(A,B);
  const lw=1.6/Math.max(1,Math.min(A,B));
  const g=ctx.createLinearGradient(-1,0,1,0);
  g.addColorStop(0,   shade(o.col,-0.26));
  g.addColorStop(0.30,o.col);
  g.addColorStop(0.68,shade(o.col, 0.20));
  g.addColorStop(1,   shade(o.col,-0.16));
  // A lobe only goes translucent when it has to: either it is holding electron
  // arrows that must stay visible, or its projection has gone fat and it is
  // burying its neighbours. Everything else is painted at full strength, which
  // is what the reference artwork looks like - a previous version veiled every
  // lobe by a flat 0.78 and washed the whole model out to pale cream.
  const holdsElectrons=(o.dotted!==false);
  const veiled=veilFor();
  const veil=(o.veil==null?0.97:o.veil)*veiled*(holdsElectrons?0.92:1);
  ctx.globalAlpha=Math.min(1,veil*o.alpha)*fade;
  ctx.fillStyle=g; teardropPath(); ctx.fill();
  ctx.globalAlpha=Math.min(1,veil*o.alpha+0.06)*fade;
  ctx.strokeStyle='rgba(12,22,32,.30)'; ctx.lineWidth=lw; ctx.stroke();
  // broad soft specular, matched to the reference shading
  ctx.globalAlpha=0.34*veil*fade; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(0.24,-0.36,0.36,0.20,-0.30,0,7); ctx.fill();
  ctx.globalAlpha=0.16*veil*fade;
  ctx.beginPath(); ctx.ellipse(-0.24, 0.42,0.24,0.12, 0.30,0,7); ctx.fill();
  ctx.restore();
  return v[2];
}

/* =================== drawing: electrons as arrows ===================
   Electrons are drawn as ARROW GLYPHS, the way the reference figure does it:
   a slim shaft + a clean solid triangular head, oriented by the orbital axis
   and then painted in SCREEN space. Deliberately 2-D: a heavy 3-D tube reads
   as a dark blob on top of a bright lobe and swallows the chemistry.       */
function drawArrowGlyph(tail,head,R,scale,cx,cy,width,fade,shrink){
  shrink=(shrink==null)?1:shrink;
  const a=applyR(R,tail), b=applyR(R,head);
  let x1=cx+a[0]*scale, y1=cy-a[1]*scale;
  let x2=cx+b[0]*scale, y2=cy-b[1]*scale;
  let dl=Math.hypot(x2-x1,y2-y1);
  if(dl<1.2) return;
  // A lobe aimed at the camera projects to a near-circle and its arrow would
  // otherwise stay full size and look detached. Pull the TIP back toward the
  // tail so the glyph shrinks with its lobe; keep a floor so it never vanishes.
  if(shrink<1){
    const my=(y1+y2)/2;
    x2=x1+(x2-x1)*shrink;
    y2=my+(y2-my)*shrink;
    y1=my-(y2-my);          // keep the shaft centred on the lobe centre
    dl=Math.hypot(x2-x1,y2-y1);
    if(dl<1.2) return;
  }
  const ux=(x2-x1)/dl, uy=(y2-y1)/dl, px=-uy, py=ux;
  const headLen=Math.min(9.5, dl*0.46);
  const headW=Math.max(3.6, width*1.75*Math.max(0.55,shrink));
  const sx=x2-ux*headLen, sy=y2-uy*headLen;      // where the shaft ends

  ctx.save();
  ctx.globalAlpha=fade*0.88;          // soft enough to read as an electron
  ctx.fillStyle=COL.e;
  ctx.strokeStyle=COL.e;
  ctx.lineWidth=Math.max(1,width*Math.max(0.6,shrink)); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(sx,sy); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(sx+px*headW, sy+py*headW);
  ctx.lineTo(sx-px*headW, sy-py*headW);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
// geometry of one electron arrow. A short shaft + solid head that lies INSIDE
// its own lobe, parallel to that lobe's axis (so together the two arrows of a
// p orbital read as the ↑↓ pair). The arrow is scaled by how much its axis is
// foreshortened on screen - an arrow on a lobe pointing straight at the camera
// must shrink with the lobe, otherwise it detaches and "wobbles".
function arrowGeom(o,R){
  // An animated arrow supplies its own direction for this frame; everything
  // downstream (span, foreshortening, screen-space glyph) is unchanged.
  let u=o.dir;                         // unit outward axis of THIS lobe
  if(o.k==='anchor'){
    u=o.fn?o.fn():null;
    if(!u) return null;                // hidden during its handover interval
    u=V.norm(u);
  }
  const at=o.at;                       // the lobe's own centre
  // Short segment centred on the lobe centre, so it can NEVER reach across the
  // nucleus into the opposite lobe. `s` only chooses which end is the tip.
  // `span` is passed in per-lobe: a p lobe (semi-axis 0.50) can host a longer
  // arrow than the slimmer sp3 lobe (0.56 long but only 0.22 across).
  const span=(o.k==='anchor'&&o.spanT!=null)?o.spanT:(o.span==null?0.30:o.span);
  const tail=V.add(at, V.mul(u, o.s>0 ? -span :  span));
  const head=V.add(at, V.mul(u, o.s>0 ?  span : -span));
  // Foreshortening 0..1 from the projected length of the lobe axis.
  //
  // This is the fix for the "p orbitals keep twitching" report: at the default
  // camera the first tetrahedral axis (1,1,1)/sqrt3 projects to a length of
  // 0.001 - it points straight down the view axis. Its lobe collapses to a
  // near-circle while a full-size arrow glyph stayed on top of it, so the
  // arrows visibly slid off their lobes as the model turned. Scaling the glyph
  // by the same factor keeps every electron inside the shape that owns it.
  const pa=applyR(R,tail), pb=applyR(R,head);
  const projLen=Math.hypot(pb[0]-pa[0], pb[1]-pa[1]);
  return {tail,head,width:0.036,foreshorten:clamp(projLen/(2*span),0.14,1)};
}
function drawEArrow(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  // An arrow may carry its own per-frame opacity. Animated steps set it so an
  // electron can fade IN somewhere else rather than snapping into existence;
  // static steps leave it undefined and are unaffected.
  if(o.alpha!=null) fade*=o.alpha;
  if(fade<=0.012) return;
  const g=arrowGeom(o,R);
  if(!g) return;
  drawArrowGlyph(g.tail,g.head,R,scale,cx,cy,g.width*scale,fade,g.foreshorten);
}

/* =================== drawing: nucleus, tags =================== */
function drawNuc(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const v=applyR(R,o.at);
  const x=cx+v[0]*scale, y=cy-v[1]*scale, r=o.r*scale;
  ctx.save();
  ctx.globalAlpha=fade;
  ctx.beginPath(); ctx.arc(x,y,r,0,7);
  const g=ctx.createRadialGradient(x-r*0.35,y-r*0.40,r*0.08,x,y,r*1.02);
  g.addColorStop(0,'#7A8E9B'); g.addColorStop(0.55,COL.nuc); g.addColorStop(1,'#1B2833');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.lineWidth=Math.max(1,r*0.16); ctx.stroke();
  ctx.fillStyle='#1B2833'; ctx.font='800 '+Math.round(r*1.15)+'px Inter,Segoe UI,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(o.sym,x,y+r*0.02);
  ctx.restore();
}

/* ---------- drawing: hydrogen 1s cloud ---------- */
function drawHyd(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const v=applyR(R,o.at);
  const x=cx+v[0]*scale, y=cy-v[1]*scale, r=o.r*scale;
  ctx.save();
  ctx.globalAlpha=fade;
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.05,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,.92)');
  g.addColorStop(0.45,hex2rgba(COL.h,0.85));
  g.addColorStop(0.82,hex2rgba(COL.h,0.42));
  g.addColorStop(1,hex2rgba(COL.h,0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.strokeStyle=hex2rgba(COL.hDeep,0.85); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(x,y,r*0.92,0,7); ctx.stroke();
  // the proton at the centre
  ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(x,y,r*0.17,0,7); ctx.fill();
  ctx.strokeStyle=hex2rgba(COL.hDeep,0.9); ctx.lineWidth=1.1; ctx.stroke();
  // H label
  ctx.fillStyle=COL.hDeep; ctx.font='800 '+Math.round(r*0.72)+'px Inter,Segoe UI,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('H',x,y-r*0.02);
  ctx.restore();
}

/* ---------- drawing: bond stick ---------- */
function drawStick(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const a=applyR(R,o.a), b=applyR(R,o.b);
  const x1=cx+a[0]*scale, y1=cy-a[1]*scale;
  const x2=cx+b[0]*scale, y2=cy-b[1]*scale;
  const w=Math.max(2.2,o.w*scale);
  const col=o.kind==='pi'?COL.pi:COL.sigma;
  ctx.save();
  ctx.globalAlpha=fade;
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(12,22,32,.20)'; ctx.lineWidth=w+2.2;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,shade(col,0.12));
  g.addColorStop(0.5,col);
  g.addColorStop(1,shade(col,-0.10));
  ctx.strokeStyle=g; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}

/* ---------- drawing: overlap lens ---------- */
/* The shaded bonding region where two orbitals meet. Rendered as a rotated,
   squashed ellipse centred on the bond midpoint, elongated along the bond and
   flattened across it. Exact 3-D projection of the disc is overkill here - the
   lens only has to READ as "the orbitals overlap here". */
function drawLens(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const a=(o.alpha==null?0.92:o.alpha)*(o.ghost?1:1);
  const c=applyR(R,o.c);
  const ax=applyR(R,V.add(o.c,V.mul(o.axis,o.L)));
  let dx=ax[0]-c[0], dy=ax[1]-c[1];
  const dl=Math.hypot(dx,dy);
  if(dl<1e-4) return;
  dx/=dl; dy/=dl;
  const A=dl*scale, B=o.w*scale;
  ctx.save();
  ctx.translate(cx+c[0]*scale, cy-c[1]*scale);
  ctx.rotate(Math.atan2(dy,dx));
  ctx.globalAlpha=fade*a;
  ctx.scale(A,B);
  const g=ctx.createRadialGradient(0,0,0.05,0,0,1);
  g.addColorStop(0,hex2rgba(o.col,0.85));
  g.addColorStop(0.55,hex2rgba(o.col,0.62));
  g.addColorStop(1,hex2rgba(o.col,0.10));
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(0,0,1,1,0,0,7); ctx.fill();
  ctx.restore();
  // a crisp outline so the overlap reads as a defined region. A GHOST lens keeps
  // a dashed outline: it marks an overlap that is no longer there at full
  // strength, and a solid border would read as a real bond.
  ctx.save();
  ctx.translate(cx+c[0]*scale, cy-c[1]*scale);
  ctx.rotate(Math.atan2(dy,dx));
  ctx.globalAlpha=fade*a*0.85;
  ctx.strokeStyle=hex2rgba(o.col,0.85);
  ctx.lineWidth=o.ghost?1.1:1.3;
  if(o.ghost) ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.ellipse(0,0,A,B,0,0,7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* ---------- drawing: curved pi arrow ---------- */
function drawCurl(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const pts=o.pts.map(p=>applyR(R,p));
  if(pts.length<2) return;
  ctx.save();
  ctx.globalAlpha=fade;
  ctx.strokeStyle=o.col; ctx.lineWidth=2.0; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(cx+pts[0][0]*scale, cy-pts[0][1]*scale);
  for(let i=1;i<pts.length;i++) ctx.lineTo(cx+pts[i][0]*scale, cy-pts[i][1]*scale);
  ctx.stroke();
  // arrowhead at the end
  const a=pts[pts.length-2], b=pts[pts.length-1];
  let dx=b[0]-a[0], dy=b[1]-a[1];
  const dl=Math.hypot(dx,dy);
  if(dl>1e-5){
    dx/=dl; dy/=dl;
    const hx=cx+b[0]*scale, hy=cy-b[1]*scale;
    const L=8.5, W=4.6;
    const sx=hx-dx*L, sy=hy+dy*L;
    const px=-dy, py=-dx;
    ctx.fillStyle=o.col;
    ctx.beginPath();
    ctx.moveTo(hx,hy);
    ctx.lineTo(sx+px*W, sy+py*W);
    ctx.lineTo(sx-px*W, sy-py*W);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ---------- drawing: crossed-out bond ---------- */
function drawCross(o,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const p=applyR(R,o.at);
  const x=cx+p[0]*scale, y=cy-p[1]*scale;
  const s=Math.max(6, o.size*scale*0.55);
  ctx.save();
  ctx.globalAlpha=fade;
  // a soft halo so the cross stays legible when it lands on a gold lobe
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=6.4; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s);
  ctx.moveTo(x-s,y+s); ctx.lineTo(x+s,y-s);
  ctx.stroke();
  ctx.strokeStyle=o.col; ctx.lineWidth=3.2; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s);
  ctx.moveTo(x-s,y+s); ctx.lineTo(x+s,y-s);
  ctx.stroke();
  ctx.restore();
}

/* ---------- drawing: label tag ---------- */
function drawTag(t,R,scale,cx,cy,fade){
  fade=(fade==null)?1:fade;
  if(fade<=0.012) return;
  const v=applyR(R,t.at);
  const x=cx+v[0]*scale, y=cy-v[1]*scale;
  ctx.save();
  ctx.globalAlpha=fade;
  ctx.font='700 12px Inter,Segoe UI,sans-serif';
  const tw=ctx.measureText(t.text).width;
  let tx=x+12;
  if(tx+tw+8>CW-8) tx=x-tw-12;
  ctx.strokeStyle='rgba(100,116,139,.55)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx-5,y); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.fillRect(tx-4,y-9,tw+8,18);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle=t.col;
  ctx.fillText(t.text,tx,y);
  ctx.restore();
}

/* ---------- render ---------- */
/* Per-step framing. A single global zoom cannot serve both "one p orbital"
   (spans ~1.2 units) and "three molecules side by side" (spans ~4.4): tuned
   for the orbital it clips the comparison, tuned for the comparison it shrinks
   the orbital to a dot. So each step declares its own `zoom` (multiplier on the
   base scale) and optional `pan` (screen-space offset in canvas units).
   Defaults are 1 and [0,0], so steps 1-3 are untouched. */
function render(){
  ctx.clearRect(0,0,CW,CH);
  const R=rotMatrix(state.yaw,state.pitch);
  const step=curStep();
  const zoom=(step&&step.zoom)||1;
  const pan=(step&&step.pan)||[0,0];
  const cx=CW/2+pan[0], cy=CH/2+8+pan[1];
  const scale=Math.min(CW/4.30,CH/3.35)*zoom;

  if(!step||!step.ready){
    ctx.save();
    ctx.fillStyle='#94A3B8'; ctx.font='700 15px Inter,Segoe UI,sans-serif';
    ctx.textAlign='center';
    ctx.fillText('This step is not available yet.',CW/2,CH/2);
    ctx.restore();
    return;
  }
  const objs=step.build(state.stepT);
  /* Multi-molecule scenes tag each element with `off` = [right, up] in canvas
     units. Resolve it into a per-element origin so an object can be shifted in
     the SCREEN frame; rotating the camera then slides the whole group together
     instead of swinging the members around each other. Every draw call below
     goes through `origin()` rather than using cx/cy directly. */
  const origin=o=>{
    if(!o||!o.off) return [cx,cy];
    return [cx+o.off[0], cy-o.off[1]];
  };
  objs.filter(o=>o.k==='axes').forEach(o=>drawAxes(R,scale,cx,cy,o.faint));
  // faint level dashes sit furthest back
  objs.filter(o=>o.k==='dash').forEach(o=>drawDashBand(o,R,scale,cx,cy,shown(o)));
  // bond sticks are furniture: they thread THROUGH the orbitals, so draw them
  // behind everything solid rather than sorting them
  objs.filter(o=>o.k==='stick').forEach(o=>{const g=origin(o);drawStick(o,R,scale,g[0],g[1],shown(o));});
  objs.filter(o=>o.k==='curl').forEach(o=>{const g=origin(o);drawCurl(o,R,scale,g[0],g[1],shown(o));});
  // ghost lenses mark an overlap that is MISSING; they must sit behind the
  // orbitals or they read as a real bond painted over the top
  objs.filter(o=>o.k==='lens'&&o.ghost).forEach(o=>{const g=origin(o);drawLens(o,R,scale,g[0],g[1],shown(o));});

  // Painter's algorithm. Every element carries the z of the thing it belongs
  // to; an electron arrow sits a hair BEHIND the lobe that owns it, so that
  // lobe tints it and it reads as being inside the orbital, while a lobe in
  // front still occludes it properly.
  const solids=[];
  objs.forEach(o=>{
    if(o.k==='lobe') solids.push({o,z:applyR(R,o.c)[2]});
    /* `float` elements are drawn by the overlay pass at the end of render(),
       so they must NOT also enter the depth-sorted list - otherwise they are
       painted twice. For a semi-transparent arrow that doubles its density,
       and because the first copy is still subject to occlusion while the
       second is not, the composite thickness changes as the sort flips. */
    /* The -0.05 nudge lets a lobe tint the arrow so it reads as being INSIDE
       the orbital. That works while the lobe is translucent; against an opaque
       lobe it hides the arrow instead, which is why the sp3 electron pairs were
       half invisible. An arrow that belongs to a particular lobe can therefore
       name that lobe with `sortAt` and ride just in FRONT of it, while still
       sorting behind every genuinely nearer object. */
    if(o.k==='ear'&&!o.float){
      const zAt=o.sortAt?applyR(R,o.sortAt)[2]:applyR(R,o.at)[2];
      solids.push({o,z:zAt+(o.sortBias==null?-0.05:o.sortBias)});
    }
    // an anchor rides just under the lobe it is heading for, so the lobe tints
    // it and it reads as being inside that orbital
    if(o.k==='anchor'&&!o.float) solids.push({o,z:applyR(R,o.at)[2]-0.05, live:o.fn?o.fn():null});
    if(o.k==='nuc')  solids.push({o,z:applyR(R,o.at)[2]+0.35});
    if(o.k==='hyd')  solids.push({o,z:applyR(R,o.at)[2]+0.20});
    // the overlap lens belongs to the bond, so it sits with the atoms it joins
    if(o.k==='lens'&&!o.ghost) solids.push({o,z:applyR(R,o.c)[2]+0.12});
    if(o.k==='cross') solids.push({o,z:applyR(R,o.at)[2]+0.60});   // marker on top
  });
  solids.sort((p,q)=>p.z-q.z);
  solids.forEach(it=>{
    const f=shown(it.o);
    const k=it.o.k;
    const g=origin(it.o);
    if(k==='lobe') drawLobe(it.o,R,scale,g[0],g[1],f);
    else if(k==='ear') drawEArrow(it.o,R,scale,g[0],g[1],f);
    // the direction was resolved once during the sort pass; re-resolving it
    // here would be a second call and could disagree with the sort key
    else if(k==='anchor'){
      if(it.live) drawEArrow(Object.assign({},it.o,{dir:it.live}),R,scale,g[0],g[1],f);
    }
    else if(k==='hyd') drawHyd(it.o,R,scale,g[0],g[1],f);
    else if(k==='lens') drawLens(it.o,R,scale,g[0],g[1],f);
    else if(k==='cross') drawCross(it.o,R,scale,g[0],g[1],f);
    else drawNuc(it.o,R,scale,g[0],g[1],f);
  });

  /* ---- overlay pass: things that must not be eaten by a lobe -------------
     The s label and the 2s electron pair are drawn ON TOP of every lobe, and
     that is deliberate rather than a cheat.

     The sphere they belong to is centred on the nucleus, so half of it is
     always in front of each p lobe and half behind; the p lobes, by contrast,
     are solid teardrops sitting out at 0.58. So whichever lobe happens to be
     nearer the camera clips straight through the middle of the label and the
     arrows, and as the model auto-rotates the cut moves - the label looks like
     it is being sliced in half. "Correct" depth sorting is not achievable for
     a sphere concentric with the lobes; the honest fix is to declare these two
     elements annotation and float them. Arrows that genuinely belong to a lobe
     (the p electrons, the sp3 electrons) still sort normally and are still
     occluded by the far side of the model, which is what sells the 3-D. */
  objs.forEach(o=>{
    if(!o.float) return;
    const g=origin(o), f=shown(o);
    const dir=(o.k==='anchor'&&o.fn)?o.fn():o.dir;
    if(o.k==='tag') drawTag(o,R,scale,g[0],g[1],f*(o.alpha==null?1:o.alpha));
    else if(o.k==='ear'||o.k==='anchor') drawEArrow(Object.assign({},o,{dir}),R,scale,g[0],g[1],f);
  });

  /* o.alpha MUST be folded in here. It never used to be, so every fade written on a
   tag was silently discarded and the label stayed at full strength for the whole
   animation - which is how step 3's p-orbital labels were still sitting on top of
   the finished sp3 orbitals. */
  objs.filter(o=>o.k==='tag'&&!o.float).forEach(t=>{const g=origin(t);drawTag(t,R,scale,g[0],g[1],shown(t)*(t.alpha==null?1:t.alpha));});

  /* energy-level insets are SCREEN space: drawn after the whole 3D pass, with
     no rotation matrix and no scale, so they stay pinned while the model turns */
  objs.filter(o=>o.k==='level').forEach(l=>drawLevelPanel(l,cx,cy,shown(l)));

  objs.filter(o=>o.k==='note').forEach(n=>{
    ctx.save();
    ctx.font='700 12.5px Inter,Segoe UI,sans-serif';
    ctx.fillStyle=n.col; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(n.text,n.x*CW,n.y*CH);
    ctx.restore();
  });
}

/* =================== UI =================== */
/* A step can declare `yaw0`: the camera angle it wants to be read from. A step
   whose geometry is the subject of the lesson should open on a view chosen for
   it rather than on whatever angle the previous step was left at. */
function goStep(n){
  state.step=n; state.stepT=0;
  const s=stepByN(n);
  if(s&&s.yaw0!=null) state.yaw=s.yaw0;
  syncUI();
}
function buildStepper(){
  const el=document.getElementById('stepper');
  el.innerHTML='';
  STEPS.forEach(s=>{
    const b=document.createElement('button');
    b.className='step'+(s.n===state.step?' on':'');
    b.disabled=!s.ready;
    b.innerHTML='<span class="num">'+s.n+'</span><span>'+s.short+'</span>'+(s.ready?'':' <span class="soon">soon</span>');
    if(s.ready) b.onclick=()=>goStep(s.n);
    el.appendChild(b);
  });
}
function syncUI(){
  [...document.querySelectorAll('.step')].forEach((b,i)=>{
    b.classList.toggle('on',STEPS[i].n===state.step);
  });
  const s=curStep();
  document.getElementById('cardTitle').textContent=s.title||(s.n+' \u00b7 '+s.short);
  document.getElementById('cardText').innerHTML=s.text||'';
  document.getElementById('cardAlign').textContent=s.align||'';
}
const playBtn=document.getElementById('playBtn');
playBtn.onclick=()=>{
  if(state.playing){ state.playing=false; playBtn.textContent='\u25b6 Play steps'; return; }
  state.playing=true; playBtn.textContent='\u23f8 Pause';
  goStep(state.step>=3?1:state.step);
};
document.getElementById('resetBtn').onclick=()=>{
  state.yaw=0.785; state.pitch=0.615;
};

let dragging=false,lastX=0,lastY=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;cv.classList.add('drag');if(cv.setPointerCapture)cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  state.yaw+=(e.clientX-lastX)*0.008;
  state.pitch=Math.max(0.08,Math.min(1.25,state.pitch+(e.clientY-lastY)*0.006));
  lastX=e.clientX;lastY=e.clientY;
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{dragging=false;cv.classList.remove('drag');}));

/* =================== main loop =================== */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(!(dt>0)) dt=0; else if(dt>0.05) dt=0.05;
  state.t+=dt;
  if(!state.once) state.stepT+=dt;
  if(state.pinT) state.stepT=state.stepT;   // held by the deep link
  /* Per-step auto-rotation.

     A p orbital is a fixed shape in the molecule's frame, so as the camera
     turns its PROJECTED outline genuinely changes - measured over one turn, one
     pair's on-screen length sweeps 40..73 px (aspect 1.16..2.12) while its
     cross-section stays constant at 34.5 px. The change is smooth to within
     2.85 px per frame, i.e. it is real geometry and not a rendering fault.

     That is fine for a figure whose subject is a 3-D shape. It is NOT fine for
     the two steps whose subject is the ORIENTATION of the unhybridised p
     orbitals (9 and 14): there the eye reads the size change as "the orbital
     keeps changing shape", which is exactly the confusion the figure is meant
     to remove. Those steps declare spin:0 and the camera holds still, so the
     geometry is stable and readable. Dragging still works, so the teacher can
     turn the figure by hand at any time. */
  const spinK=(curStep()&&curStep().spin!=null)?curStep().spin:1;
  if(!dragging && !state.once) state.yaw+=dt*0.22*spinK;
  if(state.playing && !state.once){
    state.holdT+=dt;
    if(state.holdT>3.2){
      state.holdT=0;
      const next=STEPS.find(s=>s.n>state.step&&s.ready);
      if(next) goStep(next.n);
      else { state.playing=false; playBtn.textContent='\u25b6 Play steps'; }
    }
  }
  try{ render(); }catch(e){ /* never let one bad frame freeze the demo */ }
  requestAnimationFrame(loop);
}
fitCanvas();
buildStepper();
syncUI();
/* Deep-link hook, used by the screenshot harness and handy for teaching too:
     ?step=7&t=4.2&yaw=0.6&pitch=0.5&once=1
   `t` pins the step clock so a frame can be reproduced exactly (no waiting for
   the animation), `yaw`/`pitch` pin the camera, and `once` stops the loop from
   ever advancing - otherwise a screenshot taken 3 s in would catch a different
   moment than the one asked for. Everything is clamped into the same legal
   ranges the pointer drag uses. */
(function(){
  let q={}; try{ q=Object.fromEntries(new URLSearchParams(location.search)); }catch(e){ return; }
  if(q.step!=null && !isNaN(+q.step)) goStep(+q.step);
  if(q.yaw!=null && !isNaN(+q.yaw)) state.yaw=+q.yaw;
  if(q.pitch!=null && !isNaN(+q.pitch)) state.pitch=Math.max(0.08,Math.min(1.25,+q.pitch));
  if(q.t!=null && !isNaN(+q.t)){ state.stepT=+q.t; state.pinT=true; }
  if(q.once!=null) state.once=true;
})();
requestAnimationFrame(loop);
</script>

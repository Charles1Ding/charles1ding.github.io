    <style>
        body { background-color: #f8fafc; font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
        #canvas-container { 
            background: #ffffff; 
            border: 2px solid #e2e8f0; 
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 520px;
        }
        .catalyst-bed {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: linear-gradient(to top, #475569, #64748b);
            border-top: 2px solid #334155;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.8);
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 2px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%);
        }
        .catalyst-active .catalyst-bed { transform: translateY(0); }

        .atom {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            z-index: 10;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.2);
        }
        .atom-C { background: #1e293b; color: white; border: 2px solid #000; }
        .atom-H { background: #ffffff; color: #1e293b; border: 2px solid #cbd5e1; width: 30px; height: 30px; font-size: 14px; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.1); }
        .atom-Br { background: #991b1b; color: white; border: 2px solid #450a0a; }
        .atom-H-add { background: #f0f9ff; color: #0369a1; border: 2px solid #7dd3fc; width: 30px; height: 30px; font-size: 14px; }
        .atom-O { background: #ef4444; color: white; border: 2px solid #991b1b; }

        .bond {
            position: absolute;
            background: #cbd5e1;
            z-index: 5;
            transform-origin: left center;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 2px;
        }
        .bond-pi { background: #a78bfa; opacity: 0.8; height: 4px !important; }
        .bond-breaking {
            background: #f87171 !important;
            box-shadow: 0 0 15px #ef4444;
            transition: all 0.4s ease !important;
        }
        .slow-move {
            transition: all 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) !important;
        }

        .toggle-btn {
            @apply px-5 py-2.5 rounded-full text-sm font-bold transition-all border-2;
        }
        .active-br { @apply bg-red-700 text-white border-red-900 shadow-inner; }
        .inactive-br { @apply bg-white text-red-800 border-red-100 hover:bg-red-50; }
        .active-h { @apply bg-blue-600 text-white border-blue-800 shadow-inner; }
        .inactive-h { @apply bg-white text-blue-600 border-blue-100 hover:bg-blue-50; }
        .active-w { @apply bg-cyan-600 text-white border-cyan-800 shadow-inner; }
        .inactive-w { @apply bg-white text-cyan-600 border-cyan-100 hover:bg-cyan-50; }

        .label-text {
            position: absolute;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            pointer-events: none;
            transition: opacity 0.5s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

<body class="p-6">

<div class="max-w-5xl mx-auto">
    <header class="mb-8 flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="text-center md:text-left">
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">有机加成反应交互实验室</h1>
            <p id="formulaDisplay" class="text-slate-500 font-mono mt-1 text-lg">CH₂=CH₂ + Br₂ → CH₂Br-CH₂Br</p>
        </div>
        <div class="flex bg-white p-1.5 rounded-full shadow-lg border border-slate-100 gap-1">
            <button id="modeBr" class="toggle-btn active-br">溴 (Br₂)</button>
            <button id="modeH" class="toggle-btn inactive-h">氢气 (H₂)</button>
            <button id="modeW" class="toggle-btn inactive-w">水 (H₂O)</button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <div class="lg:col-span-3">
            <div id="canvas-container">
                <div id="catalyst" class="catalyst-bed">CATALYST SURFACE (Ni / Pt / H⁺)</div>
            </div>
        </div>

        <div class="flex flex-col gap-6">
            <div class="bg-white p-6 rounded-3xl shadow-md border border-slate-100 flex-1">
                <h2 id="stepTitle" class="text-xl font-bold text-slate-800 mb-2">准备阶段</h2>
                <div class="h-1 w-12 bg-slate-200 rounded-full mb-4"></div>
                <p id="stepDesc" class="text-slate-600 leading-relaxed text-sm">点击下方按钮开始观察反应物如何打破双键并加入乙烯分子。</p>
            </div>
            
            <div class="flex flex-col gap-3">
                <button id="runBtn" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-black transition-all shadow-xl hover:-translate-y-1 active:translate-y-0">
                    执行加成反应
                </button>
                <button id="resetBtn" class="w-full py-3 border-2 border-slate-200 text-slate-500 rounded-2xl font-bold hover:bg-slate-50 transition-all">
                    重置场景
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('canvas-container');
    const runBtn = document.getElementById('runBtn');
    const resetBtn = document.getElementById('resetBtn');
    const modeBr = document.getElementById('modeBr');
    const modeH = document.getElementById('modeH');
    const modeW = document.getElementById('modeW');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const stepTitle = document.getElementById('stepTitle');
    const stepDesc = document.getElementById('stepDesc');

    let currentMode = 'Br'; 
    let atoms = [];
    let bonds = [];
    const C_DIST = 120;

    function init() {
        container.querySelectorAll('.atom, .bond, .label-text').forEach(el => el.remove());
        atoms = [];
        bonds = [];
        runBtn.disabled = false;
        stepTitle.innerText = "准备阶段";
        
        const midX = container.offsetWidth / 2;
        const midY = container.offsetHeight / 2;

        container.classList.remove('catalyst-active');
        if (currentMode === 'H') {
            container.classList.add('catalyst-active');
            formulaDisplay.innerHTML = "CH₂=CH₂ + H₂ → CH₃-CH₃";
            stepDesc.innerText = "氢气在镍或铂催化剂表面活化，随后加入双键。";
            runBtn.className = "w-full py-4 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 transition-all shadow-xl hover:-translate-y-1";
        } else if (currentMode === 'W') {
            container.classList.add('catalyst-active');
            formulaDisplay.innerHTML = "CH₂=CH₂ + H₂O → CH₃-CH₂OH";
            stepDesc.innerText = "水分子在酸性条件下发生加成，其中一个H-O键断裂。";
            runBtn.className = "w-full py-4 bg-cyan-600 text-white rounded-2xl font-bold hover:bg-cyan-700 transition-all shadow-xl hover:-translate-y-1";
        } else {
            formulaDisplay.innerHTML = "CH₂=CH₂ + Br₂ → CH₂Br-CH₂Br";
            stepDesc.innerText = "溴分子的诱导偶极促使π键断裂，形成二溴化物。";
            runBtn.className = "w-full py-4 bg-red-800 text-white rounded-2xl font-bold hover:bg-red-900 transition-all shadow-xl hover:-translate-y-1";
        }

        // 乙烯骨架
        const c1 = createAtom('C', midX - C_DIST/2, midY, 'C1');
        const c2 = createAtom('C', midX + C_DIST/2, midY, 'C2');
        createBond('C1', 'C2', 'sigma', 0);
        createBond('C1', 'C2', 'pi', -8);

        createAtom('H', c1.x - 40, c1.y - 50, 'H1');
        createAtom('H', c1.x - 40, c1.y + 50, 'H2');
        createAtom('H', c2.x + 40, c2.y - 50, 'H3');
        createAtom('H', c2.x + 40, c2.y + 50, 'H4');
        ['H1','H2'].forEach(id => createBond('C1', id));
        ['H3','H4'].forEach(id => createBond('C2', id));

        // 反应物定位
        if (currentMode === 'Br') {
            createAtom('Br', midX - 40, 80, 'X1');
            createAtom('Br', midX + 40, 80, 'X2');
            createBond('X1', 'X2', 'reactant-bond', 0);
            addLabel("BRINE (Br₂)", midX, 40);
        } else if (currentMode === 'H') {
            createAtom('H-add', midX - 25, 80, 'X1');
            createAtom('H-add', midX + 25, 80, 'X2');
            createBond('X1', 'X2', 'reactant-bond', 0);
            addLabel("HYDROGEN (H₂)", midX, 40);
        } else if (currentMode === 'W') {
            // 水分子: 完美的 V 型对称结构
            const ox = createAtom('O', midX, 70, 'X_O');
            const dx = 34, dy = 32; // 精确的键长控制
            createAtom('H-add', midX - dx, 70 + dy, 'X1'); 
            createAtom('H-add', midX + dx, 70 + dy, 'X2'); 
            // 两个 H-O 键长度完全一致
            createBond('X_O', 'X1', 'reactant-bond', 0);
            createBond('X_O', 'X2', 'reactant-bond', 0);
            addLabel("WATER (H₂O)", midX, 35);
        }
        
        addLabel("ETHENE (C₂H₄)", midX, midY + 95);
    }

    function createAtom(type, x, y, id) {
        const div = document.createElement('div');
        const displayType = type.split('-')[0];
        div.className = `atom atom-${type}`;
        div.innerText = displayType;
        div.style.left = `${x}px`;
        div.style.top = `${y}px`;
        div.id = id;
        container.appendChild(div);
        const obj = { id, type, x, y, el: div };
        atoms.push(obj);
        return obj;
    }

    function createBond(idA, idB, type = 'sigma', offset = 0) {
        const div = document.createElement('div');
        div.className = `bond ${type === 'pi' ? 'bond-pi' : ''}`;
        div.id = `bond-${idA}-${idB}-${type}`;
        div.style.height = (type === 'pi') ? '5px' : '3px';
        container.appendChild(div);
        const bondObj = { idA, idB, type, offset, el: div };
        bonds.push(bondObj);
        updateBondPosition(bondObj);
        return bondObj;
    }

    function updateBondPosition(bond) {
        const a = atoms.find(at => at.id === bond.idA);
        const b = atoms.find(at => at.id === bond.idB);
        if (!a || !b) return;

        const offA = a.type.includes('H') ? 15 : 21;
        const offB = b.type.includes('H') ? 15 : 21;

        const x1 = a.x + offA;
        const y1 = a.y + offA;
        const x2 = b.x + offB;
        const y2 = b.y + offB;

        const length = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
        const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

        bond.el.style.width = `${length}px`;
        bond.el.style.left = `${x1}px`;
        bond.el.style.top = `${y1 - 1.5 + bond.offset}px`;
        bond.el.style.transform = `rotate(${angle}deg)`;
    }

    function addLabel(text, x, y) {
        const lbl = document.createElement('div');
        lbl.className = 'label-text';
        lbl.innerText = text;
        lbl.style.left = `${x}px`;
        lbl.style.top = `${y}px`;
        lbl.style.transform = 'translateX(-50%)';
        container.appendChild(lbl);
        return lbl;
    }

    async function runReaction() {
        runBtn.disabled = true;

        stepTitle.innerText = "第一步：吸附与诱导";
        stepDesc.innerText = "反应物靠近乙烯的双键，π 电子云与进攻原子发生相互作用。";
        
        const reactantAtoms = atoms.filter(a => a.id.startsWith('X'));
        const moveY = 115;
        
        reactantAtoms.forEach(a => {
            a.y += moveY;
            a.el.style.top = `${a.y}px`;
        });
        
        let moveTimer = setInterval(() => bonds.forEach(updateBondPosition), 40);
        await new Promise(r => setTimeout(r, 1300));
        clearInterval(moveTimer);

        stepTitle.innerText = "第二步：旧键断裂";
        stepDesc.innerText = "高能的 π 键被破坏，反应物分子内部的共价键也发生异裂或均裂。";

        const piBond = bonds.find(b => b.type === 'pi');
        const xBonds = bonds.filter(b => b.type === 'reactant-bond');
        
        piBond.el.classList.add('bond-breaking');
        xBonds.forEach(b => b.el.classList.add('bond-breaking'));
        
        await new Promise(r => setTimeout(r, 600));
        piBond.el.style.opacity = '0';

        if (currentMode === 'W') {
            // 水合：断开左侧 H-O 键，保留右侧 H-O 键形成羟基
            const bToBreak = xBonds.find(b => b.idB === 'X1');
            bToBreak.el.style.opacity = '0';
        } else {
            xBonds.forEach(b => b.el.style.opacity = '0');
        }
        await new Promise(r => setTimeout(r, 800));

        stepTitle.innerText = "第三步：重组与加成";
        stepDesc.innerText = "原子迁移并重新杂化，碳原子从 sp² 变为 sp³ 杂化。";

        const c1 = atoms.find(a => a.id === 'C1');
        const c2 = atoms.find(a => a.id === 'C2');

        reactantAtoms.forEach(a => a.el.classList.add('slow-move'));
        ['H1','H2','H3','H4'].forEach(id => atoms.find(a => a.id === id).el.classList.add('slow-move'));

        const h1 = atoms.find(a => a.id === 'H1');
        const h2 = atoms.find(a => a.id === 'H2');
        const h3 = atoms.find(a => a.id === 'H3');
        const h4 = atoms.find(a => a.id === 'H4');
        const x1 = atoms.find(a => a.id === 'X1');
        const x2 = atoms.find(a => a.id === 'X2');

        if (currentMode === 'Br') {
            x1.x = c1.x; x1.y = c1.y - 95;
            x2.x = c2.x; x2.y = c2.y + 95;
            h1.x = c1.x - 75; h1.y = c1.y - 25;
            h2.x = c1.x - 45; h2.y = c1.y + 70;
            h3.x = c2.x + 75; h3.y = c2.y + 25;
            h4.x = c2.x + 45; h4.y = c2.y - 70;
        } else if (currentMode === 'H') {
            x1.x = c1.x; x1.y = c1.y - 85;
            x2.x = c2.x; x2.y = c2.y - 85;
            h1.x = c1.x - 70; h1.y = c1.y - 30;
            h2.x = c1.x - 40; h2.y = c1.y + 75;
            h3.x = c2.x + 70; h3.y = c2.y - 30;
            h4.x = c2.x + 40; h4.y = c2.y + 75;
        } else if (currentMode === 'W') {
            const xo = atoms.find(a => a.id === 'X_O');
            xo.el.classList.add('slow-move');
            
            x1.x = c1.x; x1.y = c1.y - 85; // 氢加入C1
            xo.x = c2.x; xo.y = c2.y - 85; // 氧加入C2
            x2.x = c2.x + 40; x2.y = c2.y - 125; // 另一个氢随氧形成羟基
            
            h1.x = c1.x - 70; h1.y = c1.y - 30;
            h2.x = c1.x - 40; h2.y = c1.y + 75;
            h3.x = c2.x + 70; h3.y = c2.y - 30;
            h4.x = c2.x + 40; h4.y = c2.y + 75;
        }

        atoms.forEach(a => {
            a.el.style.left = `${a.x}px`;
            a.el.style.top = `${a.y}px`;
        });

        moveTimer = setInterval(() => bonds.forEach(updateBondPosition), 40);
        await new Promise(r => setTimeout(r, 2800));
        clearInterval(moveTimer);

        // 创建新键
        if (currentMode === 'W') {
            createBond('C1', 'X1', 'sigma', 0); // C-H
            createBond('C2', 'X_O', 'sigma', 0); // C-O
        } else {
            createBond('C1', 'X1', 'sigma', 0);
            createBond('C2', 'X2', 'sigma', 0);
        }
        bonds.forEach(updateBondPosition);

        document.querySelectorAll('.label-text').forEach(l => l.style.opacity = '0');
        stepTitle.innerText = "第四步：产物稳定化";
        const result = (currentMode === 'Br') ? '1,2-二溴乙烷' : (currentMode === 'H' ? '乙烷' : '乙醇');
        stepDesc.innerText = `反应完成，生成了饱和的 ${result} 分子。所有碳原子目前均为 sp³ 杂化。`;
    }

    function updateActiveBtn(activeId) {
        [modeBr, modeH, modeW].forEach(btn => {
            if (btn.id === activeId) {
                btn.className = `toggle-btn active-${btn.id.slice(4).toLowerCase()}`;
            } else {
                btn.className = `toggle-btn inactive-${btn.id.slice(4).toLowerCase()}`;
            }
        });
    }

    modeBr.onclick = () => { if(currentMode === 'Br') return; currentMode = 'Br'; updateActiveBtn('modeBr'); init(); };
    modeH.onclick = () => { if(currentMode === 'H') return; currentMode = 'H'; updateActiveBtn('modeH'); init(); };
    modeW.onclick = () => { if(currentMode === 'W') return; currentMode = 'W'; updateActiveBtn('modeW'); init(); };

    resetBtn.onclick = init;
    runBtn.onclick = runReaction;

    window.onload = init;
</script>

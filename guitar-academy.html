<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉他弹唱学院 - Guitar Academy</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --card: #0f3460;
  --primary: #e94560;
  --accent: #f5c518;
  --text: #eaeaea;
  --text-muted: #a0a0b0;
  --border: #2a2a4a;
  --success: #00c853;
  --radius: 14px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }

/* ── Site top bar ── */
.site-bar {
  height: 44px;
  background: linear-gradient(135deg, #1a3a6b, #1a56a0);
  display: flex; align-items: center; padding: 0 16px;
  flex-shrink: 0;
}
.site-bar a {
  color: rgba(255,255,255,0.85); text-decoration: none;
  font-size: 0.85rem; font-weight: 600; letter-spacing: 0.3px;
  transition: color 0.2s;
}
.site-bar a:hover { color: #fff; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: var(--surface);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo span { font-size: 1.6rem; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 4px;
  font-size: 0.95rem;
  color: var(--text-muted);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(233,69,96,0.1); color: var(--text); }
.nav-item.active { background: var(--primary); color: #fff; }
.nav-icon { font-size: 1.3rem; width: 28px; text-align: center; }

/* Main */
.main {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 32px;
}

.view { display: none; }
.view.active { display: block; }

h1 {
  font-size: 1.8rem;
  margin-bottom: 8px;
  color: #fff;
}
.subtitle {
  color: var(--text-muted);
  margin-bottom: 28px;
  font-size: 0.95rem;
}

/* Cards */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

/* Chord Grid */
.chord-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.chord-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid transparent;
}
.chord-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.chord-card.selected { border-color: var(--accent); background: var(--card); }
.chord-name { font-size: 1.2rem; font-weight: 700; margin-top: 8px; }
.chord-type { font-size: 0.75rem; color: var(--text-muted); }

/* Chord detail */
.chord-detail {
  display: flex;
  gap: 32px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.chord-svg-wrap { flex-shrink: 0; }
.chord-info { flex: 1; min-width: 200px; }
.chord-info h3 { margin-bottom: 12px; font-size: 1.3rem; }
.finger-list { list-style: none; }
.finger-list li {
  padding: 6px 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.finger-list li strong { color: var(--text); }

/* Filter tabs */
.filter-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.filter-tab {
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.filter-tab:hover { border-color: var(--primary); color: var(--text); }
.filter-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Song list */
.song-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.song-item {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.song-item:hover { border-color: var(--primary); }
.song-title { font-weight: 600; font-size: 1.05rem; }
.song-artist { font-size: 0.85rem; color: var(--text-muted); }
.song-difficulty {
  font-size: 0.75rem;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 600;
}
.diff-easy { background: rgba(0,200,83,0.2); color: var(--success); }
.diff-medium { background: rgba(245,197,24,0.2); color: var(--accent); }
.diff-hard { background: rgba(233,69,96,0.2); color: var(--primary); }
.diff-advanced { background: rgba(160,100,255,0.2); color: #a064ff; }

/* Song detail view */
.song-detail-view {
  animation: fadeIn 0.3s;
}
.song-chords-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  padding: 16px;
  background: var(--card);
  border-radius: var(--radius);
}
.song-chord-tag {
  background: var(--primary);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: transform 0.2s;
}
.song-chord-tag:hover { transform: scale(1.1); }
.lyrics-line {
  padding: 8px 0;
  font-size: 1rem;
  line-height: 1.8;
  position: relative;
}
.lyrics-chord {
  display: inline-block;
  color: var(--accent);
  font-weight: 700;
  font-size: 0.82rem;
  margin-right: 6px;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(245,197,24,0.1);
  min-width: 28px;
  text-align: center;
  vertical-align: top;
}
.lyrics-text {
  font-size: 1rem;
  line-height: 2;
}

/* Chord-over-text: each chord centered above its lyric segment */
.bar-chord-block {
  margin-bottom: 12px;
}
.chord-seg {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: top;
}
.ch-top {
  font-size: 0.82rem;
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
  line-height: 1.4;
  min-height: 18px;
}
.ch-bot {
  font-size: 1rem;
  color: var(--text);
  white-space: nowrap;
  line-height: 1.8;
}

/* Metronome */
.metronome-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
.bpm-display {
  font-size: 5rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
}
.bpm-label { color: var(--text-muted); font-size: 0.9rem; }
.bpm-controls { display: flex; gap: 12px; align-items: center; }
.bpm-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 1.5rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bpm-btn:hover { border-color: var(--primary); }
.bpm-btn.play { background: var(--primary); border-color: var(--primary); font-size: 1.2rem; }
.bpm-beats {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}
.beat-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.1s;
}
.beat-dot.active { background: var(--primary); transform: scale(1.4); }
.beat-dot.accent { background: var(--accent); transform: scale(1.4); }

/* Tuner */
.tuner-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.tuner-needle-wrap {
  width: 300px;
  height: 60px;
  background: var(--card);
  border-radius: 30px;
  position: relative;
  overflow: hidden;
}
.tuner-needle {
  width: 4px; height: 100%;
  background: var(--success);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  transition: left 0.05s linear;
  border-radius: 2px;
}
.tuner-center { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(255,255,255,0.3); }
.tuner-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--text-muted);
  width: 300px;
  margin-top: 4px;
}
.tuner-note {
  font-size: 2rem;
  font-weight: 800;
  color: var(--accent);
  min-width: 60px;
  text-align: center;
}
.tuner-freq {
  font-size: 0.9rem;
  color: var(--text-muted);
}
.tuner-start {
  padding: 12px 32px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
}
.tuner-start:hover { opacity: 0.85; }
.tuner-start.active { background: var(--success); }
.tuner-targets {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.tuner-target-btn {
  padding: 6px 14px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}
.tuner-target-btn:hover { border-color: var(--primary); }
.tuner-target-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Lessons */
.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.lesson-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.lesson-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.lesson-num {
  font-size: 0.8rem;
  color: var(--primary);
  font-weight: 700;
  margin-bottom: 8px;
}
.lesson-title { font-weight: 600; margin-bottom: 6px; }
.lesson-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
.lesson-badge {
  position: absolute;
  top: 16px; right: 16px;
  font-size: 0.7rem;
  padding: 3px 10px;
  border-radius: 10px;
  background: rgba(0,200,83,0.2);
  color: var(--success);
}

/* Strumming */
.strum-patterns {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.strum-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.strum-card:hover { border-color: var(--primary); }
.strum-name { font-weight: 600; margin-bottom: 4px; }
.strum-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
.strum-viz {
  display: flex;
  gap: 4px;
  align-items: center;
}
.strum-arrow {
  font-size: 1.3rem;
  width: 28px;
  text-align: center;
}
.strum-arrow.down { color: var(--primary); }
.strum-arrow.up { color: var(--accent); }

/* Back button */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  cursor: pointer;
  margin-bottom: 20px;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.back-btn:hover { border-color: var(--primary); color: var(--text); }

/* Responsive */
@media (max-width:768px) {
  body { flex-direction: column; }
  .sidebar {
    width: 100%; flex-direction: row;
    padding: 12px; overflow-x: auto;
    border-right: none; border-bottom: 1px solid var(--border);
  }
  .logo { display: none; }
  .nav-item { flex-shrink: 0; font-size: 0.8rem; padding: 8px 12px; }
  .main { padding: 16px; }
  .chord-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Tab content panel */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.section-title {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: #fff;
}

/* Progress bar */
.progress-bar-wrap {
  background: var(--border);
  border-radius: 8px;
  height: 8px;
  margin-top: 8px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 8px;
  transition: width 0.5s;
}

/* Tab (六线谱) display */
.tab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.tab-item {
  background: var(--card);
  border-radius: 10px;
  padding: 12px 8px 8px;
  text-align: center;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.tab-item:hover { border-color: var(--primary); }
.tab-item .tab-chord-name {
  font-weight: 700;
  font-size: 1rem;
  color: var(--accent);
  margin-bottom: 6px;
}
.tab-item .tab-chord-type {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-bottom: 8px;
}

/* Rhythm section */
.rhythm-section {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.rhythm-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: all 0.2s;
  min-width: 140px;
}
.rhythm-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.rhythm-card .rhythm-name {
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--accent);
  margin-bottom: 4px;
}
.rhythm-card .rhythm-pattern {
  font-size: 0.8rem;
  color: var(--text-muted);
}
.rhythm-card .rhythm-desc {
  font-size: 0.7rem;
  color: var(--text-muted);
  opacity: 0.7;
  margin-top: 2px;
}

/* Responsive tab grid */
@media (max-width:768px) {
  .tab-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
</style>
</head>

function navigate(view) {

function render() {
  const main = document.getElementById('mainContent');
  switch(currentView) {
    case 'chords': main.innerHTML = renderChords(); bindChordEvents(); break;
    case 'songs': main.innerHTML = selectedSong ? renderSongDetail() : renderSongs(); bindSongEvents(); break;
    case 'tuner': main.innerHTML = renderTuner(); bindTunerEvents(); break;
    case 'metronome': main.innerHTML = renderMetronome(); bindMetronomeEvents(); break;
    case 'lessons': main.innerHTML = renderLessons(); break;
    case 'strumming': main.innerHTML = renderStrumming(); break;
  }
}

// SVG chord diagram
function chordSvg(chordKey, size=120) {
  const chord = CHORDS[chordKey];
  if (!chord) return '';
  const w=size, h=size*1.3;
  const pad=16, fh=(h-pad*3)/5, sw=(w-pad*2)/5;
  const fretStart = Math.min(...chord.fingers.filter(f=>f.f>0).map(f=>f.f), 1);

  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  // Fret lines
  for (let i=0; i<=5; i++) {
    const y=pad+i*fh;
    svg+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#444" stroke-width="${i===0?3:1}"/>`;
  }
  // String lines
  for (let i=0; i<6; i++) {
    const x=pad+i*sw;
    svg+=`<line x1="${x}" y1="${pad}" x2="${x}" y2="${h-pad}" stroke="#aaa" stroke-width="1.5"/>`;
  }
  // Fret number
  if (fretStart > 1) {
    svg+=`<text x="${pad-8}" y="${pad+fh*0+14}" fill="#e94560" font-size="10" font-weight="bold">${fretStart}fr</text>`;
  }
  // Finger dots - data uses s:0=highE, s:5=lowE. Display left=lowE→right=highE.
  chord.fingers.forEach(f => {
    if (f.f > 0) {
      const cx=pad+(5-f.s)*sw;
      const fretRel = f.f - fretStart;
      if (fretRel >= 0 && fretRel <= 4) {
        const cy=pad+fretRel*fh+fh/2;
        svg+=`<circle cx="${cx}" cy="${cy}" r="${Math.min(sw,fh)/2.5}" fill="#e94560"/>`;
        if (f.fn>0) svg+=`<text x="${cx}" y="${cy+4}" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold">${f.fn}</text>`;
      }
    } else if (f.f === 0) {
      const cx=pad+(5-f.s)*sw;
      svg+=`<circle cx="${cx}" cy="${pad-10}" r="4" fill="none" stroke="#aaa" stroke-width="1.5"/>`;
    } else if (f.f === -1) {
      const cx=pad+(5-f.s)*sw;
      svg+=`<text x="${cx}" y="${pad-6}" fill="#666" font-size="7" text-anchor="middle">✕</text>`;
    }
  });

  svg+=`</svg>`;
  return svg;
}

// Generate SVG guitar tab (六线谱) for a chord
// Chord grid SVG (vertical fretboard, like standard guitar chord book)
function chordGridSvg(chordKey, size=130) {
  const chord = CHORDS[chordKey];
  if (!chord) return '';
  const fretCount = 5;
  const margin = {top:20, right:12, bottom:22, left:12};
  const w = size, h = Math.round(size * 1.35);
  const fretH = (h - margin.top - margin.bottom) / fretCount;
  const strW = (w - margin.left - margin.right) / 5;

  // Find fret range to display
  const frets = chord.fingers.filter(f=>f.f>0).map(f=>f.f);
  let startFret = frets.length ? Math.min(...frets) : 1;
  if (startFret > 1) startFret = startFret - 1; // show one fret above
  if (startFret < 1) startFret = 1;

  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;

  // Fret lines (horizontal)
  for (let i = 0; i <= fretCount; i++) {
    const y = margin.top + i * fretH;
    const sw = i === 0 ? 2.5 : 0.8;
    svg += `<line x1="${margin.left}" y1="${y}" x2="${w-margin.right}" y2="${y}" stroke="#777" stroke-width="${sw}"/>`;
  }

  // String lines (vertical)
  for (let i = 0; i < 6; i++) {
    const x = margin.left + i * strW;
    svg += `<line x1="${x}" y1="${margin.top}" x2="${x}" y2="${h-margin.bottom}" stroke="#aaa" stroke-width="1.2"/>`;
  }

  // Fret number display
  if (startFret > 1) {
    svg += `<text x="${margin.left-4}" y="${margin.top+fretH*0.5+2}" fill="#e94560" font-size="8" text-anchor="end" font-weight="bold">${startFret}</text>`;
  }

  // Finger dots
  // Data uses s:0=highE, s:5=lowE. Display left-to-right = lowE→highE.
  // So map s:0(highE) to rightmost, s:5(lowE) to leftmost: cx = left + (5-s)*sw
  chord.fingers.forEach(f => {
    const cx = margin.left + (5 - f.s) * strW;
    if (f.f > 0) {
      const fretPos = f.f - startFret;
      if (fretPos >= 0 && fretPos < fretCount) {
        const cy = margin.top + fretPos * fretH + fretH / 2;
        const r = Math.min(strW, fretH) * 0.38;
        svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e94560" stroke="#c0392b" stroke-width="0.5"/>`;
        if (f.fn > 0) {
          svg += `<text x="${cx}" y="${cy+3.5}" fill="#fff" font-size="${r*1.3}" text-anchor="middle" font-weight="bold">${f.fn}</text>`;
        }
      }
    } else if (f.f === 0) {
      // Open circle above fretboard
      const cy = margin.top - 9;
      svg += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="none" stroke="#aaa" stroke-width="1.2"/>`;
    } else if (f.f === -1) {
      // X mark above fretboard
      const cy = margin.top - 9;
      svg += `<text x="${cx}" y="${cy+2}" fill="#666" font-size="7" text-anchor="middle">✕</text>`;
    }
  });

  // String names below
  const sNames = ['E','A','D','G','B','E'];
  sNames.forEach((name, i) => {
    const cx = margin.left + i * strW;
    svg += `<text x="${cx}" y="${h-5}" fill="#aaa" font-size="7" text-anchor="middle">${name}</text>`;
  });

  // Chord name
  svg += `<text x="${w/2}" y="${14}" fill="#f5c518" font-size="12" text-anchor="middle" font-weight="bold">${chordKey}</text>`;

  svg += `</svg>`;
  return svg;
}

// Generate a full TAB (六线谱) for a song
function renderFullTablature(song) {
  const hasBars = song.bars && song.bars.length;
  const barsRaw = hasBars ? song.bars : (() => {
    const result = [];
    if (song.lyrics && song.lyrics.length) {
      // Use the song's chord progression to create richer bars
      const chords = song.chordsUsed.filter(c => CHORDS[c]);
      let ci = 0;
      for (let i = 0; i < song.lyrics.length; i++) {
        const l = song.lyrics[i];
        if (!l.text) continue;
        // Rotate through chords: assign 1-2 chords per lyric line
        const barChords = [];
        if (chords.length > 0) {
          barChords.push(chords[ci % chords.length]);
          ci++;
          // Every other line gets 2 chords
          if (i % 2 === 0 && chords.length > 1) {
            barChords.push(chords[ci % chords.length]);
            ci++;
          }
        }
        if (!barChords.length) barChords.push(l.chord ? l.chord : 'N.C.');
        result.push({ chords: barChords, lyric: l.text });
      }
    } else if (song.chordsUsed && song.chordsUsed.length) {
      const seq = song.chordsUsed.filter(c => CHORDS[c]);
      for (let i = 0; i < seq.length; i++) {
        result.push({ chords: [seq[i], seq[(i+1)%seq.length] || seq[i]], lyric: seq[i] + ' →' });
      }
    }
    return result;
  })();
  if (!barsRaw.length) return '<p style="color:#888;text-align:center;">暂无谱数据</p>';

  // Build as HTML table for reliability
  let html = '<div style="overflow-x:auto;width:100%;"><table style="border-collapse:collapse;font-family:monospace;font-size:14px;min-width:100%;">';

  const sLabels = ['e','B','G','D','A','E'];

  // Section header row (if any sections)
  let hasSection = barsRaw.some(b => b.section);
  if (hasSection) {
    html += '<tr style="color:#a064ff;font-size:10px;">';
    barsRaw.forEach(bar => {
      const cols = Math.max(bar.chords.length, 1);
      html += `<td colspan="${cols}" style="text-align:center;padding:2px 4px;font-weight:bold;">${bar.section || ''}</td>`;
      html += '<td style="width:6px;"></td>'; // bar gap
    });
    html += '</tr>';
  }

  // Chord name row
  html += '<tr style="color:#f5c518;font-size:13px;font-weight:bold;">';
  barsRaw.forEach(bar => {
    bar.chords.forEach(c => {
      html += `<td style="text-align:center;padding:2px 6px;min-width:28px;">${c}</td>`;
    });
    if (!bar.chords.length) html += '<td style="text-align:center;padding:2px 6px;min-width:28px;">N.C.</td>';
    html += '<td style="width:6px;"></td>';
  });
  html += '</tr>';

  // 6 string rows (tab lines)
  sLabels.forEach((sName, si) => {
    html += `<tr>`;
    html += `<td style="color:#888;font-size:10px;padding-right:6px;text-align:right;">${sName}|</td>`;

    barsRaw.forEach(bar => {
      const chords = bar.chords.length ? bar.chords : ['N.C.'];
      chords.forEach(cName => {
        const chord = CHORDS[cName];
        if (chord) {
          const f = chord.fingers.find(x => x.s === si);
          if (f) {
            let label = '', color = '#666', weight = 'normal';
            if (f.f === -1) { label = '×'; color = '#444'; }
            else if (f.f === 0) { label = '0'; color = '#888'; }
            else { label = String(f.f); color = '#e94560'; weight = 'bold'; }
            html += `<td style="text-align:center;padding:1px 6px;color:${color};font-weight:${weight};border-top:1px solid #333;border-bottom:1px solid #222;">${label}</td>`;
          } else {
            html += '<td style="text-align:center;padding:1px 6px;border-top:1px solid #333;border-bottom:1px solid #222;"> </td>';
          }
        } else {
          html += '<td style="text-align:center;padding:1px 6px;border-top:1px solid #333;border-bottom:1px solid #222;">-</td>';
        }
      });
      // Bar separator
      html += '<td style="width:6px;border-left:1px solid #555;border-right:1px solid #555;"></td>';
    });
    html += '</tr>';
  });

  // Lyric row
  html += '<tr style="color:#aaa;font-size:13px;">';
  html += '<td></td>';
  barsRaw.forEach(bar => {
    const cols = Math.max(bar.chords.length, 1);
    html += `<td colspan="${cols}" style="text-align:center;padding:4px 6px;white-space:nowrap;">${bar.lyric || ''}</td>`;
    html += '<td style="width:6px;"></td>';
  });
  html += '</tr>';

  // TAB label row
  html += '<tr style="color:#555;font-size:10px;font-weight:bold;">';
  html += '<td>TAB</td>';
  html += '</tr>';

  html += '</table></div>';
  return html;
}

async function startTuner() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);
    tunerActive = true;

    document.getElementById('tunerStartBtn').textContent = '⏹ 停止调音';
    document.getElementById('tunerStartBtn').classList.add('active');

    const buf = new Float32Array(analyser.fftSize);
    const targetFreq = TUNING[tunerTarget].freq;
    const tolerance = 2; // Hz tolerance for "in tune"

    function update() {
      if (!tunerActive) return;
      analyser.getFloatTimeDomainData(buf);
      // Simple autocorrelation for pitch detection
      const freq = detectPitch(buf, audioCtx.sampleRate);

      const needle = document.getElementById('tunerNeedle');
      const noteEl = document.getElementById('tunerNote');
      const freqEl = document.getElementById('tunerFreq');

      if (freq && freq > 60 && freq < 400) {
        const cents = 1200 * Math.log2(freq / targetFreq);
        const pos = 50 + cents * 0.8; // Map cents to percentage
        const clampedPos = Math.max(5, Math.min(95, pos));
        needle.style.left = clampedPos + '%';
        window._tunerNeedleLeft = clampedPos;
        noteEl.textContent = TUNING[tunerTarget].note.replace(/[0-9]/,'');
        freqEl.textContent = `检测: ${freq.toFixed(1)} Hz · 目标: ${targetFreq.toFixed(1)} Hz`;

        if (Math.abs(cents) < 5) {
          needle.style.background = '#00c853';
        } else if (Math.abs(cents) < 15) {
          needle.style.background = '#f5c518';
        } else {
          needle.style.background = '#e94560';
        }
      } else {
        noteEl.textContent = '--';
        freqEl.textContent = `目标: ${targetFreq.toFixed(1)} Hz`;
        needle.style.background = 'var(--text-muted)';
      }

      tunerAnimId = requestAnimationFrame(update);
    }
    update();
  } catch(e) {
    alert('无法访问麦克风，请确保已授予麦克风权限。');
    console.error(e);
  }
}

function stopTuner() {
  tunerActive = false;
  if (tunerAnimId) cancelAnimationFrame(tunerAnimId);
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  const btn = document.getElementById('tunerStartBtn');
  if (btn) {
    btn.textContent = '🎤 开始调音';
    btn.classList.remove('active');
  }
  render();
}

function detectPitch(buffer, sampleRate) {
  const n = buffer.length;
  // Autocorrelation
  let bestOffset = -1, bestCorr = 0;
  const minOffset = Math.floor(sampleRate / 400);
  const maxOffset = Math.floor(sampleRate / 60);

  for (let offset = minOffset; offset < maxOffset; offset++) {
    let corr = 0;
    for (let i = 0; i < n - offset; i++) {
      corr += buffer[i] * buffer[i + offset];
    }
    if (corr > bestCorr) {
      bestCorr = corr;
      bestOffset = offset;
    }
  }

  if (bestCorr > 0.01 && bestOffset > 0) {
    return sampleRate / bestOffset;
  }
  return null;
}

function bindMetronomeEvents() {
  document.getElementById('bpmDown').addEventListener('click', () => {
    metronomeBpm = Math.max(30, metronomeBpm - 5);
    if (metronomePlaying) { stopMetronome(); startMetronome(); }
    else { render(); }
  });
  document.getElementById('bpmUp').addEventListener('click', () => {
    metronomeBpm = Math.min(240, metronomeBpm + 5);
    if (metronomePlaying) { stopMetronome(); startMetronome(); }
    else { render(); }
  });
  document.getElementById('bpmPlay').addEventListener('click', () => {
    if (metronomePlaying) { stopMetronome(); }
    else { startMetronome(); }
  });
}

function startMetronome() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  metronomePlaying = true;
  metronomeBeatIdx = 0;
  scheduleMetronomeBeat();
}

function stopMetronome() {
  metronomePlaying = false;
  if (metronomeTimeout) clearTimeout(metronomeTimeout);
  metronomeBeatIdx = 0;
  render();
}

function scheduleMetronomeBeat() {
  if (!metronomePlaying) return;

  const interval = 60000 / metronomeBpm;
  metronomeNextTime = (metronomeNextTime || audioCtx.currentTime * 1000) + interval;

  // Play click
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = metronomeBeatIdx === 0 ? 880 : 660;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.08);

  // Update UI
  updateBeatUI();
  metronomeBeatIdx = (metronomeBeatIdx + 1) % metronomeBeats;

  const delay = interval - (audioCtx.currentTime * 1000 % interval);
  metronomeTimeout = setTimeout(scheduleMetronomeBeat, Math.max(1, delay));
}

function updateBeatUI() {
  const dots = document.querySelectorAll('.beat-dot');
  dots.forEach((dot,i) => {
    dot.classList.remove('active','accent');
  });
  if (dots[metronomeBeatIdx]) {
    dots[metronomeBeatIdx].classList.add(metronomeBeatIdx===0?'accent':'active');
  }
}

    const viz = s.pattern.map(p => {
      if (p.includes('↓') && p.includes('↑')) {
        return `<span class="strum-arrow down">↓</span><span class="strum-arrow up">↑</span>`;
      }
      if (p.includes('↓')) return `<span class="strum-arrow down">↓</span>`;
      if (p.includes('↑')) return `<span class="strum-arrow up">↑</span>`;
      if (p.includes('✂')) return `<span class="strum-arrow" style="color:#e94560;">✂</span>`;
      return `<span class="strum-arrow" style="color:#555;">⏸</span>`;
    }).join('');

    return `
      <div class="strum-card">
        <div class="strum-name">${s.name}</div>
        <div class="strum-desc">${s.desc} · ${s.bpm} BPM</div>
        <div class="strum-viz">
          <span style="color:var(--text-muted);font-size:0.8rem;margin-right:8px;">${s.pattern.join(' ')}</span>
          ${viz}
        </div>
      </div>
    `;
  }).join('');

  return `
    <h1>✋ 弹奏模式</h1>
    <p class="subtitle">学习不同的右手弹奏节奏型。↓ = 下扫，↑ = 上扫，✂ = 切音，⏸ = 空拍。</p>
    <div class="strum-patterns">${patterns}</div>
  `;
}

// ============================================================
// INIT
// ============================================================
render();

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
  if (metronomePlaying) stopMetronome();
  if (tunerActive) stopTuner();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta property="og:title" content="404 · Page Not Found" />
  <meta property="og:description" content="Oops! This page doesn't exist. Maybe it evaporated?" />
  <meta property="og:image" content="https://charles1ding.github.io/favicon.png" />
  <meta property="og:url" content="https://charles1ding.github.io" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Charles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100vh; font-family:'Nunito',sans-serif; }
    body {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:url('bg.png') center/cover no-repeat;
      position:relative;
    }
    body::after {
      content:''; position:absolute; inset:0;
      background:rgba(255,255,255,0.25);
      z-index:0;
    }
    .inner { position:relative; z-index:1; text-align:center; padding:20px; }
    h1 {
      font-size:clamp(5rem,15vw,10rem); font-weight:800; font-style:italic;
      color:#1e3a6e; line-height:1; margin-bottom:8px;
    }
    p {
      font-size:1.2rem; font-weight:600; font-style:italic; color:#2563c7; margin-bottom:28px;
    }
    a {
      display:inline-block; padding:12px 32px;
      background:rgba(255,255,255,0.8); backdrop-filter:blur(8px);
      border:2px solid rgba(74,120,200,0.3); border-radius:14px;
      color:#1e3a6e; text-decoration:none; font-weight:800; font-style:italic;
      font-size:1.05rem; transition:all 0.2s;
    }
    a:hover { background:#2563c7; color:#fff; border-color:#2563c7; }
  </style>
</head>
<body>
<div class="inner">
  <h1>404</h1>
  <p>Oops! This page doesn't exist. Maybe it evaporated? 🧪</p>
  <a href="index.html">← Back to Home</a>
</div>
</body>
</html>

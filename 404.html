<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta property="og:title" content="404 · Reaction Not Found" />
  <meta property="og:description" content="Oops! This page doesn't exist. Maybe it evaporated?" />
  <meta property="og:image" content="https://charles1ding.github.io/favicon.png" />
  <meta property="og:url" content="https://charles1ding.github.io" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Charles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100vh; font-family:'Nunito',sans-serif; overflow:hidden; }
    body {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:url('bg.webp') center/cover no-repeat;
      position:relative;
    }
    body::after {
      content:''; position:absolute; inset:0;
      background:rgba(255,255,255,0.25);
      z-index:0;
    }
    .inner { position:relative; z-index:2; text-align:center; padding:20px; }

    /* ── Floating molecules ── */
    .molecule {
      position:absolute; z-index:1; opacity:0.6;
      animation:floatMol 12s ease-in-out infinite;
    }
    .molecule:nth-child(1) { top:12%; left:8%; animation-delay:0s; }
    .molecule:nth-child(2) { top:20%; right:12%; animation-delay:2s; }
    .molecule:nth-child(3) { bottom:25%; left:10%; animation-delay:4s; }
    .molecule:nth-child(4) { bottom:18%; right:8%; animation-delay:6s; }
    @keyframes floatMol {
      0%,100% { transform:translateY(0) rotate(0deg); }
      25% { transform:translateY(-18px) rotate(5deg); }
      50% { transform:translateY(8px) rotate(-3deg); }
      75% { transform:translateY(-12px) rotate(4deg); }
    }

    /* ── Flask ── */
    .flask-wrap {
      position:relative; width:120px; height:160px; margin:0 auto 24px;
      animation:shake 4s ease-in-out infinite;
    }
    @keyframes shake {
      0%,100% { transform:rotate(0deg); }
      15% { transform:rotate(-2deg); }
      30% { transform:rotate(2deg); }
      45% { transform:rotate(-1deg); }
      60% { transform:rotate(1deg); }
    }
    .flask {
      position:absolute; bottom:0; left:50%; transform:translateX(-50%);
      width:64px; height:80px;
      border:3px solid rgba(37,99,199,0.6);
      border-top:none; border-radius:0 0 16px 16px;
      background:rgba(255,255,255,0.15);
      overflow:hidden;
    }
    .flask-neck {
      position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:20px; height:50px;
      border:3px solid rgba(37,99,199,0.6);
      border-bottom:none; border-radius:8px 8px 0 0;
      background:rgba(255,255,255,0.15);
    }
    .liquid {
      position:absolute; bottom:0; left:0; right:0;
      height:65%; background:linear-gradient(180deg, rgba(37,99,199,0.4), rgba(14,116,144,0.55));
      border-radius:0 0 13px 13px;
      animation:swell 3s ease-in-out infinite;
    }
    @keyframes swell {
      0%,100% { height:60%; }
      50% { height:70%; }
    }
    .bubble {
      position:absolute; bottom:10px; border-radius:50%;
      background:rgba(255,255,255,0.5);
      animation:bubbleUp linear infinite;
    }
    .bubble:nth-child(1) { left:15%; width:5px; height:5px; animation-duration:2.8s; }
    .bubble:nth-child(2) { left:30%; width:4px; height:4px; animation-duration:3.2s; animation-delay:0.8s; }
    .bubble:nth-child(3) { left:45%; width:6px; height:6px; animation-duration:2.4s; animation-delay:0.3s; }
    .bubble:nth-child(4) { left:60%; width:3px; height:3px; animation-duration:3.5s; animation-delay:1.2s; }
    .bubble:nth-child(5) { left:75%; width:5px; height:5px; animation-duration:2.6s; animation-delay:0.5s; }
    @keyframes bubbleUp {
      0% { transform:translateY(0) scale(1); opacity:0.7; }
      100% { transform:translateY(-70px) scale(0.3); opacity:0; }
    }
    .steam {
      position:absolute; top:-15px; left:50%; transform:translateX(-50%);
      width:30px; height:20px;
      background:rgba(148,163,184,0.25); border-radius:50% 40% 60% 50%;
      filter:blur(8px); animation:steamRise 2.5s ease-out infinite;
    }
    @keyframes steamRise {
      0% { transform:translateY(0) scale(0.8); opacity:0.5; }
      100% { transform:translateY(-45px) scale(1.6); opacity:0; }
    }

    /* ── 404 text ── */
    .error-num {
      display:flex; align-items:center; justify-content:center; gap:12px;
      margin-bottom:8px;
    }
    .error-num span {
      font-size:clamp(4.5rem,14vw,9rem); font-weight:800; font-style:italic;
      color:#1e3a6e; line-height:1; display:inline-block;
      animation:bounceNum 2s ease-in-out infinite;
    }
    .error-num span:nth-child(1) { animation-delay:0s; }
    .error-num span:nth-child(2) { animation-delay:0.15s; }
    .error-num span:nth-child(3) { animation-delay:0.3s; }
    @keyframes bounceNum {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-12px); }
    }

    .error-text {
      font-size:1.3rem; font-weight:700; font-style:italic;
      color:#2563c7; margin-bottom:6px;
    }
    .error-sub {
      font-size:1rem; font-weight:600; font-style:italic;
      color:#4a78c8; opacity:0.85; margin-bottom:24px;
      max-width:400px; margin-left:auto; margin-right:auto;
    }
    .chem-formula {
      font-family:'Caveat',cursive; font-size:1.1rem; color:#6a8fc0;
      margin-bottom:28px; opacity:0.7;
    }

    /* ── Buttons ── */
    .btn-row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    .btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:12px 28px;
      background:rgba(255,255,255,0.8); backdrop-filter:blur(8px);
      border:2px solid rgba(74,120,200,0.3); border-radius:14px;
      color:#1e3a6e; text-decoration:none; font-weight:800; font-style:italic;
      font-size:1rem; transition:all 0.2s; cursor:pointer;
      font-family:'Nunito',sans-serif;
    }
    .btn:hover { background:#2563c7; color:#fff; border-color:#2563c7; transform:translateY(-2px); }
    .btn.secondary { background:rgba(255,255,255,0.6); }
    .btn.secondary:hover { background:rgba(74,120,200,0.8); color:#fff; }

    @media (max-width:480px) {
      .flask-wrap { width:90px; height:120px; }
      .error-num span { font-size:3.8rem; }
      .error-text { font-size:1.1rem; }
      .btn { padding:10px 20px; font-size:0.9rem; }
    }
  </style>
</head>
<body>

<!-- Floating molecules -->
<div class="molecule" style="font-size:2rem;">⚗️</div>
<div class="molecule" style="font-size:1.8rem;">🧬</div>
<div class="molecule" style="font-size:1.6rem;">🔬</div>
<div class="molecule" style="font-size:2rem;">🧪</div>

<div class="inner">

  <!-- Flask animation -->
  <div class="flask-wrap">
    <div class="steam"></div>
    <div class="flask-neck"></div>
    <div class="flask">
      <div class="liquid">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
      </div>
    </div>
  </div>

  <!-- 404 -->
  <div class="error-num">
    <span>4</span><span>0</span><span>4</span>
  </div>

  <p class="error-text">Reaction Not Found</p>
  <p class="error-sub">The page you were looking for has undergone a spontaneous decomposition. It might have sublimed into thin air, or perhaps it's just in a different oxidation state.</p>

  <p class="chem-formula">Page + Time → 404 + Energy ⚡</p>

  <div class="btn-row">
    <a class="btn" href="index.html">← Back to Home</a>
    <a class="btn secondary" href="past-papers.html">📚 Past Papers</a>
    <a class="btn secondary" href="simulation-models.html">🧪 Simulations</a>
  </div>

</div>

</body>
</html>

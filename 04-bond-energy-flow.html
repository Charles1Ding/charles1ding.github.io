<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bond Breaking &amp; Forming: Energy Flow</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#f1f5f9; color:#0f172a; min-height:100vh; padding:28px 18px;
    font-family:system-ui,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1000px; margin:0 auto; background:#fff; border:1px solid #e2e8f0; border-radius:26px;
    padding:32px 40px 42px; box-shadow:0 25px 50px -12px rgba(15,23,42,.25);}
  @media(max-width:640px){ .wrap{padding:22px 18px 30px;} }
  .hdr{text-align:center; margin-bottom:26px;}
  .hdr h1{margin:0 0 7px; font-size:31px; line-height:1.15; font-weight:900; letter-spacing:-.02em; color:#0f172a;}
  .hdr .sub{margin:0; font-size:16px; font-style:italic; color:#64748b;}
  @media(max-width:640px){ .hdr h1{font-size:24px;} }
  .legend{display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-bottom:24px; font-size:13.5px; font-weight:700; color:#475569;}
  .legend .it{display:inline-flex; align-items:center; gap:8px;}
  .legend .dot{width:15px; height:15px; border-radius:9999px; border:1px solid #334155; display:inline-block;}
  .ctrl{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center;
    background:#eff6ff; border:2px solid #dbeafe; border-radius:18px; padding:18px 22px;
    box-shadow:0 4px 6px -1px rgba(15,23,42,.06); margin-bottom:26px;}
  button.btn{border:none; border-radius:12px; padding:11px 20px; font-size:14px; font-weight:800;
    cursor:pointer; transition:background .18s,color .18s,transform .18s,box-shadow .18s;}
  button.btn:hover{transform:translateY(-1px);}
  button.btn.primary{background:#1d4ed8; color:#fff; box-shadow:0 10px 20px -10px rgba(29,78,216,.85);}
  button.btn.primary:hover{background:#1e40af;}
  button.btn.ghost{background:#fff; color:#1d4ed8; border:1.5px solid #bfdbfe;}
  button.btn.ghost:hover{background:#eff6ff;}
  button.btn.active{background:#1d4ed8; color:#fff; border-color:#1d4ed8; box-shadow:0 10px 20px -10px rgba(29,78,216,.85);}
  .stage{background:#f8fafc; border:1px dashed #cbd5e1; border-radius:18px; padding:10px; margin-bottom:26px;}
  .stage svg{width:100%; height:auto; display:block;}
  .summary{background:#0f172a; color:#e2e8f0; border-radius:18px; padding:22px 26px; font-size:15.5px; line-height:1.65; transition:background .35s;}
  .summary .em{color:#7dd3fc; font-weight:800;}
  .summary.hot{background:#064e3b;}
  .summary.hot .em{color:#a7f3d0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <h1>Bond Breaking &amp; Forming: Energy Flow</h1>
    <p class="sub">IG CIE 0620 · Chapter 8.2–8.3 · Breaking absorbs, forming releases</p>
  </header>
  <div class="legend" id="legend"></div>
  <div class="ctrl" id="controls"></div>
  <div class="stage">
    <svg id="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" aria-label="bond breaking and forming">
      <defs>
        <radialGradient id="gAmber" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
          <stop offset="42%" stop-color="#f59e0b" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gEmer" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#10b981" stop-opacity="0.95"/>
          <stop offset="42%" stop-color="#10b981" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="mols"></g>
      <g id="pkIn"></g>
      <g id="pkOut"></g>
      <rect x="150" y="286" width="340" height="62" rx="14" fill="#ffffff" fill-opacity="0.6" stroke="#e2e8f0" stroke-width="1"/>
      <rect id="barIn"  x="170" y="302" height="14" rx="7" fill="#f59e0b"/>
      <rect id="barOut" x="170" y="326" height="14" rx="7" fill="#10b981"/>
      <line id="dhAxis" x1="320" y1="294" x2="320" y2="342" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect id="dhMark" x="320" y="314" height="8" fill="#ef4444"/>
    </svg>
  </div>
  <div class="summary" id="summary"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function txt(x,y,s,fill,size){ const t=mk('text',{x:x,y:y,'text-anchor':'middle','dominant-baseline':'central',fill:fill,'font-size':size,'font-weight':'bold'}); t.textContent=s; return t; }
const COL={ H:{f:'#f1f5f9',s:'#94a3b8',t:'#475569'}, C:{f:'#cbd5e1',s:'#64748b',t:'#334155'},
  N:{f:'#3b82f6',s:'#1e3a8a',t:'#fff'}, O:{f:'#ef4444',s:'#991b1b',t:'#fff'},
  Cl:{f:'#f87171',s:'#b91c1c',t:'#fff'}, Br:{f:'#b91c1c',s:'#7f1d1d',t:'#fff'} };

const molsG=document.getElementById('mols');
const pkIn=document.getElementById('pkIn'), pkOut=document.getElementById('pkOut');
const barIn=document.getElementById('barIn'), barOut=document.getElementById('barOut');
const dhMark=document.getElementById('dhMark'), dhAxis=document.getElementById('dhAxis');
const _legend=document.getElementById('legend'), _controls=document.getElementById('controls'), _summary=document.getElementById('summary');

const BOND={'H-H':436,'Cl-Cl':243,'Br-Br':193,'H-Cl':432,'H-Br':366,'N≡N':945,'O=O':498,'N=O':632};
const RXNS={
  HCl:{ R:[['H','H',1],['Cl','Cl',1]], P:[['H','Cl',1],['H','Cl',1]], in:['H-H','Cl-Cl'], out:['H-Cl','H-Cl'] },
  HBr:{ R:[['H','H',1],['Br','Br',1]], P:[['H','Br',1],['H','Br',1]], in:['H-H','Br-Br'], out:['H-Br','H-Br'] },
  NO:{  R:[['N','N',3],['O','O',2]],    P:[['N','O',2],['N','O',2]],    in:['N≡N','O=O'], out:['N=O','N=O'] }
};
let key='HCl', playing=false, p=0, t=0;
function inTotal(){ return RXNS[key].in.reduce((s,k)=>s+BOND[k],0); }
function outTotal(){ return RXNS[key].out.reduce((s,k)=>s+BOND[k],0); }

const cxR=170, cxP=470, cy=140, cyA=cy-58, cyB=cy+58, stretch=74;

function makeMol(pair){
  const g=mk('g',{}), lines=[], atoms=[], order=pair[2];
  for(let k=0;k<order;k++){ const l=mk('line',{stroke:'#94a3b8','stroke-width':5,'stroke-linecap':'round'}); g.appendChild(l); lines.push(l); }
  [0,1].forEach(idx=>{
    const el=pair[idx], c=COL[el];
    const cg=mk('g',{});
    cg.appendChild(mk('circle',{r:17,fill:c.f,stroke:c.s,'stroke-width':1.4}));
    cg.appendChild(txt(0,0,el,c.t,15));
    g.appendChild(cg); atoms.push(cg);
  });
  molsG.appendChild(g);
  return {g:g,lines:lines,atoms:atoms,order:order};
}
function updMol(m,cx,cyy,gap,alpha,bondColor){
  m.g.setAttribute('opacity', Math.max(0,alpha).toFixed(3));
  m.lines.forEach((l,k)=>{ const off=(m.order===1)?0:(k-(m.order-1)/2)*8;
    l.setAttribute('x1',(cx-gap).toFixed(1)); l.setAttribute('y1',(cyy+off).toFixed(1));
    l.setAttribute('x2',(cx+gap).toFixed(1)); l.setAttribute('y2',(cyy+off).toFixed(1));
    l.setAttribute('stroke',bondColor); });
  m.atoms[0].setAttribute('transform','translate('+(cx-gap).toFixed(1)+','+cyy.toFixed(1)+')');
  m.atoms[1].setAttribute('transform','translate('+(cx+gap).toFixed(1)+','+cyy.toFixed(1)+')');
}
let mR1,mR2,mP1,mP2;
function build(){
  molsG.innerHTML='';
  const r=RXNS[key];
  mR1=makeMol(r.R[0]); mR2=makeMol(r.R[1]); mP1=makeMol(r.P[0]); mP2=makeMol(r.P[1]);
}

const pkI=[], pkO=[];
for(let i=0;i<7;i++){
  const g1=mk('g',{opacity:0}); g1.appendChild(mk('circle',{r:13,fill:'url(#gAmber)'})); g1.appendChild(mk('circle',{r:3.4,fill:'#fff','fill-opacity':0.9})); pkIn.appendChild(g1); pkI.push(g1);
  const g2=mk('g',{opacity:0}); g2.appendChild(mk('circle',{r:13,fill:'url(#gEmer)'}));  g2.appendChild(mk('circle',{r:3.4,fill:'#fff','fill-opacity':0.9})); pkOut.appendChild(g2); pkO.push(g2);
}

function setLegend(){ _legend.innerHTML='';
  [['#f59e0b','energy absorbed (bonds break)'],['#10b981','energy released (bonds form)']].forEach(it=>{ const s=document.createElement('span'); s.className='it';
    s.innerHTML='<i class="dot" style="background:'+it[0]+'"></i><span>'+it[1]+'</span>'; _legend.appendChild(s); }); }
function addButton(text,onClick,cls){ const b=document.createElement('button'); b.className='btn '+cls; b.textContent=text; b.addEventListener('click',()=>onClick(b)); _controls.appendChild(b); return b; }
let b1,b2,b3;
function setRxn(k){ if(!RXNS[k]) return; key=k; p=0; playing=false;
  b1.classList.toggle('active',k==='HCl'); b2.classList.toggle('active',k==='HBr'); b3.classList.toggle('active',k==='NO');
  build(); }
b1=addButton('H₂+Cl₂→2HCl', ()=>setRxn('HCl'), 'ghost');
b2=addButton('H₂+Br₂→2HBr', ()=>setRxn('HBr'), 'ghost');
b3=addButton('N₂+O₂→2NO', ()=>setRxn('NO'), 'ghost');
addButton('Play', ()=>{ playing=true; p=0; }, 'primary');
addButton('Reset', ()=>{ playing=false; p=0; }, 'ghost');
setLegend();

function render(){
  const breakP=Math.min(1,p/0.45), formP=Math.min(1,Math.max(0,(p-0.45)/0.55));
  const rAlpha=1-breakP*0.9, rBond=(rAlpha<0.6)?'#f59e0b':'#94a3b8';
  updMol(mR1,cxR,cyA, 26+stretch*breakP, rAlpha, rBond);
  updMol(mR2,cxR,cyB, 26+stretch*breakP, rAlpha, rBond);
  const pAlpha=formP*0.9+0.1, pBond=(formP<0.95)?'#10b981':'#94a3b8';
  updMol(mP1,cxP,cyA, 26+stretch*(1-formP), pAlpha, pBond);
  updMol(mP2,cxP,cyB, 26+stretch*(1-formP), pAlpha, pBond);

  pkI.forEach((g,i)=>{ const ph=((t*0.5+i*0.15)%1), a=breakP*(1-ph);
    g.setAttribute('opacity', Math.max(0,Math.min(1,a*1.3)).toFixed(3));
    g.setAttribute('transform','translate('+(cxR+Math.sin(i*1.7)*64).toFixed(1)+','+(40+(cyB-40)*ph).toFixed(1)+')'); });
  pkO.forEach((g,i)=>{ const ph=((t*0.5+i*0.15)%1), a=formP*ph;
    g.setAttribute('opacity', Math.max(0,Math.min(1,a*1.3)).toFixed(3));
    g.setAttribute('transform','translate('+(cxP+Math.sin(i*1.7+2)*64).toFixed(1)+','+(cyA+(40-cyA)*ph).toFixed(1)+')'); });

  const IN=inTotal()*breakP, OUT=outTotal()*formP, dH=IN-OUT, maxV=Math.max(inTotal(),outTotal(),1);
  barIn.setAttribute('width', Math.max(6,260*(IN/maxV)).toFixed(1));
  barOut.setAttribute('width', Math.max(6,260*(OUT/maxV)).toFixed(1));
  const frac=Math.max(-1,Math.min(1,dH/maxV)), wD=Math.abs(frac)*130;
  dhMark.setAttribute('fill', dH<=0?'#ef4444':'#3b82f6');
  if(dH<=0){ dhMark.setAttribute('x',(320-wD).toFixed(1)); dhMark.setAttribute('width',Math.max(4,wD).toFixed(1)); }
  else { dhMark.setAttribute('x','320'); dhMark.setAttribute('width',Math.max(4,wD).toFixed(1)); }

  if(p<0.45)
    _summary.innerHTML='Step 1 — <span class="em">break bonds</span>: energy is <span class="em">absorbed</span> (amber packets fly in). Reactant molecules split into separate atoms.';
  else if(p<1)
    _summary.innerHTML='Step 2 — <span class="em">form bonds</span>: energy is <span class="em">released</span> (emerald packets fly out). The atoms rejoin into product molecules.';
  else
    _summary.innerHTML='Overall ΔH = IN − OUT = '+(dH>0?'+':'')+dH.toFixed(0)+' kJ → <span class="em">'+(dH<=0?'exothermic (negative ΔH)':'endothermic (positive ΔH)')+'</span>. Breaking costs energy; forming pays it back.';
}
function frame(){ t+=1/60; if(playing){ p=Math.min(1,p+0.004); if(p>=1) playing=false; } render(); requestAnimationFrame(frame); }

setRxn('HCl');
requestAnimationFrame(frame);
</script>
</body>
</html>

    <script>
        // Chemistry State for Stomach
        const state = {
            vol: 0.5,         // Initial volume 0.5L (fasting stomach volume approx)
            n_hcl: 0.005,     // Initial HCl moles (yields roughly pH 2.0 at 0.5L)
            n_h2co3: 0.0,     // Moles of H2CO3
            n_base: 0.0,      // Moles of strong base added (simplification for antacid)
            
            // Calculated concentrations
            c_hcl: 0.0,       
            c_hco3: 0.0,      
            h_conc: 0.0,     
            oh_conc: 0.0,    
            ph: 2.00          
        };

        // Constants
        const Ka_H2CO3 = 4.3e-7; 
        const Kw = 1e-14;        
        const MAX_VOL = 2.0; // Max stomach volume in Liters

        // DOM Elements setup
        const DOM = {
            btnHcl: document.getElementById('add-hcl'),
            btnH2co3: document.getElementById('add-h2co3'),
            btnWater: document.getElementById('add-water'),
            btnBase: document.getElementById('add-base'),
            btnReset: document.getElementById('btn-reset'),
            
            dispVol: document.getElementById('display-vol'),
            dispH: document.getElementById('display-h'),
            dispPh: document.getElementById('display-ph'),
            phStatus: document.getElementById('ph-status'),
            
            liquidLevel: document.getElementById('liquid-level'),
            particlesContainer: document.getElementById('particles-container'),
            volAlert: document.getElementById('volume-alert')
        };

        function calculateChemistry() {
            // Net strong acid/base calculation
            // Base neutralizes HCl directly for simplicity in this model
            let net_strong_acid = state.n_hcl - state.n_base;
            let C_strong = net_strong_acid / state.vol; // Can be negative if base is in excess
            let C_h2co3 = state.n_h2co3 / state.vol;
            
            let h_conc = 0;

            if (C_strong >= 0) {
                // Acidic or neutral strong component
                if (C_h2co3 > 0) {
                    // Weak acid + strong acid
                    // x^2 + (C_strong + Ka)x - Ka * C_h2co3 = 0
                    let a = 1;
                    let b = C_strong + Ka_H2CO3;
                    let c = -Ka_H2CO3 * C_h2co3;
                    let x = (-b + Math.sqrt(b*b - 4*a*c)) / (2*a); // [HCO3-]
                    h_conc = C_strong + x;
                    state.c_hco3 = x;
                } else {
                    h_conc = C_strong;
                    state.c_hco3 = 0;
                }
                
                // Water autoionization correction for very dilute acids
                if (h_conc < 1e-6) {
                    let a_w = 1; let b_w = -h_conc; let c_w = -Kw;
                    h_conc = (-b_w + Math.sqrt(b_w*b_w - 4*a_w*c_w)) / (2*a_w);
                }
            } else {
                // Basic overall (Net base)
                let oh_conc = -C_strong; // approximate
                h_conc = Kw / oh_conc;
                state.c_hco3 = 0; // Simplified: ignore carbonate equilibrium in basic for this model
            }

            state.h_conc = h_conc;
            state.oh_conc = Kw / h_conc;
            state.ph = -Math.log10(h_conc);
            
            // For particles
            state.c_hcl = Math.max(0, C_strong);
        }

        function formatScientific(num) {
            if (num === 0) return "0";
            return num.toExponential(2).replace('e', ' × 10').replace('+', '');
        }

        function getLiquidColor(ph) {
            // Cutier pastel-ish liquid colors
            if (ph < 2.5) return 'rgba(251, 113, 133, 0.85)';  // Rose-400 (Healthy highly acidic)
            if (ph < 4) return 'rgba(251, 146, 60, 0.75)';     // Orange-400
            if (ph < 6) return 'rgba(250, 204, 21, 0.65)';     // Yellow-400
            if (ph < 7.5) return 'rgba(52, 211, 153, 0.6)';    // Emerald-400
            return 'rgba(96, 165, 250, 0.6)';                  // Blue-400
        }

        function getPhStatus(ph) {
            if (ph < 1.5) return { text: "极强酸性", color: "text-rose-500", bg: "bg-rose-950/50", shadow: "rgba(244,63,94,0.5)" };
            if (ph <= 3.5) return { text: "正常胃酸", color: "text-rose-400", bg: "bg-rose-900/30", shadow: "rgba(244,63,94,0.3)" };
            if (ph < 5.0) return { text: "弱酸性 (已稀释)", color: "text-orange-400", bg: "bg-orange-900/30", shadow: "rgba(2fb,115,22,0.3)" };
            if (ph < 6.5) return { text: "微酸性", color: "text-yellow-400", bg: "bg-yellow-900/30", shadow: "rgba(234,179,8,0.3)" };
            if (ph <= 7.5) return { text: "近中性", color: "text-emerald-400", bg: "bg-emerald-900/30", shadow: "rgba(16,185,129,0.3)" };
            return { text: "碱性", color: "text-blue-400", bg: "bg-blue-900/30", shadow: "rgba(59,130,246,0.3)" };
        }

        function updateUI() {
            DOM.dispVol.innerText = state.vol.toFixed(1);
            DOM.dispH.innerText = formatScientific(state.h_conc);
            
            // pH Display
            let phString = state.ph.toFixed(2);
            DOM.dispPh.innerText = phString;
            
            const status = getPhStatus(state.ph);
            DOM.dispPh.className = `text-7xl font-black ${status.color} tracking-tighter transition-colors duration-500`;
            DOM.dispPh.style.filter = `drop-shadow(0 0 15px ${status.shadow})`;
            
            DOM.phStatus.innerText = status.text;
            DOM.phStatus.className = `mt-2 text-sm font-medium ${status.color} ${status.bg} px-3 py-1 rounded-full inline-block border border-[${status.color}]/20`;

            // Liquid Level (Stomach mapping)
            // min vol 0.1L -> top ~85%
            // max vol 2.0L -> top ~10%
            let fillRatio = state.vol / MAX_VOL;
            fillRatio = Math.max(0.05, Math.min(1, fillRatio));
            // Convert ratio to css 'top' percentage for the clip-path bounding box
            // 1.0 ratio = 10% top (full), 0.0 ratio = 90% top (empty)
            let topPercent = 90 - (fillRatio * 80);
            
            DOM.liquidLevel.style.top = `${topPercent}%`;
            
            // Update gradient based on pH
            let color = getLiquidColor(state.ph);
            DOM.liquidLevel.style.background = `linear-gradient(to bottom, ${color}, rgba(15, 23, 42, 0.3))`;
        }

        function updateParticles() {
            DOM.particlesContainer.innerHTML = ''; 
            
            // Only tracking H+ for clarity now
            let numH = 0;

            if (state.ph < 7) {
                // Acidic: More H+ mapping
                let acidIntensity = 7 - state.ph; // 0 to ~6
                numH = Math.floor(acidIntensity * 10); 
            }

            // Cap limits for performance and visual clarity
            numH = Math.min(60, Math.max(0, numH));

            // Generate ONLY Hydrogen ions
            generateParticles(numH, 'ion-h', 'H⁺');
        }

        function generateParticles(count, className, label) {
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = `ion ${className}`;
                el.innerText = label;
                
                // Position logic relative to the liquid bounds inside the clip-path
                // X needs to be more constrained towards the middle to stay inside the stomach shape curve
                // Using a bell curve approximation for width spread based on depth
                const depthY = Math.random(); // 0 (top) to 1 (bottom)
                const yPos = depthY * 90 + 5; // 5% to 95%
                
                // Width varies by depth in stomach (wider in middle, narrower at bottom/top)
                // Simplified: restrict X heavily
                const widthFactor = Math.sin(depthY * Math.PI); // 0 at edges, 1 in middle
                const xSpread = 40 + (widthFactor * 40); // 40% to 80% spread
                const xPos = 50 + ((Math.random() - 0.5) * xSpread);
                
                el.style.left = `${xPos}%`;
                el.style.top = `${yPos}%`;
                
                const floatDelay = Math.random() * -5; 
                const popDelay = Math.random() * 0.3;
                el.style.animationDelay = `${floatDelay}s, ${popDelay}s`;
                
                DOM.particlesContainer.appendChild(el);
            }
        }

        function showVolumeAlert() {
            DOM.volAlert.style.opacity = '1';
            setTimeout(() => {
                DOM.volAlert.style.opacity = '0';
            }, 2000);
        }

        function checkVolume(addAmount) {
            if (state.vol + addAmount > MAX_VOL) {
                showVolumeAlert();
                return false;
            }
            return true;
        }

        const INGEST_COLORS = {
            hcl: { bg: 'radial-gradient(circle at 30% 30%, #fecdd3, #fb7185)', text: 'H⁺', size: '24px' },
            water: { bg: 'radial-gradient(circle at 30% 30%, #bfdbfe, #3b82f6)', text: '水', size: '22px' },
            h2co3: { bg: 'radial-gradient(circle at 30% 30%, #fef3c7, #f59e0b)', text: '酸', size: '24px' },
            base: { bg: 'radial-gradient(circle at 30% 30%, #e9d5ff, #a855f7)', text: '碱', size: '22px' }
        };

        function animateIngestion(type, callback) {
            const container = document.querySelector('.stomach-container');
            const config = INGEST_COLORS[type];
            // 水滴加得多一点，别的少一点
            const dropCount = type === 'water' ? 6 : 3; 
            
            // 计算当前液面的高度比例，让下落微粒在接触液面时消失
            let fillRatio = state.vol / MAX_VOL;
            fillRatio = Math.max(0.05, Math.min(1, fillRatio));
            let topPercent = 90 - (fillRatio * 80);

            let firstDropHit = false;

            for (let i = 0; i < dropCount; i++) {
                const drop = document.createElement('div');
                drop.className = 'falling-drop';
                drop.style.background = config.bg;
                drop.style.width = config.size;
                drop.style.height = config.size;
                drop.innerText = config.text;
                
                // 在食道入口（顶部中间）做轻微的左右随机偏移
                const offsetX = (Math.random() - 0.5) * 50;
                drop.style.left = `calc(50% + ${offsetX}px)`;
                
                // 设置 CSS 动画的目标 Y 坐标 (液面位置)
                drop.style.setProperty('--target-y', `${topPercent}%`);
                
                // 制造不同微粒下落的先后时间差
                const delay = i * 0.12;
                drop.style.animationDelay = `${delay}s`;
                
                container.appendChild(drop);
                
                // 当第一颗微粒“扑通”掉进液体时（大约在动画的 350ms 处），才更新并重新渲染整个液体系统
                if (!firstDropHit) {
                    firstDropHit = true;
                    setTimeout(() => {
                        callback();
                    }, (delay * 1000) + 350); 
                }

                // 动画播完后将临时微粒元素从 DOM 移除清理掉
                setTimeout(() => {
                    drop.remove();
                }, (delay * 1000) + 600); 
            }
        }

        function runSimulation() {
            calculateChemistry();
            updateUI();
            updateParticles();
        }

        function init() {
            DOM.btnHcl.addEventListener('click', () => {
                if(checkVolume(0)) { 
                    state.n_hcl += 0.005; // 瞬间记录状态，防止玩家光速狂点超出体积限制
                    animateIngestion('hcl', () => {
                        runSimulation(); // 等微粒掉进液体时更新 UI
                    });
                }
            });
            
            DOM.btnWater.addEventListener('click', () => {
                if(checkVolume(0.5)) {
                    state.vol += 0.5;
                    animateIngestion('water', () => {
                        runSimulation();
                    });
                }
            });

            DOM.btnH2co3.addEventListener('click', () => {
                if(checkVolume(0.5)) {
                    state.vol += 0.5;
                    state.n_h2co3 += 0.01;
                    animateIngestion('h2co3', () => {
                        runSimulation();
                    });
                }
            });
            
            DOM.btnBase.addEventListener('click', () => {
                if(checkVolume(0.05)) { 
                    state.vol += 0.05;
                    state.n_base += 0.008; 
                    animateIngestion('base', () => {
                        runSimulation();
                    });
                }
            });
            
            DOM.btnReset.addEventListener('click', () => {
                state.vol = 0.5;
                state.n_hcl = 0.005;
                state.n_h2co3 = 0.0;
                state.n_base = 0.0;
                runSimulation();
            });

            // Initial render
            runSimulation();
        }

        window.onload = init;
    </script>
